[[mutation]]
id = "runtime-arith-integral-scales-by-the-rounded-ratio"
area = "runtime_arithmetic"
describes = "the integral of a dd field is scaled once by the sample interval rounded to binary64, which leaves the result with the precision of binary64 instead of double-double"
file = "src/runtime/runner.cpp"
old = """        const Result<void> done = with_arithmetic(arith_type, [&]<class A>(std::type_identity<A>) {
          num::arith_scale<Space, A>(static_cast<double>(dt.num()), false, span_c(out, n),
                                     span_m(out, n), arith_limbs, arith_limbs);
          if (dt.den() != 1) {
            num::arith_scale<Space, A>(static_cast<double>(dt.den()), true, span_c(out, n),
                                       span_m(out, n), arith_limbs, arith_limbs);
          }
        });
"""
new = """        const Result<void> done = with_arithmetic(arith_type, [&]<class A>(std::type_identity<A>) {
          num::arith_scale<Space, A>(static_cast<double>(dt.num()) / static_cast<double>(dt.den()), false,
                                     span_c(out, n), span_m(out, n), arith_limbs, arith_limbs);
        });
"""
target = "fuse_runtime_arithmetic_field_runner_test"
test = "runtime.arithmetic_field_runner"

