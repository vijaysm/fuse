# --- shared sub-entity ownership and edge dofs -------------------------

[[mutation]]
id = "shared-sub-entity-minimum-owner-rule-reverted"
area = "physics-kit"
describes = "shared_sub_entity_owned_here reverts from the minimum rule (owner = MINIMUM over corner owner ranks) back to the earlier rule (owned here iff EVERY corner is owned here), which SharedSideOwnedByTheMinimumCornerOwnerRank exists to catch directly: for corners {v0 (owner 0, owned here), v2 (owner 1, not owned here)}, the earlier rule returns false (not every corner owned here) where the minimum rule returns true (min(0,1) == 0, this rank)."
file = "physics-kit/src/fe/dof_map.cpp"
# min_corner_owner_rank() does the minimum-over-corners computation (dof_map.cpp
# exposes it so DofMap's own ghost-resolution pass 3 can read a ghost
# key's CANDIDATE owner without duplicating this exact reduction); the
# MUTATION's own intent is to revert to "every corner owned here".
old = """bool shared_sub_entity_owned_here(const spatial::Mesh& mesh, const std::vector<spatial::EntityHandle>& corners) {
  if (corners.empty()) return false;
  const int minimum_owner = min_corner_owner_rank(mesh, corners);
  for (const auto corner : corners)
    if (mesh.is_vertex_owned(corner) && mesh.vertex_owner(corner) == minimum_owner) return true;
  return false;
}"""
new = """bool shared_sub_entity_owned_here(const spatial::Mesh& mesh, const std::vector<spatial::EntityHandle>& corners) {
  bool owned = !corners.empty();
  for (const auto corner : corners) owned = owned && mesh.is_vertex_owned(corner);
  return owned;
}"""
target = "fuse_physics_dof_map_test"
test = "physics.dof_map"

