[[mutation]]
id = "reducer-alltoallv-int64-default-corrupts-recv-counts"
area = "physics-kit"
describes = "Reducer::alltoallv(int64_t)'s single-participant default (comm.hpp) stops echoing send_counts into recv_counts (replaced with an all-zero assignment of the same length) -- the point-to-point exchange DofMap's ghost resolution and AlgebraicSystem's foreign-entry exchange both now depend on would silently report zero bytes received from every participant instead of what was actually sent. CommTest.SerialReducerInt64AlltoallvIsAnIdentityEcho's own EXPECT_EQ(recv_counts, send_counts) exists to catch exactly this."
file = "include/fuse/linalg/comm.hpp"
old = """  virtual std::vector<std::int64_t> alltoallv(const std::vector<std::int64_t>& send,
                                               const std::vector<int>& send_counts,
                                               std::vector<int>& recv_counts) const {
    FUSE_ASSERT(size() == 1,
               "Reducer::alltoallv(int64_t): no native override for size() == {} participants",
               size());
    recv_counts = send_counts;
    return send;
  }"""
new = """  virtual std::vector<std::int64_t> alltoallv(const std::vector<std::int64_t>& send,
                                               const std::vector<int>& send_counts,
                                               std::vector<int>& recv_counts) const {
    FUSE_ASSERT(size() == 1,
               "Reducer::alltoallv(int64_t): no native override for size() == {} participants",
               size());
    recv_counts.assign(send_counts.size(), 0);
    return send;
  }"""
target = "fuse_linalg_comm_test"
test = "linalg.comm"

