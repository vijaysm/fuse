[[mutation]]
id = "moab-placed-view-ignores-non-participation-under-a-real-communicator"
area = "backend"
describes = "Real-communicator mode: a rank outside its placement's sub-communicator (core == nullptr) must answer the empty view. Disabling the check routes it into the meshes-lookup branch instead, which for a non-participating rank finds a null entry and refuses E-MESH-PLACEMENT rather than answering empty -- a different, also-wrong, answer that the partition test below still catches (it asserts placed_view().ok())."
file = "src/backend/moab_backend.cpp"
old = "    if (!ctx.participates()) {\n      // This rank is outside the placement: the EMPTY view, never the"
new = "    if (false) {\n      // This rank is outside the placement: the EMPTY view, never the"
target = "fuse_parallel_moab_placed_view_mpi_test"
test = "parallel.moab_placed_view_mpi.3"
requires = "mpi"

[[mutation]]
id = "moab-set-placements-every-rank-joins-every-placement"
area = "backend"
describes = "The real split, MoabMeshBackend::set_placements: MPI_Comm_split's color must be MPI_UNDEFINED for a rank outside the placement, or every rank ends up inside every placement's sub-communicator, and 'each component holds the whole region over its own ranks' (docs/user/placement.md) stops being true -- every placement degenerates to the default decomposition under a different name. Caught by the partition test: the reduced owned-entity total over a placement's (now everyone's) ranks no longer equals the mesh's global count once compared against a placement that is genuinely a strict subset."
file = "src/backend/moab_backend.cpp"
old = "      const int color = mine ? 0 : MPI_UNDEFINED;"
new = "      const int color = 0;"
target = "fuse_parallel_moab_placed_view_mpi_test"
test = "parallel.moab_placed_view_mpi.3"
requires = "mpi"
