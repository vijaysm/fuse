# Mutations for KNOWN_ISSUES.md D61's collective reconciliation
# (include/fuse/abi/collective_reconcile.hpp, src/abi/participant.cpp).
# Own file per the review-fix protocol: do not edit build-evidence/
# mutations.toml directly while other fixers hold it dirty.
#
# Applied by hand, rebuilt, run, confirmed to fail EXACTLY the named
# rows, then restored byte-for-byte (cmp against the pre-mutation file
# showed no difference; md5 recorded in each row's own result).

[[mutation]]
id = "reconcile-local-statuses-comparison-removed"
area = "abi-collective-reconcile"
describes = "reconcile_local_statuses()'s own MPI_MINLOC-equivalent comparison is replaced with `if (false)`, so a peer's own refusal never overrides rank 0's own status -- the exact failure mode D61 exists to close: a rank-subset refusal never reconciled across the component's ranks"
file = "include/fuse/abi/collective_reconcile.hpp"
old = """    if (local_statuses[r] < out.status) {"""
new = """    if (false) {  // MUTATION: comparison removed, peers never override rank 0"""
target = "fuse_abi_collective_reconcile_test"
test = "abi.collective_reconcile"
result = "CONFIRMED 2026-10-18: 4 of 7 ReconcileLocalStatuses cases failed -- OneRefusalAmongManyWins, TheRefusingRankNeedNotBeRankZero, TwoDifferentRefusalsPickTheMoreNegativeCodeDeterministically, TiesBreakByTheLowestRank (every case where a NON-rank-0 entry should have won). EveryRankOkAgreesOk, SingleRankAlwaysOriginatesItsOwnStatus and EmptyInputIsDefensiveOk still passed (none of them needs a peer to override rank 0). Restored; cmp against the pre-mutation file reported no difference, md5 2a44fc94ac499899e8cf29b812e1d2f0 matches the restored file."
