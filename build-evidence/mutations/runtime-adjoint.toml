[[mutation]]
id = "runtime-adjoint-remap-applies-the-matrix-not-its-transpose"
area = "runtime_adjoint"
describes = "the adjoint of a remap applies the matrix instead of its transpose"
file = "src/runtime/runner_adjoint.cpp"
