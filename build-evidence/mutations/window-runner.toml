area = "runtime/iteration (resolve_regions, Unit 2b step (c) correction, D19)"
describes = "window_export_meta's third field (consulted by RegionBlock::window_hosted, the per-block convergence-ownership gate run_region() reads) must be whether the CONSUMER of this member's own export is hosted here (WindowMemberConfig::export_consumer_hosted), never whether the EXPORTER itself is (WindowMemberConfig::hosted) -- a window block's residual is measured through the compiled delivery chain (Transport/Epoch/Remap/Constrain/Diagnose), which runs on the CONSUMER's own processor set, not the exporter's. This is the defect a real host MPI run of parallel.window_runner_mpi.{2,3} found: on a disjoint-ranks channel, storing the exporter's own hosted flag here makes the exporting rank wrongly claim a block it never writes, and the consuming rank -- the only rank that does write it -- wrongly disclaim it, so decide_window_convergence() sums a stale 0/0 residual/reference pair and reports converged after exactly one sweep, with the partner's own state never updated (got.iterations_per_window[0] == 1 against a reference of 37; got.x_b_per_window[0] == 0.2, B's own unmodified initial value). Reverting to the exporter's own `cfg.hosted` reproduces exactly that inversion."
