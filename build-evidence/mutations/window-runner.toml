# residual block this is IMMEDIATELY overwritten a few dozen lines later,
# unconditionally whenever `b.window_export_capacity > 0` (which is true
# whenever the FIRST assignment ran at all, since both are gated by the
# SAME `window_export_meta.find()` success):
