# field (this mutation's target) carried `cfg.hosted` or
# `cfg.export_consumer_hosted`. `window_export_meta`'s `.hosted` field has
# exactly one reader in the whole tree (grepped: this one `found->second.
# hosted` assignment, nowhere else), and that reader's result is always
# discarded by the override above before `resolve_regions()` returns.
#
# VERIFIED by direct build-apply-run (90d98ee export, tier-0, no MPI,
# system /usr/bin/c++): with ONLY this mutation applied, `ctest -R
# ^runtime.window_hosting$` PASSES (22/22 unaffected) -- confirms
# SURVIVED. With the mutation STILL applied and the override block above
