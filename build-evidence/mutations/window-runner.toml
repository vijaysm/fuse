[[mutation]]
id = "window-runner-point-sample-instead-of-mean"
area = "runtime/window_coupler"
describes = "feeds a consumer's non-straddling substep the provider's point sample at the substep END (WindowChannelIO::boundary) instead of the provider's MEAN over the substep (WindowChannelIO::mean) -- the exact 'point samples instead of substep means' defect this track's task named. Second-order accuracy in the exchanged quantity depends specifically on feeding a mean (window_coupler.hpp's own class comment); a point sample is what a naive one-value-per-call reading of Component::advance()'s contract would do instead, and degrades the coupling scheme to first order."
file = "src/runtime/window_coupler.cpp"
old = """        for (std::size_t e = 0; e < m.length; ++e) {
          double mean_val = m.required[e];
          for (const WindowChannel& ch : channels_) {
            if (ch.consumer != i) continue;
            const Result<double> mv = channel_io_->mean(
                ch, e, delivered[ch.provider], sub.t0, sub.t1);
            if (!mv.ok()) return mv.error();
            mean_val = mv.value();
          }
          m.required[e] = mean_val;
        }"""
new = """        for (std::size_t e = 0; e < m.length; ++e) {
          double mean_val = m.required[e];
          for (const WindowChannel& ch : channels_) {
            if (ch.consumer != i) continue;
            const Result<double> mv = channel_io_->boundary(
                ch, e, delivered[ch.provider], sub.t1);
            if (!mv.ok()) return mv.error();
            mean_val = mv.value();
          }
          m.required[e] = mean_val;
        }"""
target = "fuse_runtime_window_coupler_test"
test = "runtime.window_coupler"
