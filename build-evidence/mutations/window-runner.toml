# front end for fuse::WindowCoupler: IterationRegionDecl::window_scope,
# fuse::WindowChannelIO, and the schedule()/Runner wiring). Own file per the
# review-fix protocol: do not edit build-evidence/mutations.toml directly
# while other tracks hold it dirty.
#
# STATE OF THIS FILE, HONESTLY: this delegation built and verified three of
# the track's four pieces (the region declaration's `window_scope` opt-in
# and its descriptor/YAML round trip; `WindowChannelIO`, the exchange seam
# WindowCoupler's sweep loop now calls instead of raw pointer arithmetic;
# and the design for the remaining schedule()/Runner wiring -- see this
# delegation's design notes) but did NOT build the wiring itself: schedule()
# does not yet call validate_coupling_window() for a window-scoped region,
# and no WindowChannelIO override performs a real Remap/Transport or a
# rank-agreed convergence verdict. Two of the three mutation rows this
# track's task named are properties of code that consequently does not
# exist yet:
#   * "routes the exchange around the Remap/Transport ops" -- there is no
#     Remap/Transport routing in the window path to route around. The
#     nearest existing analogue, WindowChannelIO's default direct-pointer
#     behaviour, IS "no remap/transport", by design (see
#     window_coupler.hpp): there is nothing to mutate FROM.
#   * "makes the convergence verdict rank-local" -- there is no cross-rank
#     convergence agreement in the window path (WindowCoupler is a
#     single-process, direct-pointer driver; see its own header). Mutating
#     "make it rank-local" presupposes a cross-rank reduction that has not
#     been written.
# Recording either as a "row" here without the code it mutates would be
# exactly what this project's standing rules forbid: a claim not backed by
# the tool output it derives from. They are left for whoever lands the
# wiring and the batching Remap/Transport override this design calls for;
# this file's row below is the one the CURRENT code supports and needed
# only WindowCoupler's own algorithm to exist.
#
# The rows below were proved BY HAND (tools/mutate.py was not run except
# --check-anchors, per this delegation's constraints): the edit in
# `old`/`new` was applied directly to the named file with edit_file, the
# named target was rebuilt, the named test was run and observed to fail
# with the message quoted in its own comment, then the file was restored
# and verified byte-identical to a backup with `cmp` before moving on.
#
# The row immediately below is the FIRST piece of the schedule()/Runner
# wiring itself (Unit C3, U1 of the follow-on delegation that made the
# Runner seed a new window exactly as WindowCoupler does): everything
# else in this file predates that wiring and mutates the driver
# (src/runtime/window_coupler.cpp) instead, per this file's own "STATE OF
# THIS FILE" note above.

