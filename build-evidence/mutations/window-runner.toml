[[mutation]]
id = "window-coupler-gaussseidel-sweep-ignores-topological-order"
area = "runtime/window_coupler"
describes = "WaveformIteration::GaussSeidel's sweep_order_ is always the bare declaration-order identity permutation, never topological_sweep_order()'s own result: the constructor's GaussSeidel branch is short-circuited false, so the main sweep loop iterates members in the order they were passed to WindowCoupler::create(), not the order the unlagged-channel graph actually requires. Invisible on every fixture that happens to declare its unlagged-channel provider member before its consumer (the two orders coincide by construction there); becomes Jacobi's own behaviour -- consumer reads the provider's SWEEP-START snapshot, not that SAME iterate's fresh output -- the moment a caller declares the provider member second."
file = "src/runtime/window_coupler.cpp"
old = """  if (cfg_.iteration == WaveformIteration::GaussSeidel) {
    sweep_order_ = *topological_sweep_order(members_.size(), channels_);
  } else {
    sweep_order_.resize(members_.size());
    for (std::size_t i = 0; i < members_.size(); ++i) sweep_order_[i] = i;
  }"""
new = """  if (false && cfg_.iteration == WaveformIteration::GaussSeidel) {  // MUTATED: always declaration order
    sweep_order_ = *topological_sweep_order(members_.size(), channels_);
  } else {
    sweep_order_.resize(members_.size());
    for (std::size_t i = 0; i < members_.size(); ++i) sweep_order_[i] = i;
  }"""
target = "fuse_runtime_window_coupler_test"
test = "runtime.window_coupler"
