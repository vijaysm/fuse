# `ch` here is `graph.channel_at(origin)`, and `origin` is the RESIDUAL
# node's OWN `.origin` field -- set directly, unconditionally, to the
# region's own declared channel `c` at Residual-node construction
# (`src/ir/regions.cpp`: `ctx.dag.add_node(OpKind::Residual, {it->second},
# res, OpAttrs{}, c, ...)`), never derived from the hop-walk that resolves
# `window_export_meta` itself. So for ANY graph reaching this far, `ch` IS
