[[mutation]]
id = "window-runner-new-instance-uses-period-relative-dst-step"
area = "runtime/iteration (advance_window)"
describes = "commit 7939643: Runner::Impl::advance_window()'s own 'is this the first sweep of a new window instance' detection, and its T0/T1 computation, use Instruction::dst_step directly instead of window_absolute_instance(cfg, ins.dst_step) -- dst_step is PERIOD-relative (it resets to 0 every run_period() call, since the compiled TimedDag spans exactly one period and is replayed verbatim), so a window-scoped region with exactly one window instance per period sees dst_step==0 on EVERY run_period() call, not just the first, and silently never advances past window 0: every SECOND and later call to run_period() leaves every window member's state frozen bit-identically."
file = "src/runtime/iteration.cpp"
old = """  const std::int64_t absolute_instance =
      window_absolute_instance(cfg, ins.dst_step);"""
new = """  const std::int64_t absolute_instance = ins.dst_step;  // MUTATED: period-relative, not absolute"""
target = "fuse_runtime_window_runner_multirate_test"
test = "runtime.window_runner_multirate"
