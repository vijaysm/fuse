[[mutation]]
id = "nodal-trigger-misses-two-single-rank-placements"
area = "runtime"
describes = "The round-5 condition. `src_ranks > 1 || dst_ranks > 1` asks whether either placement is partitioned; what matters is whether the two TOGETHER sit on one rank. At exactly two ranks a disjoint pair is one rank EACH, so the old form took the rank-local path even though no rank held both sides, and a real host run failed with E-INTERP-NOGEOMETRY ('they hold 7 and 0 entities'). Reverting to it restores that."
file = "src/runtime/runner.cpp"
old = """    const bool both_on_one_rank =
        src_ranks == 1U && dst_ranks == 1U &&
        (src_set == nullptr || dst_set == nullptr ||
         src_set->min_rank() == dst_set->min_rank());"""
new = "    const bool both_on_one_rank = src_ranks == 1U && dst_ranks == 1U;"
target = "fuse_parallel_nodal_remap_runner_test"
test = "parallel.nodal_remap_runner.2"
requires = "mpi"
# SURVIVED explained, verified by hand (Tier 0, standalone harness linked
# against this library, no MPI): DisjointRankSets' own two channels
# ("consistent" nodal-source, "consistent-transpose" nodal-target) both
# match remap_moves_placement()'s orientation exactly (fuse/model/
# remap_kind.hpp), so resolve_remap's `moves_placement` is unconditionally
# TRUE whenever the two components' ranks genuinely differ -- independent
# of, and always agreeing with, whatever `both_on_one_rank` computes. The
# OR at resolve_remap's guard (`!both_on_one_rank || moves_placement || ...`)
# is satisfied by `moves_placement` alone on this test's own channels, so
# the mutation is fully masked there: applying it by hand and rebuilding
# left DisjointRankSets' equivalent (SerialMeshBackend, declared disjoint
# single ranks, no real MPI needed since the decision is graph-declared)
# completely unaffected.
#
# The gap is real but narrower than "needs two ranks": `both_on_one_rank`
# is the ONLY gate whenever a channel's method does NOT match its nodal
# side's orientation (remap_moves_placement() == false), which is lowered
# via a real Transport instead of the Epoch-only path -- a shape no
# existing test in this file builds. Added
# NodalRemapRunnerMpi.DisjointSingleRankPlacementRefusesMismatchedOrientation
# (test/parallel/nodal_remap_runner_test.cpp) to isolate exactly that:
# same disjoint-single-rank pair, "consistent-transpose" paired with a
# NODAL SOURCE (orientation mismatch). Confirmed by hand: correct code
# refuses with E-RT-REMAP-NODAL-PARALLEL ("source: 1, target: 1"); with
# the mutation applied, `both_on_one_rank` wrongly reports true, the whole
# nodal-parallel check is skipped, and the OLD rank-local path reports a
# DIFFERENT code, E-RT-REMAP-SIZE, instead -- a kill an EXACT error-code
# check (not a bare `ASSERT_FALSE(r.ok())`) catches. The new test needs no
# real MPI to decide (same declarative-only argument this row's own
# describes field already makes), and was additionally compiled
# (Tier 1, MPI-enabled) but not run here.

