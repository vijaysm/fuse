# Mutations for the native-mesh track (native distributed mesh + RCB-driven
# repartition migration). Own file per the review-fix protocol: do not edit
# build-evidence/mutations.toml directly while other fixers hold it dirty.

[[mutation]]
id = "migrate-incomplete-assignment-refusal-disabled"
area = "backend"
describes = "pack_for_migration's E-MESH-MIGRATE-INCOMPLETE rejection (dest.size() must equal the owned cell count) is disabled. Without it, a destination array one entry short or long is accepted, silently misassigning every cell from the short point onward -- rcb_moab's own historical failure mode (MeshMigration.cpp, HANDOFF.md) of cells destroyed without a trace."
file = "src/backend/native_migration.cpp"
old = "  if (dest.size() != nowned) {"
new = "  if (false) {"
target = "fuse_backend_native_migration_test"
test = "backend.native_migration"

[[mutation]]
id = "migrate-vertex-dedup-disabled"
area = "backend"
describes = "unpack_migrated_mesh's dedup-by-global-id (a vertex already seen keeps its FIRST local index) is disabled, so every incoming copy of a shared vertex becomes a NEW vertex instead of being merged. A cell touching a previously-unpacked vertex then references the wrong (duplicate) copy, breaking connectivity -- rcb_moab's 'orphaned vertices' failure mode."
file = "src/backend/native_migration.cpp"
old = "        if (it == vertex_by_gid.end()) {"
new = "        if (true) {"
target = "fuse_backend_native_migration_test"
test = "backend.native_migration"

[[mutation]]
id = "shared-face-apex-rule-ignores-global-id"
area = "backend"
describes = "canonical_fan_triangulation's rotation to the MINIMUM-GLOBAL-ID corner is disabled (apex stays local index 0), so the fan's diagonal pattern depends on each cell's own LOCAL vertex numbering instead of the face's global ids. Two cells sharing a face but numbering its corners differently then triangulate it differently, which is exactly the gap/overlap defect the shared-face rule (docs/dev/native-mesh.md) exists to prevent -- caught here by the two differently-numbered hexes sharing a face."
file = "src/backend/native_geometry.cpp"
old = "    if (global_ids[i] < global_ids[apex]) apex = i;"
new = "    if (false) apex = i;"
target = "fuse_backend_native_distributed_mesh_test"
test = "backend.native_distributed_mesh"

[[mutation]]
id = "vertex-ownership-rule-picks-max-not-min-rank"
area = "backend"
describes = "resolve_vertex_ownership's cross-rank agreement (a vertex's new owner is the MINIMUM rank holding a copy of it) is flipped to maximum. This is a cross-rank property -- kNullComm agrees with itself trivially -- so only a real MPI run exercises the Allgatherv agreement; requires = mpi, and RepartitionConservesGlobalCellCountAndMeasureAndUniqueIds is the test, compiled here but not run (this sandbox cannot start mpiexec)."
file = "src/backend/native_migration.cpp"
old = "      if (it == min_rank_of.end() || r < it->second) min_rank_of[gid] = r;"
new = "      if (it == min_rank_of.end() || r > it->second) min_rank_of[gid] = r;"
target = "fuse_backend_native_migration_mpi_test"
test = "backend.native_migration_mpi.2"
requires = "mpi"

[[mutation]]
id = "tetrahedron-volume-factor-wrong"
area = "backend"
describes = "canonical_cell_tetrahedra's star-shapedness check and every cell measure it feeds depend on tetrahedron_volume's 1/6 scalar-triple-product factor. Corrupting it to 1/5 makes every 3D cell's reported measure wrong by a constant factor -- caught by the closed-form hex/tet/prism/pyramid volume tests and the migration measure-conservation tests, any of which would still 'conserve' the WRONG total if this factor were shared consistently, but none of which would match the analytic 1.0 a unit box must report."
file = "src/backend/native_geometry.cpp"
old = "  return std::abs(dot(t.a - t.d, cross(t.b - t.d, t.c - t.d))) / 6.0;"
new = "  return std::abs(dot(t.a - t.d, cross(t.b - t.d, t.c - t.d))) / 5.0;"
target = "fuse_backend_native_distributed_mesh_test"
test = "backend.native_distributed_mesh"

[[mutation]]
id = "every-placement-gets-this-ranks-slice-of-the-whole-run"
area = "backend/native (register_default_placements)"
describes = "A component's placed view must be its mesh decomposed over THAT component's ranks, indexed by this process's position within them -- not this process's slice of a decomposition over the whole base communicator. The two agree on one process, which is why this stood until a run put each component in its own executable: a 6x6 mesh on a component alone at rank 2 of 3 comes back as 12 cells instead of 36, and two such components share no global ids at all, so no exchange between them can be built."
file = "src/backend/native_backend.cpp"
old = "      if (hosted_here) {"
new = "      if (false) {"
target = "fuse_backend_native_generators_test"
test = "backend.native_generators"

# ---------------------------------------------------------------------------
# The "Halo" track: a planar/volumetric remap halo for NativeMeshBackend
# (docs/dev/native-halo.md, src/backend/native_halo.cpp). Hand-proven against
# a scratch copy of the checkout: each row applied, fuse_backend_native_halo
# _test rebuilt and run WHOLE AND UNFILTERED (12 tests, 5 suites, no
# --gtest_filter), the failing/passing split recorded below, the file
# restored and `cmp`'d byte-identical against the pristine checkout.
# ---------------------------------------------------------------------------

[[mutation]]
id = "native-halo-covering-set-always-empty"
area = "backend/native (covering_set_destinations)"
describes = "covering_set_destinations's own-rank exclusion (`if (owner == my_rank) continue`) is corrupted to `if (true) continue`, so EVERY candidate destination is skipped and no owned source cell is ever sent anywhere -- the covering set is always empty, exactly the gap this whole track exists to close. Hand-verified: 12 tests run, 9 pass, 3 fail (NativeHaloCoveringSet.NamesEveryOverlappingOtherRankOnceEachSortedAscending, NativeHaloQuadGrid.ThreeRanksMisalignedAdoptsExactlyWhatTheOracleComputes, NativeHaloBuildWeights.ThreeRanksMisalignedCompleteWeightsAndLinearFieldReproduction); restored file cmp byte-identical."
file = "src/backend/native_halo.cpp"
old = "      if (owner == my_rank) continue;  // already local to its own target"
new = "      if (true) continue;  // already local to its own target"
target = "fuse_backend_native_halo_test"
test = "backend.native_halo"

[[mutation]]
id = "native-halo-adopted-cells-marked-owned"
area = "backend/native (merge_halo_cells)"
describes = "merge_halo_cells's new (adopted) non-polyhedron cell is appended with is_owned = true instead of false, so a halo copy silently becomes an OWNED cell on the receiving rank -- owned_count would widen, double-counting that cell in any conservation sum restricted to owned entities (MeshView's own is_owned contract). Hand-verified: 12 tests run, 10 pass, 2 fail (NativeHaloPackMerge.RoundTripAdoptsExactlyTheRequestedCellsAsNonOwnedCopies, NativeHaloQuadGrid.ThreeRanksMisalignedAdoptsExactlyWhatTheOracleComputes -- the latter because its own oracle counts a cell as adopted by gid-in-the-new-non-owned-set, which is now empty on the receiving side's accounting); restored file cmp byte-identical."
file = "src/backend/native_halo.cpp"
old = "        new_local_cell = builder.add_cell(type, closure, cell_gid, sender_owner_rank, false);"
new = "        new_local_cell = builder.add_cell(type, closure, cell_gid, sender_owner_rank, true);"
target = "fuse_backend_native_halo_test"
test = "backend.native_halo"

[[mutation]]
id = "native-halo-ghost-pattern-owned-index-off-by-one"
area = "backend/native (pack_one_halo_cell)"
describes = "pack_one_halo_cell writes owned_block_idx + 1 onto the wire instead of owned_block_idx, so every adopted cell's fuse::linalg::GhostPattern::remote_local_index is off by one -- the exact defect class this row names, and the one a real make_mpi_exchanger would reproduce bit-for-bit from the same corrupted wire value. Hand-verified: 12 tests run, 10 pass, 2 fail (NativeHaloPackMerge.RoundTripAdoptsExactlyTheRequestedCellsAsNonOwnedCopies, which pins owner_owned_index[0] == 1 exactly; NativeHaloBuildWeights.ThreeRanksMisalignedCompleteWeightsAndLinearFieldReproduction, whose ghost field values are now read from the WRONG owned-block slot); restored file cmp byte-identical. RE-ANCHORED 2026-10-15 (Migration track): pack_one_halo_cell no longer exists -- pack_halo_cells now calls fuse::native::device::pack_fanout (mesh_pack_device.hpp), whose write_record is where every halo record, including this owned_block_idx field, is written now; the mutation itself (an off-by-one on the wire) is unchanged, only its source location moved."
file = "include/fuse/backend/native/mesh_pack_device.hpp"
old = "    append_pod_at<std::int64_t>(dst, pos, owned_block_idx);"
new = "    append_pod_at<std::int64_t>(dst, pos, owned_block_idx + 1);"
target = "fuse_backend_native_halo_test"
test = "backend.native_halo"

[[mutation]]
id = "native-halo-boxes-overlap-degenerate-axis-tolerance"
area = "backend/native (boxes_overlap)"
describes = "boxes_overlap's degenerate-axis guard (a bare touch-exclusion margin is applied only on an axis where at least one box has real extent -- see the function's own comment on why an UNGUARDED margin breaks every planar pair outright, z being lo==hi==0 for every cell) is disabled by forcing `degenerate` to always false, so the margin applies even on a mesh's own flat z axis and EVERY pair -- touching or genuinely overlapping -- is excluded there. Hand-verified: 12 tests run, 9 pass, 3 fail (NativeHaloCoveringSet.NamesEveryOverlappingOtherRankOnceEachSortedAscending, NativeHaloQuadGrid.ThreeRanksMisalignedAdoptsExactlyWhatTheOracleComputes, NativeHaloBuildWeights.ThreeRanksMisalignedCompleteWeightsAndLinearFieldReproduction -- the same three as the covering-set-always-empty row above, and the same failure mode this mutation's own regression, measured during development and not hypothesized, first exposed); restored file cmp byte-identical."
file = "src/backend/native_halo.cpp"
old = "    const bool degenerate =\n        (a.hi[kk] - a.lo[kk] < kDegenerateWidth) && (b.hi[kk] - b.lo[kk] < kDegenerateWidth);"
new = "    const bool degenerate = false;"
target = "fuse_backend_native_halo_test"
test = "backend.native_halo"
