[[mutation]]
id = "fixed-point-residual-feed-value-arc-not-restored"
area = "runtime"
describes = "S7.2's own `commit`/`skip_restore` gate (added after this row was first written) now wraps this exact block; the mutation keeps the SAME effect -- short-circuiting the condition to `false` -- rather than re-deriving a new one, since the defect this row exists to catch (the restore never running) is identical either way. The restore step's own snapshot-restore of every block's feed arc (the component Requires storage the caller's x was delivered into) and value arc is skipped entirely, while component save_state()/restore_state() and the carried-arc restore still run. A caller's out-of-band residual evaluation then leaves the LAST x it evaluated sitting in every member's own Requires storage, so a later, ordinary Picard sweep over the same region starts from that stale delivered value instead of from what the region's own schedule last delivered -- a silent perturbation of the Runner's subsequent behaviour, not a crash."
file = "src/runtime/fixed_point_residual.cpp"
old = """  if (!skip_restore) {
    for (std::size_t bi = 0; bi < R.blocks.size(); ++bi) {
      const detail::RegionBlock& b = R.blocks[bi];
      if (!feed_snapshot[bi].empty()) {
        num::copy(feed_snapshot[bi].data(), slots[b.feed_arc].data, b.length);
      }
      if (!value_snapshot[bi].empty()) {
        num::copy(value_snapshot[bi].data(), slots[b.value_arc].data, b.length);
      }
    }
  }"""
new = """  if (false) {
    for (std::size_t bi = 0; bi < R.blocks.size(); ++bi) {
      const detail::RegionBlock& b = R.blocks[bi];
      if (!feed_snapshot[bi].empty()) {
        num::copy(feed_snapshot[bi].data(), slots[b.feed_arc].data, b.length);
      }
      if (!value_snapshot[bi].empty()) {
        num::copy(value_snapshot[bi].data(), slots[b.value_arc].data, b.length);
      }
    }
  }"""
target = "fuse_runtime_fixed_point_residual_test"
test = "runtime.fixed_point_residual"
result = "KILLED (2026-10-10): FixedPointResidual.EvaluatingFDoesNotPerturbTheRunnersOwnPicardIteration FAILED (probed.neumann->u()/probed.dirichlet->q() after the Runner's own run() diverged from a fresh baseline run's values -- e.g. u[0] 293.566... vs 293.582..., q[3] 52.617... vs -218.426...); the other 5 cases in the binary still PASSED. Restored; cmp against the pre-mutation file reported no difference."

