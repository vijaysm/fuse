# Substrate track (plan S7.2b phase 2 closing): the per-region DISPATCH
# call site, not the eager setup-time check above -- a defect here is
# invisible to any test built from a SINGLE Newton region (every such
# region's own config already names the substrate the mutation hard-codes,
# Native, so a single-region test cannot tell the two apart), and is caught
# only by a graph with two Newton regions naming genuinely DIFFERENT
# substrates, exactly what TwoNewtonRegionsInOneRunnerDispatchToTheirOwn
# SubstrateIndependently (test/runtime/newton_region_test.cpp) builds.

[[mutation]]
id = "newton-region-dispatch-ignores-own-config-substrate"
area = "runtime"
describes = "run_region_newton()'s own dispatch call site passes a HARD-CODED NewtonSubstrate::Native to resolve_newton_substrate() instead of decl.newton_config.substrate -- every Newton-selected region would solve through whichever substrate is registered for Native, regardless of what its own graph declaration names, defeating per-region selection silently rather than refusing (every SINGLE-region test with substrate left at its own default, Native, is unaffected and cannot distinguish this from correct code)."
file = "src/runtime/iteration.cpp"
old = """  const Result<const num::NewtonSolveFn*> substrate_fn =
      resolve_newton_substrate(R.name, decl.newton_config.substrate);
  if (!substrate_fn.ok()) return substrate_fn.error();

  const Result<num::NewtonResult> solved =
      (*substrate_fn.value())(f, x, precond_apply, refresh_precond, opt,
