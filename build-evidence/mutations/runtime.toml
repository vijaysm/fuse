# Mutations for S7.1 (the Newton-Krylov residual/linearisation seam):
# src/runtime/fixed_point_residual.cpp, Runner::Impl::evaluate_region_
# residual(). Own file per the review-fix protocol: do not edit
# build-evidence/mutations.toml directly while other tracks hold it dirty.
#
# The row below was applied by hand, rebuilt (`cmake --build . --target
# fuse_runtime_fixed_point_residual_test`), run UNFILTERED, and confirmed
# to produce the result recorded in `result` before being restored
# byte-for-byte (`cmp` against the pre-mutation file showed no
# difference). Build directory: /tmp/seam/b0 (tier 0, this track's own
# scratch build).
#
# NOT A HYPOTHETICAL DEFECT: this is the exact bug the first
# implementation of evaluate_region_residual() shipped with, caught by
# the test named below before this row was ever written -- the mutation
# merely reproduces it on demand so the kill is reproducible evidence
# rather than a one-time debugging session.

[[mutation]]
id = "fixed-point-residual-feed-value-arc-not-restored"
area = "runtime"
describes = "the restore step's own snapshot-restore of every block's feed arc (the component Requires storage the caller's x was delivered into) and value arc is skipped entirely (wrapped in `if (false) { ... }`), while component save_state()/restore_state() and the carried-arc restore still run. A caller's out-of-band residual evaluation then leaves the LAST x it evaluated sitting in every member's own Requires storage, so a later, ordinary Picard sweep over the same region starts from that stale delivered value instead of from what the region's own schedule last delivered -- a silent perturbation of the Runner's subsequent behaviour, not a crash."
file = "src/runtime/fixed_point_residual.cpp"
old = """  for (std::size_t bi = 0; bi < R.blocks.size(); ++bi) {
    const detail::RegionBlock& b = R.blocks[bi];
    if (!feed_snapshot[bi].empty()) {
      num::copy(feed_snapshot[bi].data(), slots[b.feed_arc].data, b.length);
    }
    if (!value_snapshot[bi].empty()) {
      num::copy(value_snapshot[bi].data(), slots[b.value_arc].data, b.length);
    }
  }"""
new = """  if (false) {
  for (std::size_t bi = 0; bi < R.blocks.size(); ++bi) {
    const detail::RegionBlock& b = R.blocks[bi];
    if (!feed_snapshot[bi].empty()) {
      num::copy(feed_snapshot[bi].data(), slots[b.feed_arc].data, b.length);
    }
    if (!value_snapshot[bi].empty()) {
      num::copy(value_snapshot[bi].data(), slots[b.value_arc].data, b.length);
    }
  }
  }"""
target = "fuse_runtime_fixed_point_residual_test"
test = "runtime.fixed_point_residual"
result = "KILLED (2026-10-10): FixedPointResidual.EvaluatingFDoesNotPerturbTheRunnersOwnPicardIteration FAILED (probed.neumann->u()/probed.dirichlet->q() after the Runner's own run() diverged from a fresh baseline run's values -- e.g. u[0] 293.566... vs 293.582..., q[3] 52.617... vs -218.426...); the other 5 cases in the binary still PASSED. Restored; cmp against the pre-mutation file reported no difference."
