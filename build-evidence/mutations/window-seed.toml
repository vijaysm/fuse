[[mutation]]
id = "d76-aitken-reject-nonpositive-omega-removed"
area = "num/accel_relaxation (AitkenAccel::update(), reject-a-non-positive-candidate guard)"
describes = "The Stage E safeguard (reject a non-positive or non-finite secant candidate and restart to omega0_) is replaced by the pre-Stage-E unguarded acceptance rule: any finite, nonzero candidate is used verbatim, including a negative one -- reproducing D76's own measured window-3 stagnation."
file = "src/num/accel_relaxation.cpp"
old = """      if (den > 0.0 && std::isfinite(den) && std::isfinite(num)) {
        const double candidate = -omega_ * num / den;
        if (std::isfinite(candidate) && candidate > 0.0) {
          w = candidate;
        } else {
          // Reject a non-positive (or non-finite) candidate: restart to
          // omega0_ rather than keep using a value no convergent
          // stationary relaxation could ever equal.
          w = omega0_;
        }
      }
"""
new = """      if (den > 0.0 && std::isfinite(den) && std::isfinite(num)) {
        // MUTATION: accept any finite, nonzero candidate, including a
        // negative one -- the pre-Stage-E behaviour.
        const double candidate = -omega_ * num / den;
        if (std::isfinite(candidate) && candidate != 0.0) w = candidate;
      }
"""
target = "fuse_num_accelerator_test"
test = "num.accelerator"
result = """KILLED (tools/mutate.py, --area "num/accel_relaxation (AitkenAccel::update(), reject-a-non-positive-candidate guard)", --build-dir build-tier0, system compiler /usr/bin/cc + /usr/bin/c++, tier 0, no MPI): the new crafted-sequence unit test, Accelerator.AitkenRejectsANonPositiveCandidateAndRestartsToOmega0, fails under the mutation -- EXPECT_EQ(out1, 6.0) sees 4.0 instead (the unguarded formula's own -0.5*2 relaxed step from x_old=5), exactly the RED value the manual check (before writing this mutation row) measured by hand-reverting the guard. Every other test in fuse_num_accelerator_test (54 of 55) still passes under the mutation, including DivergenceFallsBackToTheUnderRelaxedStepWhenItSurvives's own Aitken block, re-engineered this round to use a downward (not upward) residual perturbation specifically so it still exercises the OVERFLOW-recovery path under the guarded formula; that re-engineering means the mutation does not accidentally get caught by a test built for a different purpose."""
