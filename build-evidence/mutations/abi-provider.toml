file = "src/abi/provider_adapter.cpp"
old = """#if defined(KOKKOS_ENABLE_CUDA) || defined(KOKKOS_ENABLE_HIP) || defined(KOKKOS_ENABLE_SYCL)
        // (allocation happens below, in the per-field storage block)
#else
        return fuse::Failure{
            "E-ABI-PROVIDER-NO-DEVICE","""
new = """#if defined(KOKKOS_ENABLE_CUDA) || defined(KOKKOS_ENABLE_HIP) || defined(KOKKOS_ENABLE_SYCL)
        // (allocation happens below, in the per-field storage block)
#elif 0
        return fuse::Failure{
            "E-ABI-PROVIDER-NO-DEVICE","""
target = "fuse_abi_conformance_test"
