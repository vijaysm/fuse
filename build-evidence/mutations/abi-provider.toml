[[mutation]]
id = "provider-device-allocation-memspace-forced-host"
area = "abi-provider"
describes = "ProviderAdapter::register_fields()'s per-field storage block is forced to allocate host-resident storage (fuse::MemorySpace::Host) even for a field whose describe() asked for FUSE_MEMSPACE_DEVICE, instead of the Kokkos::View device_storage_[i] allocation Option A specifies -- this branch is reached only past BOTH refusal gates above, which on a build with no CUDA/HIP/SYCL backend (every tier-0 build in this tree) are unconditional: wants_device can never be true when this line runs here, so this row is reported NOT KILLABLE ON THIS BUILD rather than silently declared equivalent (see result)"
file = "src/abi/provider_adapter.cpp"
old = """        field_space = fuse::MemorySpace::Device;
        has_device_fields_ = true;"""
new = """        field_space = fuse::MemorySpace::Host;
        has_device_fields_ = true;"""
target = "fuse_abi_device_layout_test"
test = "abi.device_layout"
requires = "device"
result = "SURVIVED on a real device build (ssh:higgs, GTX 1050 Ti, sm_61; D15 round 6, 2026-10-21, this track): ctest -R '^abi.conformance$' (this row's own designated test) stays green with this mutation applied, but NOT because the mutated behaviour is unobservable -- build_has_device is true here, yet the only live ConformanceTest row that reaches wants_device==true past BOTH refusal gates on a device build is DISABLED_MixedHostAndDeviceFieldsOnOneProviderConvergeThroughChannels, which plain ctest never runs (gtest's own DISABLED_ convention) and which cannot pass on this build regardless (its own plugin segfaults dereferencing a device pointer from host code; see KNOWN_ISSUES.md D15 round 6, Part 1). NOT declared EQUIVALENT: test/abi/device_layout_test.cpp's own DeviceLayoutAndCopies.DeviceOutLayoutMatchesDerivedAoSAndEveryElementIsExact, built this same round with a plugin that writes its device field through a real Kokkos kernel, DOES distinguish this mutation (forcing field_space to Host instead of Device changes what the Runner's own E-RT-SPACE/layout machinery sees) -- confirmed by hand (not re-run through mutate.py, whose own test field still names abi.conformance): the assertion that would kill it is DeviceOutLayoutMatchesDerivedAoSAndEveryElementIsExact's own EXPECT_EQ(view.memspace, FUSE_MEMSPACE_DEVICE) and its per-(entity,component) value checks, through test = \"abi.device_layout\", not abi.conformance. Whether to widen this row's own test field to abi.device_layout is the owner's call (open_questions, D15 round 6)."

[[mutation]]
id = "provider-device-advance-fence-removed"
area = "abi-provider"
describes = "ProviderAdapter::advance()'s unconditional post-advance fence (Kokkos::fence(\"provider_adapter_advance_fence\"), gated only on has_device_fields_) is removed, so a provider with at least one device-resident field returns from advance() without the runtime ever waiting for its own queued device work to finish -- has_device_fields_ can only become true past both refusal gates above, which are unconditional on a build with no CUDA/HIP/SYCL backend, so this row too is reported NOT KILLABLE ON THIS BUILD (see result), the same structural consequence as the allocation-memspace row"
file = "src/abi/provider_adapter.cpp"
old = """    if (has_device_fields_) {
      Kokkos::fence("provider_adapter_advance_fence");
    }"""
new = """    if (false && has_device_fields_) {
      Kokkos::fence("provider_adapter_advance_fence");
    }"""
target = "fuse_abi_device_layout_test"
test = "abi.device_layout"
requires = "device"
result = "SURVIVED on a real device build (ssh:higgs; D15 round 6, 2026-10-21, this track), for the SAME structural reason as provider-device-allocation-memspace-forced-host immediately above: ctest -R '^abi.conformance$' stays green because that row's own designated test never reaches a provider with has_device_fields_ true (the only one that would, the DISABLED_ row, is not run by plain ctest and cannot pass on this build's own plugin regardless -- KNOWN_ISSUES.md D15 round 6, Part 1). NOT declared EQUIVALENT: a provider whose advance() actually launches a device kernel without the post-advance Kokkos::fence() (test/abi/device_layout_test.cpp's own device_layout_provider.cpp calls Kokkos::fence() itself, inside the plugin, so ProviderAdapter's own fence removal here is not exercised by that specific test as written) remains a live, distinguishable defect on a real device build in principle -- not proven killed by an existing test this round, so recorded SURVIVED rather than EQUIVALENT (which would claim no test anywhere could distinguish the two branches)."
