result = """CONFIRMED (hand-applied to a scratch tree, captured with the gtest binary run directly rather than through mutate.py's own output-suppressed sweep): ConformanceTest.PluginDeviceFieldOnAHostOnlyBuildIsRefused still FAILS with this mutation applied (the refusal arm replaced with #elif 0, dead code on this tier-0 build with no CUDA/HIP/SYCL backend), but by a DIFFERENT, pre-existing check than the one this row names: initialize() still returns FUSE_ERR_RUNTIME, and the test's own EXPECT_STREQ(err.code, "E-ABI-PROVIDER-NO-DEVICE") (conformance_test.cpp:1501) fails because err.code reads "E-RT-SPACE" instead -- with this gate compiled out, register_fields() incorrectly accepts device_out as Device-memspace, and src/runtime/runner.cpp:341's own PRE-EXISTING, unrelated space-consistency check (view.space() != MemorySpace::Host && RunnerConfig::execution_space != Device) refuses it later, at region-binding time, because this fixture never sets execution_space to Device. This mutation is KILLED, but by a Runner-level check, not by the E-ABI-PROVIDER-NO-DEVICE gate this row names. Verbatim captured output: "test/abi/conformance_test.cpp:1501: Failure / Expected equality of these values: / err.code / Which is: \"E-RT-SPACE\" / \"E-ABI-PROVIDER-NO-DEVICE\"". The other 30 ConformanceTest cases still passed. Restored; cmp against the pre-mutation file reported no difference."""

[[mutation]]
id = "provider-device-allocation-memspace-forced-host"
area = "abi-provider"
describes = "ProviderAdapter::register_fields()'s per-field storage block is forced to allocate host-resident storage (fuse::MemorySpace::Host) even for a field whose describe() asked for FUSE_MEMSPACE_DEVICE, instead of the Kokkos::View device_storage_[i] allocation Option A specifies -- this branch is reached only past BOTH refusal gates above, which on a build with no CUDA/HIP/SYCL backend (every tier-0 build in this tree) are unconditional: wants_device can never be true when this line runs here, so this row is reported NOT KILLABLE ON THIS BUILD rather than silently declared equivalent (see result)"
file = "src/abi/provider_adapter.cpp"
old = """        field_space = fuse::MemorySpace::Device;
        has_device_fields_ = true;"""
new = """        field_space = fuse::MemorySpace::Host;
        has_device_fields_ = true;"""
target = "fuse_abi_device_layout_test"
test = "abi.device_layout"
requires = "device"
result = "SURVIVED on a real device build (a CUDA host, GTX 1050 Ti, sm_61). ctest -R '^abi.conformance$' still stays green with this mutation applied, although ConformanceTest.MixedHostAndDeviceFieldsOnOneProviderConvergeThroughChannels runs under plain ctest and DOES reach wants_device==true past both refusal gates -- it still does not kill this mutation, measured directly (hand-applied, rebuilt, ctest -R '^abi.conformance$' 100% passed, and that row alone confirmed PASSED). Traced, not assumed: this mutation only relabels field_space as Host while leaving the underlying allocation genuinely device-resident (Kokkos::resize(device_storage_[i], ...) is unchanged), so the pointer the plugin receives is unaffected and its value-producing write still succeeds; that row's own assertions check only the delivered VALUES (MixedMemspaceSink's host_history/device_history), never fuse_field_view.memspace or any other layout property the mislabeling corrupts. NOT declared EQUIVALENT: test/abi/device_layout_test.cpp's own DeviceLayoutAndCopies.DeviceOutLayoutMatchesDerivedAoSAndEveryElementIsExact still DOES distinguish this mutation, through its own EXPECT_EQ(view.memspace, FUSE_MEMSPACE_DEVICE) and per-(entity,component) value checks, test = \"abi.device_layout\", not abi.conformance. Whether to widen this row's own test field to abi.device_layout, or add a view.memspace check to the abi.conformance row so it also kills this mutation, is open."

[[mutation]]
id = "provider-device-advance-fence-removed"
area = "abi-provider"
describes = "ProviderAdapter::advance()'s unconditional post-advance fence (Kokkos::fence(\"provider_adapter_advance_fence\"), gated only on has_device_fields_) is removed, so a provider with at least one device-resident field returns from advance() without the runtime ever waiting for its own queued device work to finish -- has_device_fields_ can only become true past both refusal gates above, which are unconditional on a build with no CUDA/HIP/SYCL backend, so this row too is reported NOT KILLABLE ON THIS BUILD (see result), the same structural consequence as the allocation-memspace row"
file = "src/abi/provider_adapter.cpp"
old = """    if (has_device_fields_) {
      Kokkos::fence("provider_adapter_advance_fence");
    }"""
new = """    if (false && has_device_fields_) {
      Kokkos::fence("provider_adapter_advance_fence");
    }"""
target = "fuse_abi_device_layout_test"
test = "abi.device_layout"
requires = "device"
result = "SURVIVES BY DESIGN, NOT DECLARED EQUIVALENT. Measured on a CUDA host: with the adapter's post-advance fence removed by hand the mixed row passed 10 of 10 and abi.device_layout passed. The design never depends on that fence or on cross-stream visibility of a device pointer: plugins fence their own device work (both device fixtures now do), and the adapter's fence is kept as a defensive measure. No test is therefore to be written that pins it. requires = device keeps this row NOT-ASSESSED on a host-only build."