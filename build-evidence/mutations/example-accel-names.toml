[[mutation]]
id = "accel-names-unknown-falls-back-to-none"
area = "example-accel-names"
describes = "an unrecognised name returns AccelKind::None instead of std::nullopt -- the exact behaviour examples/brusselator had, where a misspelled --accel ran with no acceleration without a word"
file = "examples/common/accel_names.hpp"
old = """  if (s == "iqn-imvj") return fuse::AccelKind::IQN_IMVJ;
  return std::nullopt;"""
new = """  if (s == "iqn-imvj") return fuse::AccelKind::IQN_IMVJ;
  return fuse::AccelKind::None;  // MUTATION: unknown name silently becomes None"""
target = "fuse_verification_accel_names_test"
test = "verification.accel_names"
result = "KILLED by tools/mutate.py --area example-accel-names on a tier-0 tree exported from the working files (2026-10-21): 5 killed, 0 declared equivalent, 0 not assessed, 0 without a baseline, 0 not killed, of 5; verification.accel_names fails."

