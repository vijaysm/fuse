# Mutations for S7.1 (the Newton-Krylov residual/linearisation seam):
# fuse::verify_newton_capability_support() (model-level capability
# refusal, E-NEWTON-CAPABILITY) and fuse::verify_linearization_shape()
# (E-NEWTON-SHAPE). Own file per the review-fix protocol: do not edit
# build-evidence/mutations.toml directly while other tracks hold it dirty.
#
# Every row below was applied by hand against the files,
# rebuilt (`cmake --build . --target fuse_model_newton_capability_test`),
# run UNFILTERED, and confirmed to produce the result recorded in each
# row's own `result` key before being restored byte-for-byte (`cmp`
# against the pre-mutation file showed no difference). Build directory:
# /tmp/seam/b0 (tier 0, the scratch build).

[[mutation]]
id = "newton-capability-residual-bit-unchecked"
area = "model"
describes = "verify_newton_capability_support()'s own residual-capability gate is short-circuited to never fire (`false && requires_residual && ...`), so a Newton region that requires kCapabilityResidual no longer refuses a member that lacks it."
file = "src/runtime/checkpoint_support.cpp"
old = """    const std::uint64_t caps = impl->capabilities();
    if (requires_residual && (caps & kCapabilityResidual) == 0) {"""
new = """    const std::uint64_t caps = impl->capabilities();
    if (false && requires_residual && (caps & kCapabilityResidual) == 0) {"""
target = "fuse_model_newton_capability_test"
test = "model.newton_capability"
result = "KILLED: NewtonCapability.ComponentWithoutResidualCapabilityIsRejected and NewtonCapability.RegionRequiringResidualRejectsAComponentLackingIt both FAILED (the E-NEWTON-CAPABILITY diagnostic the test asserts on never appears); the other 11 cases in the binary still PASSED. Restored; cmp against the pre-mutation file reported no difference."

[[mutation]]
id = "newton-capability-linearization-bit-unchecked"
area = "model"
describes = "verify_newton_capability_support()'s own linearization-capability gate is short-circuited to never fire, so a Newton region that requires kCapabilityLinearization no longer refuses a member with the residual capability but not the linearisation one."
file = "src/runtime/checkpoint_support.cpp"
old = """    if (requires_linearization && (caps & kCapabilityLinearization) == 0) {"""
new = """    if (false && requires_linearization && (caps & kCapabilityLinearization) == 0) {"""
target = "fuse_model_newton_capability_test"
test = "model.newton_capability"
result = "KILLED: NewtonCapability.ComponentWithResidualButNotLinearizationIsRejected FAILED; the other 12 cases still PASSED. Restored; cmp reported no difference."

[[mutation]]
id = "newton-shape-check-disabled"
area = "model"
describes = "fuse::verify_linearization_shape() (fuse/runtime/component.hpp)'s own rows()/cols() comparison is short-circuited to never fire, so a LinearizationToken of the wrong shape is silently accepted instead of refused with E-NEWTON-SHAPE."
file = "include/fuse/runtime/component.hpp"
old = """  if (token.rows() != expected_rows || token.cols() != expected_cols) {"""
new = """  if (false && (token.rows() != expected_rows || token.cols() != expected_cols)) {"""
target = "fuse_model_newton_capability_test"
test = "model.newton_capability"
result = "KILLED: NewtonCapability.TokenWithWrongRowsIsRejected and NewtonCapability.TokenWithWrongColsIsRejected both FAILED; the other 11 cases still PASSED. Restored; cmp reported no difference."

# S7.2's own rows: AccelKind::Newton selectable from the graph, both in C++
# (IterationBuilder::accelerate()/::newton()) and through the YAML text
# format (src/model/yaml_io.cpp) -- the auto-trigger that sets
# requires_residual_capability/requires_linearization_capability the
# moment Newton is selected, so neither spelling can select Newton and
# silently skip the capability gate above. Same hand-proof discipline:
# backed up, mutated, rebuilt with `cmake --build <dir> --target <target>`,
# run UNFILTERED, restored, `cmp`-verified byte-identical.

[[mutation]]
id = "newton-builder-accelerate-auto-trigger-removed"
area = "model"
describes = "IterationBuilder::accelerate() no longer sets requires_residual_capability/requires_linearization_capability when AccelKind::Newton is selected -- a graph authored with .accelerate({.kind = AccelKind::Newton}) would silently carry no capability requirement at all, so a component lacking fuse::ImplicitComponent would never be refused."
file = "include/fuse/model/coupling_graph.hpp"
old = """  t.acceleration = cfg;
  if (cfg.kind == AccelKind::Newton) {
    t.requires_residual_capability = true;
    if (t.newton_config.use_block_jacobi_preconditioner) {
      t.requires_linearization_capability = true;
    }
  }
  return *this;
}

inline IterationBuilder& IterationBuilder::initial_relaxation"""
new = """  t.acceleration = cfg;
  return *this;
}

inline IterationBuilder& IterationBuilder::initial_relaxation"""
target = "fuse_runtime_newton_region_test"
test = "runtime.newton_region"
result = "Hand-proved: 7 cases, all pass before; after mutation, 2 fail (NewtonRegion.AccelerateWithNewtonKindSetsRequiresResidualCapability, which checks the flag directly, and NewtonRegion.GraphLevelNewtonSelectionRefusesAComponentLackingResidualCapability, which carries the flag through lower()/verify_iteration_region() to the actual E-NEWTON-CAPABILITY refusal), 5 pass. File restored and cmp-verified byte-identical; rebuilt and reran to confirm all 7 pass again."

[[mutation]]
id = "newton-yaml-deserialize-auto-trigger-removed"
area = "model"
describes = "yaml_io.cpp's deserialize-side auto-trigger (the same rule accelerate() applies in C++, repeated on the read path so a HAND-WRITTEN YAML file gets the identical protection) is disabled, so a YAML file that selects acceleration.kind: Newton but never writes requires_residual_capability: true explicitly comes back with that flag false -- silently bypassing the capability gate for every YAML-authored graph, even though the SAME graph built in C++ via .newton()/.accelerate() would have been protected."
file = "src/model/yaml_io.cpp"
old = """    if (d.acceleration.kind == AccelKind::Newton) {"""
new = """    if (false) {"""
target = "fuse_model_yaml_io_test"
test = "model.yaml_io"
result = "Hand-proved: 23 cases, all pass before; after mutation, 1 fails (YamlIo.HandWrittenYamlSelectingNewtonGetsTheCapabilityFlagEvenWhenOmitted, which strips the explicit capability keys from the emitted text before reparsing, isolating exactly this auto-trigger), 22 pass. File restored and cmp-verified byte-identical; rebuilt and reran to confirm all 23 pass again."

# Descriptor v12's own row: AccelKind::Newton is encoded on the wire only
# if deserialize()'s accelerator-kind bound check was actually widened to
# admit it. The pre-v12 bound (AccelKind::IQN_IMVJ, ordinal 6) is what
# every reader checked before S7.2; this mutation reverts to exactly
# that, so a buffer carrying AccelKind::Newton (ordinal 7) is refused as
# E-DESC-ENUM -- the same failure a genuinely un-widened reader would
# produce for every Newton-selected graph, not a corrupted-byte probe.

[[mutation]]
id = "descriptor-accel-kind-bound-not-widened"
area = "model"
describes = "deserialize()'s accelerator-kind bound check is reverted to the pre-v12 bound (AccelKind::IQN_IMVJ, ordinal 6) instead of AccelKind::Newton (ordinal 7), so a buffer that correctly serialized AccelKind::Newton is refused on read with E-DESC-ENUM -- the descriptor would silently never be able to carry a Newton-selected region, even though serialize() already writes it."
file = "include/fuse/model/descriptor.hpp"
old = """    if (accel_kind > static_cast<std::uint8_t>(AccelKind::Newton)) {"""
new = """    if (accel_kind > static_cast<std::uint8_t>(AccelKind::IQN_IMVJ)) {"""
target = "fuse_model_descriptor_test"
test = "model.descriptor"
result = "Hand-proved: 21 cases, all pass before; after mutation, 1 fails (Descriptor.RoundTripPreservesEveryNonDefaultMember, whose freeze_fixture() second region selects AccelKind::Newton and is refused on deserialize() with 'unknown acceleration kind 7'), 20 pass. MatchesTheFrozenWaistBytes is unaffected (it only calls serialize(), never deserialize()) -- expected, not a gap: RoundTripPreservesEveryNonDefaultMember is the test that exercises the read path. File restored and cmp-verified byte-identical; rebuilt and reran to confirm all 21 pass again."

# descriptor v13's own row (S7.2b, PetscSelect track): NewtonConfig::
# substrate's own bound check, mirroring descriptor-accel-kind-bound-
# not-widened immediately above for the identical reason -- a reader
# that never refuses an out-of-range substrate byte would admit a
# corrupted or adversarially-constructed descriptor as if it named
# NewtonSubstrate::Native or ::Petsc, silently misreading whatever
# enumerator the byte's own numeric value happened to be past.

[[mutation]]
id = "descriptor-newton-substrate-bound-not-widened"
area = "model"
describes = "deserialize()'s own newton_config.substrate bound check is disabled (if (false) instead of if (substrate_byte > ...)), so an out-of-range substrate byte is accepted and static_cast onto NewtonSubstrate silently, rather than refused with E-DESC-ENUM -- a corrupted descriptor's substrate byte would read back as an enumerator that was never written, exactly the class of silent misread every other enum bound check on this wire exists to prevent."
file = "include/fuse/model/descriptor.hpp"
old = """      if (substrate_byte > static_cast<std::uint8_t>(NewtonSubstrate::Petsc)) {"""
new = """      if (false) {"""
target = "fuse_model_descriptor_test"
test = "model.descriptor"
result = "Hand-proved, /tmp/petscselect/b0 (tier-0 without PETSc): 21 cases, all pass before; after mutation, 1 fails (Descriptor.RejectsCorruptedIterationRegionEnums -- its own newton_substrate_out_of_range case: deserialize() accepts the out-of-range substrate byte 2 instead of refusing E-DESC-ENUM), 20 pass. File restored and md5/cmp-verified byte-identical; rebuilt and reran to confirm all 21 pass again."
