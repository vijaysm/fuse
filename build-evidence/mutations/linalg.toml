[[mutation]]
id = "schur-slab-wrap-coupling-dropped"
area = "linalg"
describes = "SchurSlabSolver::factor's own 2*nx-row contribution to the assembled Schur complement writes the periodic-wrap coupling (this rank's FIRST interface row to its predecessor's LAST interface row) only when rank != 0, silently dropping it for rank 0 specifically -- the 'wrap coupling dropped' row the task names explicitly. Dropping it from only ONE side of the coupling (the other rank's own symmetric write, 'last row <-> successor's first row', is untouched) is what makes this mutation meaningful at all: the Schur complement is explicitly symmetrised before its dense LDLT factorisation (src/linalg/schur_slab.cpp's own comment on that line explains why -- Eigen::LDLT's default Lower mode reads only one triangle, so a bug that corrupts only the discarded triangle would otherwise never reach the factorisation), so a HALF-dropped coupling survives as a measurable, half-strength value rather than vanishing. Killed at tier 0 by every multi-partition case that includes rank 0 (all of them, since rank 0 always owns the first row band): the periodic-wrap case (SchurSlabSolverPeriodicWrap) and every SchurSlabSolverMultiPartition case."
file = "src/linalg/schur_slab.cpp"
