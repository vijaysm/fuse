[[mutation]]
id = "derivative-gate-adjoint-transpose-swapped-for-apply"
area = "linalg"
describes = "adjoint_gate's own apply_transpose(y, aty) call replaced by apply(y, aty) -- the 'the adjoint check with apply_transpose swapped for apply' mutation. A SYMMETRIC operator cannot distinguish this mutation at all (apply and apply_transpose compute the same thing), which is exactly why the random-nonsymmetric 50x50 DistSparseMatrix case in adjoint_cases() is load-bearing for this row specifically, not merely for the adjoint identity in general: its own apply_transpose is built from independently re-assembled, row/col-swapped triplets (transpose_of()), never derived from apply() by any relation the mutation could leave intact."
file = "include/fuse/linalg/derivative_gate.hpp"
old = """  if (Result<void> r = apply_transpose(y, aty); !r.ok()) return r.error();"""
new = """  if (Result<void> r = apply(y, aty); !r.ok()) return r.error();"""
target = "fuse_linalg_derivative_gate_test"
test = "linalg.derivative_gate"
