id = "krylov-pcg-beta-stale-rz"
area = "linalg"
describes = "pcg's Polak-Ribiere-style beta = (r,z)_new / (r,z)_old divides the NEW inner product by itself instead of the previous iteration's -- the 'beta uses the stale rz' mutation row the task names explicitly, making beta exactly 1.0 on every iteration regardless of the actual conjugacy the recurrence needs. Killed at tier 0 by the periodic-Laplacian and random-SPD iterate-for-iterate comparisons against Eigen::ConjugateGradient (a beta of 1.0 is a different search direction from iteration 2 on, so the traces diverge immediately), the ill-conditioned recompute-discipline case, and the Jacobi-converges-faster case; survived only by the two refusal cases, which never reach a second iteration's beta at all."
file = "include/fuse/linalg/pcg.hpp"
old = """    const double beta = rz_new / rz_old;"""
new = """    const double beta = rz_old / rz_old;"""
