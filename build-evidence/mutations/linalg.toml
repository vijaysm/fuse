[[mutation]]
id = "krylov-pcg-preconditioner-skipped"
area = "linalg"
describes = "pcg's main-loop z <- M^-1 r is replaced by z <- r (the identity's own effect) -- the 'the preconditioner skipped' mutation row the task names explicitly. A constant-diagonal matrix (the periodic Laplacian, every diagonal entry equal) cannot distinguish this: M = c*I is a scalar multiple of the identity for CG, which leaves every iterate's DIRECTION unchanged and only rescales a quantity CG's own ratios cancel out again, so that case survives by coincidence, not by the preconditioner actually having been skipped. A matrix with a genuinely VARYING diagonal (the random SPD case) cannot: killed there from iteration 2 on, once the single un-mutated initial precondition-and-build-p step (before this loop starts) stops dominating the trajectory."
file = "include/fuse/linalg/pcg.hpp"
old = """    if (Result<void> s = m.apply(r, z); !s.ok()) return s.error();
    const double rz_new = r.dot(z);"""
new = """    z.copy_from(r);
    const double rz_new = r.dot(z);"""
target = "fuse_linalg_pcg_test"
test = "linalg.pcg"
