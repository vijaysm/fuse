area = "linalg"
describes = "pcg's candidate-convergence check tests the CHEAP RECURRENCE residual's own norm (already known true, by construction, at that point in the branch) instead of the FRESHLY RECOMPUTED one before reporting convergence -- the 'stopping test on the recurrence residual instead of the recomputed one' mutation row the task names explicitly, with the instruction that the test must be designed so the two differ. PcgRecomputesTrueResidual's ill-conditioned diagonal matrix (condition number 1e12, rel_tol 1e-13) is exactly that design: the recurrence first reads below tolerance while an independently recomputed residual is still far above it, so the mutated code reports a convergence this test's own independent recompute (done outside the solver entirely) rejects. The five other, well-conditioned cases cannot tell the difference -- their recurrence and recomputed residuals already agree closely enough that trusting either gives the same answer -- which is the reason this needed its own purpose-built matrix rather than being caught by the general iterate-for-iterate comparisons."
file = "include/fuse/linalg/pcg.hpp"
old = """      if (true_norm <= opt.rel_tol * b_norm) {"""
new = """      if (recurrence_norm <= opt.rel_tol * b_norm) {"""
target = "fuse_linalg_pcg_test"
test = "linalg.pcg"
