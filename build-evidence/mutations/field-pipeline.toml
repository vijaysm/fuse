[[mutation]]
id = "layout-well-formed-off-by-one-stride"
area = "field"
describes = "Layout::well_formed() reverts to the one-unit-too-conservative disjointness bound that rejects valid padded/strided layouts (R-29)"
file = "include/fuse/field/field_ref.hpp"
old = """      const bool interleaved =
          stride > detail::sat_mul(nc - 1, cs);
      const bool blocked =
          stride >= 1 && cs > detail::sat_mul(count - 1, stride);"""
new = """      const bool interleaved = stride >= detail::sat_mul(nc, cs);
      const bool blocked = stride >= 1 && cs >= detail::sat_mul(count, stride);"""
target = "fuse_field_pipeline_test"
test = "field.pipeline"
