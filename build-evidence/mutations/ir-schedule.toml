# Mutations for the ir/schedule fix pass (REVIEW.md R-26, R-27, R-43, R-44).
# Placed in its own file per the review-fix protocol: do not edit
# build-evidence/mutations.toml directly while other fixers hold it dirty.
#
# NOTE for the lead: fixing R-43/R-44 (IR-F4) restructured the multi-writer
# combine's tie-break in src/ir/lowering.cpp from a single pass into two
# (first find the greatest `iterate` across all writers, then resolve
# anchor/offset only among writers tied at it -- a single pass can flag a
# false ambiguity from an older tie while a later, strictly-newer writer
# would have been the unambiguous answer). That rewrite deletes the line
# Replaces build-evidence/mutations.toml's "merge-typed-at-first-writer", retired when the
# R-27/R-43 rewrite removed the line it anchored on; same regression, new code shape.

[[mutation]]
id = "merge-typed-at-first-writer-v2"
area = "compiler"
describes = "the combined value inherits the first writer's time level regardless of a later writer's offset (the axis the sweep's random lag placement actually varies -- it excludes iteration regions, so every generated writer already ties on `iterate`), instead of the newest contribution's -- the same regression the now-stale 'merge-typed-at-first-writer' anchored on the pre-two-pass code (R-27/R-43/R-44). Verified by hand: applying this mutation fails schedule.acyclicity_sweep (a False/0u mismatch on the independently-computed loop verdict); the sibling attempt anchored on the `iterate`-reduction line one loop up is a confirmed NO-OP against this test, because the sweep generator never produces a writer set spanning more than one `iterate` value -- do not reintroduce that anchor as this mutation's replacement."
file = "src/ir/lowering.cpp"
old = "        } else if (b.offset > a.offset) {"
new = "        } else if (false) {"
target = "fuse_schedule_acyclicity_sweep_test"
test = "schedule.acyclicity_sweep"

[[mutation]]
id = "merge-not-folded-past-three-writers"
area = "compiler"
describes = "a 4+ writer Merge reverts to one oversized N-ary node instead of a left-fold of pairwise merges, so it compiles past lower() and then fails schedule() with E-SCHED-ARITY (R-27)"
file = "src/ir/lowering.cpp"
old = "      if (writers.size() <= kMaxMergeInputs) {"
new = "      if (true) {"
target = "fuse_schedule_plan_test"
test = "schedule.plan"

# The two mutations below guard N-ir-schedule-2
# (docs/dev/reviews/2026-09-19/pass2/re-ir-schedule.md), found while fixing
# that report's N-ir-schedule-1 IMPROVEMENT: extending
# schedule.acyclicity_sweep to also call schedule() immediately turned up a
# real BLOCKER, not just a coverage gap. A Merge combining two or more
# channels carries `ChannelId{}` origin (fuse/ir/lowering.cpp -- it is not
# any one of them), so `expand()`'s "no channel claimed" boundary handling
# placed it at its owning component's tick START, the convention meant for
# Source and an unwritten Sink. When any of its writers actually crosses
# ranks (needs a real Transport/Epoch pair, unlike every writer in
# five_writer_merge()'s fixture above, which are all colocated with the
# target and so never gain one), that pair runs at the tick's END and Merge
# sorted before it, failing the scheduler's own dependence check with
# E-SCHED-ORDER on an entirely ordinary graph. Two mutations because the fix
# touches two independent code paths -- expand()'s lockstep fast path and
# its general path -- each hand-verified by reverting just that one line,
# rebuilding, and confirming the cited test fails; `tools/mutate.py` was not
# run (see the header note: it edits repository sources in place, unsafe
# against a checkout six fixers share).

[[mutation]]
id = "merge-placed-at-tick-start-lockstep"
area = "compiler"
describes = "in the lockstep fast path, a Merge combining two or more channels is placed at its owning component's tick START (the Source/unwritten-Sink convention) instead of the tick END its Transport/Epoch inputs land on, so it sorts before them and schedule() fails E-SCHED-ORDER on any graph where a writer is not colocated with the merge target"
file = "src/schedule/expand.cpp"
old = "    } else if (n.kind == OpKind::Merge) {"
new = "    } else if (false) {"
target = "fuse_schedule_expand_test"
test = "schedule.expand"

[[mutation]]
id = "merge-placed-at-tick-start-general"
area = "compiler"
describes = "in the general (non-lockstep) path, a Merge combining two or more channels is placed at its owning component's tick START instead of the tick END, the same defect as merge-placed-at-tick-start-lockstep but in the other of expand()'s two emission paths -- ExpandMode::ForceGeneral is required to reach it, since a lockstep graph never takes this branch"
file = "src/schedule/expand.cpp"
old = "    const bool tick_closing = (n.kind == OpKind::Merge);"
new = "    const bool tick_closing = false;"
target = "fuse_schedule_expand_test"
test = "schedule.expand"
