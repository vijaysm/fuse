# The two mutations below guard N-ir-schedule-2
# (docs/dev/reviews/2026-09-19/pass2/re-ir-schedule.md), found while fixing
# that report's N-ir-schedule-1 IMPROVEMENT: extending
# schedule.acyclicity_sweep to also call schedule() immediately turned up a
# real BLOCKER, not just a coverage gap. A Merge combining two or more
# field transfers carries `ChannelId{}` origin (fuse/ir/lowering.cpp -- it is not
# any one of them), so `expand()`'s "no field transfer claimed" boundary handling
# placed it at its owning component's tick START, the convention meant for
# Source and an unwritten Sink. When any of its writers actually crosses
# ranks (needs a real Transport/Epoch pair, unlike every writer in
# five_writer_merge()'s fixture above, which are all colocated with the
# target and so never gain one), that pair runs at the tick's END and Merge
# sorted before it, failing the scheduler's own dependence check with
# E-SCHED-ORDER on an entirely ordinary graph. Two mutations because the fix
# touches two independent code paths -- expand()'s lockstep fast path and
# its general path -- each hand-verified by reverting just that one line,
# rebuilding, and confirming the cited test fails; `tools/mutate.py` was not
# run (see the header note: it edits repository sources in place, unsafe
# against a checkout six fixers share).

[[mutation]]
id = "merge-placed-at-tick-start-lockstep"
area = "compiler"
describes = "in the lockstep fast path, a Merge combining two or more field transfers is placed at its owning component's tick START (the Source/unwritten-Sink convention) instead of the tick END its Transport/Epoch inputs land on, so it sorts before them and schedule() fails E-SCHED-ORDER on any graph where a writer is not colocated with the merge target"
file = "src/schedule/expand.cpp"
old = "    } else if (n.kind == OpKind::Merge) {"
new = "    } else if (false) {"
target = "fuse_schedule_expand_test"
test = "schedule.expand"

[[mutation]]
id = "merge-placed-at-tick-start-general"
area = "compiler"
describes = "in the general (non-lockstep) path, a Merge combining two or more field transfers is placed at its owning component's tick START instead of the tick END, the same defect as merge-placed-at-tick-start-lockstep but in the other of expand()'s two emission paths -- ExpandMode::ForceGeneral is required to reach it, since a lockstep graph never takes this branch"
file = "src/schedule/expand.cpp"
old = "    const bool tick_closing = (n.kind == OpKind::Merge);"
new = "    const bool tick_closing = false;"
target = "fuse_schedule_expand_test"
test = "schedule.expand"

[[mutation]]
id = "region-grouping-does-nothing"
area = "compiler"
describes = "D1's fix: a region's members are grouped inside their instant so declaration order cannot decide whether a coupling schedules. Without the preference the greedy emission degenerates to the old rank order and the declared-second spelling is rejected again."
file = "src/schedule/scheduler.cpp"
old = "      if (open != kNoRegion) {"
new = "      if (false) {"
target = "fuse_schedule_plan_test"
test = "schedule.plan"

[[mutation]]
id = "region-grouping-ignores-entanglement"
area = "compiler"
describes = "The other half: grouping must NOT separate a non-member that reads the same external value the region re-advances, because its placement relative to the loop is a modelling decision. Removing the guard lets an explicit field transfer hanging off an iterated component schedule, on one sweep's iterate, instead of being rejected."
file = "src/schedule/scheduler.cpp"
old = "    if (!any_member || entangled || hi - lo < 2) {"
new = "    if (!any_member || hi - lo < 2) {"
target = "fuse_verification_iteration_test"
test = "verification.iteration"

# KNOWN_ISSUES.md B3 (Component::capabilities() bitmask). Two mutations: the
# new determinism check going dark, and supports_rollback() reading the wrong
# bit out of the same word. Both hand-verified by applying the row's `old` ->
# `new` text edit to a clean checkout copy, rebuilding the named target, and
# confirming the named test fails with the expected symptom -- then restored
# and confirmed byte-identical to the original via `cmp`.

[[mutation]]
id = "b3-determinism-check-disabled"
area = "runtime"
describes = "verify_rollback_support()'s new check (src/runtime/checkpoint_support.cpp) for a component whose capabilities() decodes DeterminismLevel::Nondeterministic inside an implicit coupling group's checkpoint set is disabled, so a nondeterministic component's noise is silently treated as a residual instead of being rejected with E-ITER-NONDETERMINISTIC. HAND-VERIFIED (applied to the real file, rebuilt, run, restored, cmp'd byte-identical -- not derived): applying this mutation, rebuilding fuse_runtime_checkpoint_test and running ctest -R '^runtime.checkpoint$' gives exactly one failure, Checkpoint.NondeterministicComponentInsideIterationRegionIsRejected (diags.has_errors() is false, has_code(diags, \"E-ITER-NONDETERMINISTIC\") is false, diags.size() is 0 not 1) -- the other 19 subtests in the suite, including ExplicitlyBitwiseComponentInsideIterationRegionIsAccepted and DefaultDeterminismInsideIterationRegionIsAccepted, pass unchanged. Restored via cmp against a pre-edit copy: byte-identical."
file = "src/runtime/checkpoint_support.cpp"
old = "    if (level == DeterminismLevel::Nondeterministic) {"
new = "    if (false) {"
target = "fuse_runtime_checkpoint_test"
test = "runtime.checkpoint"

[[mutation]]
id = "b3-rollback-bit-read-from-wrong-field"
area = "runtime"
describes = "Component::supports_rollback() (include/fuse/runtime/component.hpp) reads kCapabilityHiddenState (bit 3) instead of kCapabilityRollback (bit 0) out of capabilities(), so a component that declares rollback alone (every ported override before B3, and the general case: rollback set, hidden state unset) reports supports_rollback() == false. HAND-VERIFIED (applied to the real file, rebuilt, run, restored, cmp'd byte-identical -- not derived): applying this mutation, rebuilding fuse_runtime_component_iface_test and running ctest -R '^runtime.component_iface$' gives exactly three failures out of 23 subtests -- ComponentIface.RollbackDefaultsToUnsupported (Toy{\"a\"}.supports_rollback() now reads false), ComponentIface.ToyDeclaresRollbackOnlyAndLeavesTheRestAtDefault (same), and ComponentSet.RegistryObservesComponentStateAcrossACheckpointRoundTrip (its ASSERT_TRUE(c.supports_rollback()) aborts the test) -- every other subtest, including DefaultCapabilitiesDecodeToTheDocumentedTriple and MakeCapabilitiesRoundTripsAllThreeBits, is unaffected. Restored via cmp against a pre-edit copy: byte-identical."
file = "include/fuse/runtime/component.hpp"
old = "    return (capabilities() & kCapabilityRollback) != 0;"
new = "    return (capabilities() & kCapabilityHiddenState) != 0;"
target = "fuse_runtime_component_iface_test"
test = "runtime.component_iface"

