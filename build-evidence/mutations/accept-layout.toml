# Mutations for the accept-mode layout rule: validate_launch_layout()'s own
# gap-tolerance rule (include/fuse/transport/connect.hpp) and the accept
# branch of examples/brusselator/participants/brusselator_graph_tool.cpp
# that is the rule's one real user.
#
# Every row below was applied by hand against its own `file`, rebuilt at the
# base (tier-0, no-MPI) build configuration, run as the WHOLE, UNFILTERED
# binary named by `target`, and confirmed to fail exactly the predicted test(s)
# before being restored byte-for-byte (`cmp` against the pre-mutation file
# showed no difference) and rebuilt clean. All four are tier-0 reachable:
# validate_launch_layout() is a pure, MPI-free function (connect.hpp's own
# module comment explains why), and brusselator_graph_tool is a plain CLI
# tool that needs no MPI either.

[[mutation]]
id = "accept-layout-gap-tolerance-disabled"
area = "transport"
describes = "validate_launch_layout()'s whole gap exception -- accepting a gap between two Connect/Mpmd blocks when in-process components cover it exactly -- is removed, reverting to the rule that any gap at all is refused. This is the row that would fire if the accept-mode layout fix were reverted at the library level: every graph that declares the new U={ranks_u}/coupler={gap}/V={after the gap} shape (accept mode's own fix) would be refused again, exactly as it would be without the exception."
file = "include/fuse/transport/connect.hpp"
old = """    if (b.start > expected_start) {
      if (auto r = check_gap_filled_by_in_process_components(expected_start, b.start, fillers);
          !r.ok()) {
        return r.error();
      }
    }"""
new = """    if (b.start > expected_start) {
      return Failure{"E-CONNECT-SPEC", "MUTATED: gap tolerance disabled"};  // MUTATED
    }"""
target = "fuse_transport_connect_test"
test = "transport.connect"
result = "CONFIRMED: 7 of 26 cases failed -- every gap-tolerant case (ValidateLaunchLayout.AGapExactlyCoveredByAnInProcessComponentValidates, .AGapExactlyCoveredByAPluginComponentValidates, .AGapCoveredByTwoInProcessComponentsTogetherValidates, .RefusesAGapNoComponentHosts, .RefusesAPartlyCoveredGap, .RefusesAnInProcessComponentStraddlingIntoTheGap, .RefusesAnInProcessComponentStraddlingOutOfTheGap) failed exactly as predicted -- a gap now refused outright rather than checked against the in-process fillers at all, so the two straddle/uncovered rows fail too (there is no gap-coverage check left to produce their own distinct refusal). The other 19 of 26 (no-gap cases, including TheOverlappingDeclarationStillValidates) were unaffected. Restored; cmp against the pre-mutation file reported no difference; rebuilt clean, 26 of 26 passed."

[[mutation]]
id = "accept-layout-straddle-check-disabled"
area = "transport"
describes = "check_gap_filled_by_in_process_components()'s straddle refusal is replaced with a silent skip: an in-process component whose ranks reach outside the gap into a launched block is no longer refused by name -- it simply contributes nothing to the gap's own coverage, so the gap is refused as UNCOVERED instead of as a STRADDLE (a different, less specific diagnosis), or validates anyway if some OTHER filler happens to cover the same ranks."
file = "include/fuse/transport/connect.hpp"
old = """    if (!fully_inside) {
      return Failure{
          "E-CONNECT-SPEC",
          "in-process component '" + f->name +
              "' is declared on ranks that straddle the boundary of the gap ["
              + std::to_string(gap_start) + ", " + std::to_string(gap_end) +
              ") between two launched (connect/mpmd) blocks: some of its "
              "ranks lie inside the gap and some outside it. An in-process "
              "component may share ranks with one launched block, or sit "
              "entirely inside one gap between two launched blocks, but not "
              "straddle the boundary between them"};
    }
    for (const int r : f->ranks.ranks()) {
      covered[static_cast<std::size_t>(r - gap_start)] = true;
    }"""
new = """    if (!fully_inside) {
      continue;  // MUTATED: straddle refused -> silently skipped instead
    }
    for (const int r : f->ranks.ranks()) {
      covered[static_cast<std::size_t>(r - gap_start)] = true;
    }"""
target = "fuse_transport_connect_test"
test = "transport.connect"
result = "CONFIRMED: exactly 2 of 26 cases failed -- ValidateLaunchLayout.RefusesAnInProcessComponentStraddlingIntoTheGap and .RefusesAnInProcessComponentStraddlingOutOfTheGap, both of which assert the refusal message names \"straddle\" (it no longer fires at all; the gap is refused as uncovered instead, which the test's own substring check correctly tells apart from a real kill). Every other case (24 of 26), including every non-straddling gap-coverage case, was unaffected. Restored; cmp against the pre-mutation file reported no difference; rebuilt clean, 26 of 26 passed."

[[mutation]]
id = "accept-layout-uncovered-check-disabled"
area = "transport"
describes = "check_gap_filled_by_in_process_components()'s final check -- that every rank in the gap is covered by some non-straddling filler -- is removed, so a gap with no component hosting some (or all) of its ranks validates anyway, as if an unplaced rank in a Connect/Mpmd layout were harmless."
file = "include/fuse/transport/connect.hpp"
old = """  if (!uncovered.empty()) {
    std::string ranks_str;
    for (std::size_t i = 0; i < uncovered.size(); ++i) {
      if (i) ranks_str += ", ";
      ranks_str += std::to_string(uncovered[i]);
    }
    return Failure{
        "E-CONNECT-SPEC",
        "rank(s) " + ranks_str + " lie in the gap [" + std::to_string(gap_start) +
            ", " + std::to_string(gap_end) +
            ") between two launched (connect/mpmd) blocks, but no "
            "in-process or plugin component's own RankSet covers them; a "
            "gap between two launched blocks must be covered exactly by "
            "in-process components, the way accept mode's bundled coupler "
            "covers the ranks between the acceptor's own physics block and "
            "the connector's"};
  }
  return Result<void>::success();
}"""
new = """  (void)uncovered;  // MUTATED: uncovered-rank check disabled
  return Result<void>::success();
}"""
target = "fuse_transport_connect_test"
test = "transport.connect"
result = "CONFIRMED: exactly 3 of 26 cases failed -- ValidateLaunchLayout.RefusesAGapNoComponentHosts and .RefusesAPartlyCoveredGap (predicted), PLUS the PRE-EXISTING .RefusesRanksNotStartingWhereThePreviousComponentEnded (not predicted in advance, but correctly caught by this run rather than guessed past): that case's own gap [2, 5) has no in-process component in its graph at all, so it is ALSO an uncovered gap, and with this check gone it validates instead of refusing. Every other case (23 of 26) was unaffected. Restored; cmp against the pre-mutation file reported no difference; rebuilt clean, 26 of 26 passed."

[[mutation]]
id = "accept-layout-u-ranks-span-coupler"
area = "examples/brusselator"
describes = "brusselator_graph_tool.cpp's accept branch reverts to declaring U's RankSet as its FULL local executable world (its own physics ranks plus the bundled coupler's), the exact declaration that mis-sized U's field on the host: NativeMeshBackend::register_default_placements() decomposes a placement over its component's own declared RankSet count, so U's 16x16=256-cell field is planned at 256/2=128 per rank instead of the whole 256 u_main.c actually registers when --ranks-u is 1."
file = "examples/brusselator/participants/brusselator_graph_tool.cpp"
old = """    u_ranks = fuse::RankSet{0, args.ranks_u};
    const int u_local_world = args.ranks_u + args.ranks_coupler;"""
new = """    const int u_local_world = args.ranks_u + args.ranks_coupler;
    u_ranks = fuse::RankSet{0, u_local_world};  // MUTATED: pre-D36 span"""
target = "brusselator_graph_tool"
test = "verification.brusselator.graph_tool.reproduces_reference_accept_3"
result = "CONFIRMED: both accept-mode reference rows failed as predicted -- verification.brusselator.graph_tool.reproduces_reference_accept_3 (U's ranks printed as {first: 0, count: 2} instead of the committed {first: 0, count: 1}) and .reproduces_reference_accept_5 ({first: 0, count: 3} instead of {first: 0, count: 2}); the two mpmd reference rows (.reproduces_reference, .reproduces_reference_lowfive) were unaffected, since the mpmd branch this mutation does not touch is untouched. Separately confirmed at the Runner's own placement-plan level (test/verification/brusselator_accept_layout_test.cpp, mutated by hand the same way and restored -- not a row here, since that test's own build() reconstructs the graph independently of this tool and so is not actually exercised by mutating this file): with U's RankSet widened to {0, 2} the SAME way, make_region_sizes() reports U's own planned size as 128 instead of 256, reproducing the host's E-RT-SIZE number exactly. Restored; cmp against the pre-mutation file reported no difference; rebuilt clean, all 4 reproduces_reference rows passed."

[[mutation]]
id = "accept-layout-lowfive-counted-as-launched"
area = "transport"
describes = "validate_launch_layout()'s skip for LaunchMode::LowFive is removed, putting LowFive back into the counted launched modes: a LowFive marker's own whole-run RankSet is once again treated as a launched block that must start exactly where the previous one ended, the exact shape that refused verification.brusselator.participants.lowfive.mpmd.3 on the host even though validate() itself accepts the same graph cleanly."
file = "include/fuse/transport/connect.hpp"
old = "    if (c.launch.mode == LaunchMode::LowFive) continue;\n    any = true;"
new = "    if (false) continue;  // MUTATED: LowFive put back into the counted modes\n    any = true;"
target = "fuse_transport_connect_test"
test = "transport.connect"
result = "CONFIRMED: exactly 3 of 29 cases failed -- ValidateLaunchLayout.ALowFiveMarkerAlongsideConsecutiveMpmdBlocksValidates and .ALowFiveMarkerAlongsideTheAcceptLayoutsGapValidates (the marker's own range, starting at rank 0, no longer agrees with where the real launched blocks leave off, exactly the host's own E-CONNECT-SPEC message), and -- not predicted in advance, found by this run rather than guessed past -- .ALowFiveMarkerWithNoLaunchedComponentStillRefusesNoLaunch: with the marker itself now counted, a lowfive-only graph's own single component IS a (degenerate, one-component) consecutive block starting at rank 0, so validate_launch_layout() now ACCEPTS it instead of refusing 'no component declares an mpmd or connect launch', and the test's own ASSERT_FALSE(r.ok()) fails before its message check is even reached. The other 26 of 29 were unaffected. Restored; cmp against the pre-mutation file reported no difference; rebuilt clean, 29 of 29 passed."
