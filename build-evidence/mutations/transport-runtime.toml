[[mutation]]
id = "region-failure-abandons-the-rest-of-the-period"
area = "runtime"
describes = "step_period() returns straight out of the instruction stream the moment an implicit coupling group fails, instead of carrying the failure forward and continuing to walk the stream -- abandoning every later instruction in the same period, including an unrelated field transfer's Transport/Epoch. Tier 0 (fuse_runtime_runner_test, ASecondChannelStillAdvancesAfterAnUnrelatedRegionFails) cannot distinguish this mutant: with no MPI communicator configured there is no partner rank to abandon, so the SURVIVED outcome there is expected and recorded, not a gap. The real kill is the MPI test below: consumer_b's rank(s), on a disjoint RankSet from the region's, block in linkB's Epoch waiting for a partner that already returned -- the 120s TIMEOUT test property is what turns that into a correct kill rather than a silent PASS."
file = "src/runtime/runner.cpp"
old = "        if (!step_failure.has_value()) step_failure = rr.error();"
new = "        return rr.error();  // abandon the rest of the period"
target = "fuse_parallel_runner_transport_test"
test = "parallel.runner_transport.3"
requires = "mpi"
