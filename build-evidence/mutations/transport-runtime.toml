# Mutations for REVIEW.md's transport-runtime findings (TR-*, unified R-09,
# R-10, R-30, R-32) and the pass-2 findings N-transport-runtime-1 and -2.
# Schema: build-evidence/mutations.toml.

[[mutation]]
id = "cross-rank-region-check-fires-unconditionally"
area = "runtime"
describes = "R-10: the cross-rank iteration-region refusal (E-RT-REGION-MPI) fires even with no RunnerConfig::base_communicator configured, wrongly refusing every single-process caller that places a region's components on different declared ranks"
file = "src/runtime/iteration.cpp"
old = "    if (config.base_communicator.has_value()) {"
new = "    if (true) {"
target = "fuse_runtime_runner_test"
test = "runtime.runner"
# N-transport-runtime-3 (REVIEW.md pass2): `requires = "mpi"` and the note this
