[[mutation]]
id = "conservation-check-not-reduced-across-ranks"
area = "runtime"
describes = "Constrain compares this rank's owned share of each integral without the Allreduce over the base communicator. On a disjoint two-component placement the source share lives on one rank and the target share on another, so every rank sees a spurious violation (or misses a real one) -- the defect that the rejection it replaced used to prevent by declining the check altogether."
file = "src/runtime/runner.cpp"
old = "  const bool reduce = config.base_communicator.has_value();"
new = "  const bool reduce = false;"
target = "fuse_parallel_nodal_remap_runner_test"
test = "parallel.nodal_remap_runner.2"
requires = "mpi"
# SURVIVED explained, verified by hand: Constrain (runner.cpp's OpKind::
# Constrain case) only REPORTS (it does not correct --
# the field values downstream are copied through unchanged either way).
# RunnerConfig::abort_on_violation defaults to FALSE (runner.hpp), and
# DisjointRankSets never sets it nor reads runner.stats() -- its own
# checks are an INDEPENDENT MPI_Allreduce of the raw field values, which
# `ci.reduce` never touches. So a spurious per-rank violation from
# skipping the cross-rank Allreduce only increments
# runner.stats().conservation_violations, which nothing in the test
# reads, and run_period() still returns ok(). Confirmed with a standalone
# harness (DisjointRankSets' own shape, no MPI, so deliberately WITHOUT a
# base communicator -- the same `ci.reduce == false` branch the mutation
# forces): conservation_violations came back 2 of 4, worst_conservation_
# error 1.0 (100% relative), run_period() still ok(). Fix: added
# `cfg.abort_on_violation = true;` to run_and_check() in
# test/parallel/nodal_remap_runner_test.cpp (shared by DisjointRankSets/
# IdenticalRankSets/PartiallyOverlappingRankSets), turning that same
# condition into a hard E-RT-CONSERVATION failure -- confirmed by the same
# harness ("integral 10.400000 -> 0.000000" once abort_on_violation was
# set). Compiled (Tier 1, MPI-enabled) but not run at real rank counts;
# a host run is what confirms the fix does not introduce a false positive
# on the correct (reduce == true) path, though the achieved precision
# elsewhere in this same test (1e-13 relative) is comfortably inside the
# 1e-12 default tolerance.

