# Time windows track (Implement windowed temporal coupling across clocks).
# Mutations below guard fuse/runtime/window_coupler.hpp's straddle
# rollback/replay and its conservative mean-forcing split. NOT
# hand-verified by rebuilding: the shared tier-0 build disk was exhausted
# by three concurrent tracks for the whole of this session (see the
# report this change's commit carries). Anchors are confirmed present
# (`tools/mutate.py --check-anchors`) and the expected failure mode is
# derived from a from-scratch Python re-implementation of the identical
# algorithm, run and checked against a closed-form exact solution and,
# for the rollback mutation specifically, against a from-scratch
# fixed-point solve of the same discretized equations (fsolve) that the
# unmutated algorithm was confirmed to match to round-off. The lead
# should re-verify by actually applying each mutation once tier-0 disk is
# available.

[[mutation]]
id = "window-straddle-fixup-skips-rollback"
area = "runtime"
describes = "resolve_pending_straddles() stops rolling a Fixed member back to its previous window's checkpoint before replaying the straddling step with converged data, so the replay runs forward from whatever provisional state the straddling step already left behind instead of from the checkpoint -- the state most sensitive to this compounds it into a growing error every subsequent window, since each fixup's provisional error is carried into the next rather than corrected"
file = "src/runtime/window_coupler.cpp"
old = "    const Result<void> r0 = m.component->restore_state();"
new = "    const Result<void> r0 = Result<void>::success();"
target = "fuse_runtime_window_coupler_test"
test = "runtime.window_coupler"

[[mutation]]
id = "window-straddle-tail-mean-drops-boundary-value"
area = "runtime"
describes = "the straddling substep's tail portion (beyond the window boundary T1, where the partner has no converged data yet) is fed the MEAN of the boundary value v_bnd (the partner's real, converged value at T1) and v_tail (the partner's value at the substep's true end, from extrapolation) -- dropping v_bnd and feeding v_tail alone breaks that mean, so the tail's forcing no longer represents its true time-average, which the delegated task's asymptotic-regime order tests catch as an accuracy regression. Superseded from an earlier anchor (window-straddle-tail-mean-not-length-weighted) that targeted a single-advance blended-mean formula this file no longer has: sweep_window's straddling substep is now split into two advance() calls at T1 (one on each side) rather than one advance() over a blended mean, so the length-weighted denominator this mutation originally hit does not exist anymore -- see the class comment at that split for why."
file = "src/runtime/window_coupler.cpp"
old = "                mean_tail = 0.5 * (v_bnd + v_tail);"
new = "                mean_tail = v_tail;"
target = "fuse_runtime_window_coupler_test"
test = "runtime.window_coupler"

