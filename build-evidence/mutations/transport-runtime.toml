[[mutation]]
id = "build-plan-skips-the-components-agreement"
area = "transport"
describes = "R-30: MpiTransport::build_plan() stops checking that every rank in the src/dst rank set agrees on TransportSpec::components, so two ranks calling it with different component counts size MPI_Alltoallv's count arrays inconsistently instead of refusing at setup"
file = "src/transport/mpi_transport.cpp"
old = "      if (!agreement.agreed()) {"
new = "      if (false) {"
target = "fuse_parallel_mpi_transport_test"
test = "parallel.mpi_transport.2"
requires = "mpi"

[[mutation]]
id = "region-residual-skips-the-cross-rank-reduction"
area = "runtime"
describes = "R-10: run_region() stops agreeing the residual across the region's participants and falls back to each rank's own local Euclidean sum, exactly the defect the fix closes. On RunnerTransport.RegionConvergesInTheSerialIterationCount's unequal 2/1/1-style split this desynchronises which sweep each rank exits on -- the expected kill is the iteration-count assertion failing outright on the ranks that finish before the timeout, or the whole job timing out (a slower rank's partners move on to the region's own exit instructions while it is still sweeping, which is the hang rank-agreement.md's Epoch exists to prevent and this reduction is the region-local analogue of); either is a correct kill for this mutation, and the 120s TIMEOUT test property makes the second case an unambiguous FAILED rather than a silent PASS."
file = "src/runtime/iteration.cpp"
old = "    if (R.participants.size() > 1) {"
new = "    if (false) {"
target = "fuse_parallel_runner_transport_test"
test = "parallel.runner_transport.2"
requires = "mpi"

[[mutation]]
id = "conservation-check-skips-the-multi-rank-refusal"
area = "runtime"
describes = "N-transport-runtime-1 (REVIEW.md pass2): resolve_constrain() stops refusing a conservation check whose Remap target is declared on more than one rank, so the check silently sums only this rank's owned share of the integral instead of refusing a diagnostic it cannot correctly compute without a cross-rank reduction it does not have"
file = "src/runtime/runner.cpp"
old = "    if (dst_ranks.size() > 1) {"
new = "    if (false) {"
target = "fuse_runtime_runner_test"
test = "runtime.runner"

[[mutation]]
id = "region-failure-abandons-the-rest-of-the-period"
area = "runtime"
describes = "N-transport-runtime-2 / R-09 (REVIEW.md pass2): step_period() returns straight out of the instruction stream the moment an iteration region fails, instead of carrying the failure forward and continuing to walk the stream -- abandoning every later instruction in the same period, including an unrelated channel's Transport/Epoch. Tier 0 (fuse_runtime_runner_test, ASecondChannelStillAdvancesAfterAnUnrelatedRegionFails) cannot distinguish this mutant: with no MPI communicator configured there is no partner rank to abandon, so the SURVIVED verdict there is expected and recorded, not a gap. The real kill is the MPI test below: consumer_b's rank(s), on a disjoint RankSet from the region's, block in linkB's Epoch waiting for a partner that already returned -- the 120s TIMEOUT test property is what turns that into a correct kill rather than a silent PASS."
file = "src/runtime/runner.cpp"
old = "        if (!step_failure.has_value()) step_failure = rr.error();"
new = "        return rr.error();  // abandon the rest of the period"
target = "fuse_parallel_runner_transport_test"
test = "parallel.runner_transport.2"
requires = "mpi"

[[mutation]]
id = "one-transport-shared-across-every-plan"
area = "transport"
describes = "D2's fix: every CommGraph-backed plan gets its OWN Transport. Sharing one instance across plans puts the second channel's move() on a Transport planned for the first, which MpiTransport::prepare() refuses -- so the second channel stops working while the first still does."
file = "src/runtime/runner.cpp"
old = "    graph_transports[pi] = std::move(own);"
new = "    if (pi == 0) graph_transports[pi] = std::move(own);"
target = "fuse_parallel_runner_transport_test"
test = "parallel.runner_transport.2"
requires = "mpi"

[[mutation]]
id = "a-failed-step-blocks-every-later-advance"
area = "runtime"
describes = "The 2026-09-21 dependence rule, first half: a failing period still advances components that read nothing the failed step provides. Blocking all of them is the behaviour the rule replaced, and for a plan whose ticks all fall in step_period()'s trailing loop it meant NO component advanced."
file = "src/runtime/runner.cpp"
old = "  if (advance_blocked.empty()) return true;"
new = "  return advance_blocked.empty();"
target = "fuse_runtime_runner_test"
test = "runtime.runner"

[[mutation]]
id = "a-failed-step-blocks-nothing"
area = "runtime"
describes = "The same rule, second half: the origin of the failure and everything downstream of it must NOT advance, or a component steps on a value the failed step never produced."
file = "src/runtime/runner.cpp"
old = "  return slot < advance_blocked.size() && advance_blocked[slot] == 0;"
new = "  return true;"
target = "fuse_runtime_runner_test"
test = "runtime.runner"

[[mutation]]
id = "both-commgraph-sides-share-one-view"
area = "runtime"
describes = "KNOWN_ISSUES D5: attach_comm_graphs() gives each CommGraph side its own component's decomposition. Reverting the destination side to the source component's view is the old one-view wiring, under which two partially overlapping placements cannot both cover the region."
file = "src/runtime/runner.cpp"
old = "    dst_side.mesh        = in_dst ? dst_view.value() : nullptr;"
new = "    dst_side.mesh        = in_dst ? src_view.value() : nullptr;"
target = "fuse_parallel_runner_transport_test"
test = "parallel.runner_transport.3"
requires = "mpi"

[[mutation]]
id = "peer-plan-staged-through-the-matched-path"
area = "runtime"
describes = "The latent defect D5's harness exposed: the hot loop ran the matched path's gather and scatter on a peer plan, where both are empty, so the exchange sent zeros and delivered nothing. Removing the peer branch restores it."
