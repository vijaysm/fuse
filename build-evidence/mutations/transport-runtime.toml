# The test is RunnerTransport.
# IterationRegionParticipantsIncludeADisjointCoupler (test/parallel/
# runner_transport_test.cpp), reusing TwoComponentJob's EXISTING
# Overlap::Full + CouplerShape::Disjoint combination: fluid AND solid
# COINCIDE on RankSet{0, world_size()-1} while the coupler alone holds the
# one remaining rank, disjoint from both. `FUSE_REQUIRE_AT_LEAST_RANKS(2)`.
#
# Traced kill mechanism, no hang required (verified by READING the code,
# not by execution -- MPI cannot initialise in this sandbox): with fluid/
# solid coincident, derive_checkpoint_set()'s own components give
# `region_ranks.size() == 1` BEFORE the coupler scan runs at all; only the
# scan this mutation empties can push it to 2. Under the mutation,
# `R.participants` is therefore left EMPTY (`if (region_ranks.size() > 1)`
# never fires) on EVERY rank (participants is graph-derived, identical
# everywhere) -- exactly the "no communicator, or every checkpointed
# component on one rank" case resolve_regions()'s own comment treats as
# "purely local". resolve_regions()'s PER-BLOCK guard immediately below
# the participants scan, `if (b.length == 0 && R.participants.size() <= 1)
# return Failure{"E-RT-REGION", "... would report convergence after one
# sweep"};`, then fires on the COUPLER's rank specifically: its own local
# `b.length` for this region's coupling-value block is 0 (it owns no
# checkpointed field), and with the mutation `R.participants.size() <= 1`
# -- the rejection that is correctly SKIPPED (treated as the ordinary "n ==
# 0" no-op) when the coupler is counted instead FIRES there. fluid/solid's
# own rank never hits it (its block length is > 0). This is an asymmetric,
# per-rank INITIALIZE()-time outcome split, observable before anything
# collective runs -- confirmed as far as this sandbox can: a Tier-0 double
# of the SAME shape (PartitionedTestBackend, coupler played by the one
# simulated rank) reaches `config.base_communicator.has_value()`'s branch
# correctly (this whole block is NOT #if FUSE_HAVE_MPI-gated, confirmed by
# reading it) but then fails EARLIER and for an unrelated reason,
# E-RT-TRANSPORT-NOMPI, because the field transfer's cross-rank data move needs a
# real Transport that Tier 0 cannot provide -- i.e. Transport attachment
# in initialize() runs BEFORE resolve_regions(), which this sandbox cannot
# get past. The test above compiles (Tier 1, MPI-enabled) but was NOT run;
# a host run at >= 2 ranks is what confirms the E-RT-REGION outcome on the
# coupler's rank.
#
# The test is reachable only under a real communicator --
# `FUSE_REQUIRE_AT_LEAST_RANKS(2)` skips it at Tier 0, and the
# full Tier 0 mutation sweep reports this row NOT-ASSESSED (needs MPI), the
# same courtesy `requires = "mpi"` gives every row in this file that needs a
# launcher this sandbox does not have. `tools/mutate.py --check-anchors`
# confirms the `old` loop-bound anchor above occurs exactly once.
# `fuse_parallel_runner_transport_test` builds (not run) to completion under
# an MPI+Fortran configuration (-DFUSE_ENABLE_MPI=ON
# -DFUSE_ENABLE_FORTRAN=ON). Host command: `FUSE_MUTATE_
# MPI=1 tools/mutate.py --build-dir <mpi-build> --area runtime` (covers this
# row and region-failure-abandons-the-rest-of-the-period together), or
# isolate this row with `ctest --test-dir <mpi-build> -R
# '^parallel.runner_transport.4$' --output-on-failure` before and after
# hand-applying the mutation.

# The coupling hot loop moved onto Kokkos' default host execution space
# coupling hot loop moved onto Kokkos' default host execution space
# (fuse/num/space_kernels.hpp), and the deterministic-reduction scheme that
# makes its reductions thread-count-independent is what the two rows below
# guard. Both hand-verified (apply the `old`->`new` text by hand, rebuild,
# run, restore byte-for-byte via cmp -- tools/mutate.py was not run,
# because it edits repository sources in place and is unsafe against a
# shared checkout).

[[mutation]]
id = "runtime-reduction-not-deterministic"
area = "runtime"
describes = "space_kernels.hpp's deterministic_dot/deterministic_norm_squared_diff -- the fixed-chunk, serial-combine scheme iteration.cpp's block value/residual norms use so run_region()'s convergence decision is bit-for-bit independent of the execution space's thread count -- reverts to a plain Kokkos::parallel_reduce over the whole range. A parallel_reduce's summation order is the threads', not the deterministic scheme's, so the SAME input gives a DIFFERENT last-bit answer at different OMP_NUM_THREADS, which is exactly the property this row guards."
file = "include/fuse/num/space_kernels.hpp"
old = "  Kokkos::parallel_for(\"fuse::det_dot\", Kokkos::RangePolicy<Space>(0, n_chunks),"
new = "  double result = 0.0; Kokkos::parallel_reduce(\"fuse::det_dot_MUT\", Kokkos::RangePolicy<Space>(0, a.extent(0)), KOKKOS_LAMBDA(const std::size_t i, double& acc) { acc += a(i) * b(i); }, result); return result; if (false) Kokkos::parallel_for(\"fuse::det_dot\", Kokkos::RangePolicy<Space>(0, n_chunks),"
target = "fuse_num_space_kernels_test"
test = "num.space_kernels"
note = """Hand-verified on BOTH functions this scheme has (deterministic_dot,
which deterministic_norm_squared calls, and the independently-implemented
