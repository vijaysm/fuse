# "runtime-scale-runs-serial-loop" -- asked for by name, deliberately NOT
# registered as a [[mutation]] row here: tools/mutate.py's load_manifest()
# requires every row (id, area, describes, file, old, new, target, test) or
# raises SystemExit for the WHOLE manifest across every area, and there
# is no honest `new`/`target`/`test` to give this one -- see below.
#
# HONEST NON-KILL, hand-verified rather than assumed: reverted OpKind::
# Scale's execute() case from `num::scale<HostExecSpace>(...)` (a
# Kokkos::parallel_for over an unmanaged view) to the plain serial
# `for (i) out[i] = f*src[i];` loop it replaced, rebuilt, and ran the FULL
# tier-0 ctest suite (133/133 at the time) -- 100% still passed, including
# every omp_identical leg and runtime.runner_determinism. No test can
# distinguish the two: a `Kokkos::parallel_for` over independent elements
# and a serial loop compute the IDENTICAL sequence of `f * src[i]` products
# with the IDENTICAL rounding (elementwise ops have no reduction to
# reassociate), so nothing about correctness, determinism, or the
# observable output differs -- only which code path executed, which no
# functional test can see and this tree has no execution-tracing test for.
# Restored byte-for-byte (diff against the pre-mutation copy was empty)
# rather than left applied. The same reasoning applies to every OTHER
# elementwise op this closing moved (Merge, Residual, Relax's num::relax
# half, Interpolate/Sample's copies, Accumulate's finalize) for the
# identical reason -- Scale is the one instance, not a special case among
# them. Recorded here, in prose, as the honest answer rather than a
# fabricated row.

[[mutation]]
id = "restore-state-failure-returns-instead-of-carrying-forward"
area = "runtime"
describes = "run_region()'s mid-sweep restore_state() failure handling reverts from recording step_failure and falling through (so the deliver/re-advance code right below, already gated on step_failure via is_collective(), carries it to the next sweep's residual agreement) back to co_return-ing straight out of the function. A partner whose own restore_state() succeeds on the SAME sweep never learns of this rank's failure and proceeds into the next sweep's body Transport alone -- exactly the class of defect where a rank-local verdict is returned ahead of a collective its partner still reaches, here for restore_state() rather than the advance()-failure site."
file = "src/runtime/iteration.cpp"
old = "        if (!step_failure.has_value()) step_failure = rs.error();"
new = "        co_return rs;  // MUTATED: bare early return undoes RT-2(c)'s carry-forward"
target = "fuse_parallel_runner_transport_test"
test = "parallel.runner_transport.2"
requires = "mpi"
# Expected kill: RunnerTransport.RestoreStateFailureIsCarriedToEveryRankNot-
# ReturnedFrom (test/parallel/runner_transport_test.cpp, added alongside
# this fix). Under the fix, B's rank reports E-RT-REGION-PEER, learned at
# the next sweep's residual agreement; under the mutant, A's rank leaves
# run_region() at the restore_state() failure itself (before that
# agreement), so B's rank -- whose own restore succeeded -- enters the
# NEXT sweep's body Transport with no partner there, which the test's own
# 120s TIMEOUT ctest property turns into a correct kill rather than a
# silent PASS. NOT-ASSESSED in this sandbox: MPI cannot initialise here;
# traced by hand against the carry-forward mechanism
# the "region-failure-abandons-the-rest-of-the-period" row in this file
# already documents for the analogous Epoch/advance-failure case, and
# the anchor is confirmed present (`tools/mutate.py --check-anchors`). A
# host run applying this mutation, rebuilding, and re-running the row at
# 2 ranks is what would confirm TIMEOUT/kill directly.

[[mutation]]
id = "healthy-rank-leaves-at-the-epoch"
area = "runtime"
describes = "reconcile_epoch() returns E-RT-EPOCH-PEER on a rank that was fine, instead of recording it: that rank leaves the period at the agreement point while the failing rank walks on through the remaining collective operations, so the failing rank waits forever in the next Transport. This is the hang the host found once each component is stepped only on its own processes."
file = "src/runtime/runner.cpp"
old = "    step_failure = Failure{\"E-RT-EPOCH-PEER\","
new = "    return Failure{\"E-RT-EPOCH-PEER\","
target = "fuse_parallel_runner_transport_test"
test = "parallel.runner_transport.2"
requires = "mpi"
# Expected kill: RunnerTransport.StillRunsASecondChannelAfterARegionFailsUnderMpi
# times out at 2 processes (the host's run on 9cafbd1 is this
# mutant's behaviour). NOT-ASSESSED in the sandbox: MPI cannot start here.
