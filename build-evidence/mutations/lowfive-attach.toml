# The real steady-state order: U write,read every period; V write,read
# ONLY at cold start, then read,write -- lowfive_attach_decision.hpp's own
# comment has the full derivation and citations. Three mutations: the
# corrected policy function, the static per-graph order check, and the
# local per-event order assertion -- one deviation kind each.

[[mutation]]
id = "decide-serve-action-defers-every-first-reader-write"
area = "examples"
describes = "decide_serve_action() goes back to the falsified earlier policy -- a first-reader defers EVERY write, not just its cold-start one -- reproducing the measured host hang exactly: V's period-1 write is deferred past U's own blocking read of it, and V's next read needs U's next write, which needs that same read to return first"
file = "examples/brusselator/participants/lowfive_attach_decision.hpp"
old = """[[nodiscard]] inline ServeNowOrDefer decide_serve_action(ServeRole role, bool completed_any_read) {
  if (role == ServeRole::kFirstReader && !completed_any_read) return ServeNowOrDefer::kDefer;
  return ServeNowOrDefer::kServeNow;
}"""
new = """[[nodiscard]] inline ServeNowOrDefer decide_serve_action(ServeRole role, bool completed_any_read) {
  (void)completed_any_read;
  if (role == ServeRole::kFirstReader) return ServeNowOrDefer::kDefer;
  return ServeNowOrDefer::kServeNow;
}"""
target = "fuse_verification_brusselator_lowfive_attach_test"
test = "verification.brusselator_lowfive_attach"

