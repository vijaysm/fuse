result = "CONFIRMED 2026-10-12: full unfiltered fuse_verification_brusselator_newton_norm_test (3 tests) ran 2 PASSED / 1 FAILED. BrusselatorNewtonNorm.WindowGmresIterationCountsPinnedWithAndWithoutBlockJacobi failed both its own composed-case pins: Newton iterations dropped 4 -> 3, total GMRES iterations dropped 42 -> 24 (per-step [1 6 17] mutated vs [1 5 17 19] composed) -- a real, measured change in the solve path, confirming this call site is exercised and this specific composition matters to it. BrusselatorNewtonNorm.WindowNewtonConvergesUnderPlainAndMeasureWeighted ALSO changed under this mutation (still passed, bound not tight enough to catch it): weighted iterations 4 -> 3, max|u_plain-u_weighted| grew from 1.332268e-15 to 7.250511e-11 and max|v_plain-v_weighted| from 2.220446e-15 to 5.361667e-11 -- both still far under that test's own 1e-6 sanity bound, so this mutation alone would NOT be caught by that test in isolation, only by the GMRES-count pins above. BrusselatorNewtonNorm.WindowDiagonalMatchesTheFormulaEntryForEntryAtTheExampleDefaults, which uses no preconditioner at all, was unaffected, as expected. Restored; cmp against the pre-mutation file reported no difference (md5 c33cd2e0828fce1f0de1d44fc9a9826b both before and after)."
