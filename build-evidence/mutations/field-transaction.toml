# Mutations for the S8 Stage B Field semantics track's FieldTransaction
# (include/fuse/field/transaction.hpp, src/field/transaction.cpp). Own file
# per the review-fix protocol: do not edit build-evidence/mutations.toml
# directly while other fixers hold it dirty.
