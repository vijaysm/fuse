[[mutation]]
id = "reaction-diffusion-petsc-ownership-local-write-replaced-by-global-setvalues"
area = "petsc-reaction-diffusion"
describes = "right_newton_solve_petsc's own residual assembly (VecGetArray into this rank's OWNED portion only) replaced by a global-index VecSetValues call -- on a communicator with more than one rank, VecSetValues with a GLOBAL row index not owned by the calling rank either refuses (PETSC_ERR_ARG_OUTOFRANGE, with -vecscatter_alltoall-style checking on) or silently routes the write to whichever rank DOES own that index, overwriting a value the owning rank itself is concurrently computing -- the exact off-process-write hazard this track's own header comment (reaction_diffusion_component_petsc.hpp) and the owner's own Stage B correction (src/petsc/token.cpp:340's MatSetValues, into a SEQUENTIAL MatCreateSeqAIJ, cannot do this) both name."
file = "examples/petsc_reaction_diffusion/reaction_diffusion_component_petsc.hpp"
old = """    ierr = VecGetArray(r_vec, &rarr);
    if (auto r = check_petsc(ierr, "VecGetArray(r)"); !r.ok()) { cleanup(); return r.error(); }
    for (PetscInt i = 0; i < m; ++i) rarr[i] = -rj.R[static_cast<std::size_t>(i)];
    VecRestoreArray(r_vec, &rarr);"""
new = """    for (PetscInt i = 0; i < m; ++i) {
      PetscScalar val = -rj.R[static_cast<std::size_t>(i)];
      VecSetValues(r_vec, 1, &i, &val, INSERT_VALUES);  // MUTATION: global-index write, not kept
    }
    VecAssemblyBegin(r_vec);
    VecAssemblyEnd(r_vec);"""
target = "fuse_petsc_reaction_diffusion_test"
test = "petsc.reaction_diffusion"
requires = "petsc"
result = "ARGUED BY CODE INSPECTION ONLY (this sandbox cannot run ANY petsc.* row -- NeumannHalfPetsc's own constructor calls ensure_initialized(), which segfaults on MPI_Init() before this line is ever reached, the SAME barrier petsc.toml's own header documents for every row there). On a single-rank communicator (this component's own region, per D31's single-rank-per-participant restriction) VecSetValues with a LOCAL-and-global-identical index would not visibly misbehave either -- the mutation's hazard is specifically the multi-rank case this track's own header comment names as the reason the real code never does this; a host run with FUSE_ENABLE_MPI and more than one rank per participant (not possible under D31's current restriction for this track's own single-participant-per-rank region) would be needed to exercise the differential this row describes for real."
equivalent = "right_newton_solve_petsc builds every PETSc object on PETSC_COMM_SELF (the one assignment `MPI_Comm comm = PETSC_COMM_SELF;` and every VecCreate, MatCreateAIJ and KSPCreate takes that `comm`), a one-process communicator on which a global index is the local index, so an INSERT_VALUES write of the owned range followed by assembly stores the same values as the VecGetArray write. The off-process hazard this row names needs a communicator with more than one rank, which this function cannot receive. Read from the source 2026-10-21 and measured: the tool reported SURVIVED on the host (MPICH 5.0.2rc3)."

[[mutation]]
id = "reaction-diffusion-petsc-assembly-no-zero-before-reassembly"
area = "petsc-reaction-diffusion"
describes = "right_newton_solve_petsc's own per-Newton-iteration MatZeroEntries(J) call (before the fresh MatSetValues/ADD_VALUES pass) removed -- the SAME convention src/petsc/token.cpp's own make_assembled_token relies on ADD_VALUES for a ONE-TIME assembly, reused here for a MATRIX THAT IS REASSEMBLED EVERY NEWTON ITERATION: without zeroing first, iteration k's own entries accumulate ON TOP of iteration k-1's (ADD_VALUES, not INSERT_VALUES), so the Jacobian used for the linear solve is wrong from the SECOND Newton iteration onward -- the Newton step itself would still run (no PETSc error), just converge to the wrong answer or fail to converge at all."
