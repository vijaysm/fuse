# Mutations for field value types (plans/2026-10-22-universal-number-types.md,
# stage U1): the type check that keeps a typed field from being reinterpreted,
# the lane-tiling clause of fuse::CoupledValue, and the correctly rounded
# binary64 -> bfloat16 conversion.

[[mutation]]
id = "any-field-ref-skips-value-type-check"
area = "field"
describes = "AnyFieldRef::as<T>() hands back a typed view without comparing value types, so a binary32 field is read as binary64"
file = "include/fuse/field/field_ref.hpp"
old = "    if (!holds<T>()) {"
new = "    if (false) {"
target = "fuse_field_value_type_test"
test = "field.value_type"

[[mutation]]
id = "coupled-value-drops-lane-tiling"
area = "field"
describes = "fuse::CoupledValue stops requiring a LaneLinear type's lanes to tile it exactly, so lane decomposition would address the wrong bytes"
file = "include/fuse/model/value_traits.hpp"
old = "    (value_traits<T>::kind != FieldValueKind::LaneLinear ||"
new = "    (true ||"
target = "fuse_field_value_type_test"
test = "field.value_type"

[[mutation]]
id = "bfloat16-from-binary64-rounds-twice"
area = "field"
describes = "binary64 -> bfloat16 rounds to nearest twice (through binary32) instead of rounding the intermediate to odd, which is not correctly rounded"
file = "include/fuse/model/value_traits.hpp"
old = "    return bfloat16::from_float(detail::round_to_odd_binary32(v));"
new = "    return bfloat16::from_float(static_cast<float>(v));"
target = "fuse_field_value_type_test"
test = "field.value_type"

[[mutation]]
id = "round-to-odd-never-steps"
area = "field"
describes = "round_to_odd_binary32 keeps the even neighbour of an inexact result, which reduces it to rounding to nearest"
file = "include/fuse/model/value_traits.hpp"
old = "  if ((bits & 1u) == 0u) {"
new = "  if (false) {"
target = "fuse_field_value_type_test"
test = "field.value_type"

[[mutation]]
id = "round-to-odd-steps-away-from-v"
area = "field"
describes = "round_to_odd_binary32 steps to the odd neighbour on the wrong side of the result, away from the exact value"
file = "include/fuse/model/value_traits.hpp"
old = "    f = std::nextafter(f, static_cast<double>(f) < v"
new = "    f = std::nextafter(f, static_cast<double>(f) > v"
target = "fuse_field_value_type_test"
test = "field.value_type"
