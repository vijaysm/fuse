# Mutations for field value types (plans/2026-10-22-universal-number-types.md,
# stage U1): the type check that keeps a typed field from being reinterpreted,
# the scalar-tiling clause of fuse::CoupledValue, and the correctly rounded
# binary64 -> bfloat16 conversion.

[[mutation]]
id = "any-field-ref-skips-value-type-check"
area = "field"
describes = "AnyFieldRef::as<T>() hands back a typed view without comparing value types, so a binary32 field is read as binary64"
file = "include/fuse/field/field_ref.hpp"
old = "    if (!holds<T>()) {"
new = "    if (false) {"
target = "fuse_field_value_type_test"
test = "field.value_type"

[[mutation]]
id = "coupled-value-drops-scalar-tiling"
area = "field"
describes = "fuse::CoupledValue stops requiring a ScalarArray type's scalars to tile it exactly, so viewing the field as scalars would address the wrong bytes"
file = "include/fuse/model/value_traits.hpp"
old = "    (value_traits<T>::kind != FieldValueKind::ScalarArray ||"
new = "    (true ||"
target = "fuse_field_value_type_test"
test = "field.value_type"

[[mutation]]
id = "bfloat16-from-binary64-rounds-twice"
area = "field"
describes = "binary64 -> bfloat16 rounds to nearest twice (through binary32) instead of once, which is not correctly rounded"
file = "include/fuse/model/value_traits.hpp"
old = "    return bfloat16::from_double(v);"
new = "    return bfloat16::from_float(static_cast<float>(v));"
target = "fuse_field_value_type_test"
test = "field.value_type"

[[mutation]]
id = "binary16-from-binary64-rounds-twice"
area = "field"
describes = "binary64 -> binary16 rounds to nearest twice (through binary32) instead of once, which is not correctly rounded"
file = "include/fuse/model/value_traits.hpp"
old = "    return binary16::from_double(v);"
new = "    return binary16::from_float(static_cast<float>(v));"
target = "fuse_field_value_type_test"
test = "field.value_type"

