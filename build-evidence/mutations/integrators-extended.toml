[[mutation]]
id = "integrators-ssp-coefficient-hardcoded-regression"
area = "num"
describes = "reintroduces an ssp_coefficient defect that was found and fixed (see docs/dev/integrators-design.md): replaces SSPRK104's own COMPUTED ssp_coefficient (from ssp_coefficient_from_shu_osher(), evaluating to 6.0) with a hardcoded literal 1.0 -- the monotonicity test (ExplicitIntegrator.SspMethodsPreserveMonotonicityWithinTheirCoefficientAndViolateItBeyond), which steps at 0.9*C*h_FE and 1.5*C*h_FE using the tableau's OWN ssp_coefficient field, now tests the wrong step sizes and the 'violate beyond' half of the test fails (1.5*1.0*h_FE is comfortably inside SSPRK104's real monotonicity region of C=6, so no violation occurs where one is asserted)."
file = "include/fuse/num/butcher_tableau.hpp"
old = "  t.ssp_coefficient = ssp_coefficient_from_shu_osher(ssprk104_shu_osher());"
new = "  t.ssp_coefficient = 1.0;"
target = "fuse_num_explicit_integrator_test"
test = "num.explicit_integrator"

[[mutation]]
