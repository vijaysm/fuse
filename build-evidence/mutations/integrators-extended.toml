file = "include/fuse/num/continuous_extension.hpp"
old = "    const Scalar h01 = Scalar{-2} * t3 + Scalar{3} * t2;"
new = "    const Scalar h01 = Scalar{-1.9} * t3 + Scalar{3} * t2;"
