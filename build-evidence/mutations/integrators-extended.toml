file = "include/fuse/num/butcher_tableau.hpp"
old = '''  t.name = "SDIRK44";
  t.family = ButcherFamily::Sdirk;
  t.stages = 4;
  t.order = 3;'''
new = '''  t.name = "SDIRK44";
  t.family = ButcherFamily::Sdirk;
  t.stages = 4;
  t.order = 4;'''
target = "fuse_num_order_conditions_test"
test = "num.order_conditions"

[[mutation]]
id = "integrators-dirk-newton-failed-refusal"
area = "num"
describes = "removes DirkIntegrator::step's own diverged-Newton refusal (E-INTEGRATOR-NEWTON-FAILED) by never checking is_diverged() -- DirkIntegrator.NewtonFailsOnAnUnsolvableStiffStepAndIsNamed (which drives an intentionally unsolvable stiff step and asserts the refusal code is exactly E-INTEGRATOR-NEWTON-FAILED) fails because the step silently 'succeeds' with a non-converged stage value instead."
file = "include/fuse/num/dirk_integrator.hpp"
old = '''      if (is_diverged(nr.value().status)) {
        return Failure{kNewtonFailedCode,
                       "DirkIntegrator::step: stage " + std::to_string(i) + " of tableau '" +
                       tableau_.name + "' Newton solve diverged (" +
                       std::string(to_cstring(nr.value().status)) + ") after " +
                       std::to_string(nr.value().iterations) + " iterations, final ||F|| = " +
                       std::to_string(nr.value().final_residual_norm)};
      }'''
new = '''      if (false && is_diverged(nr.value().status)) {
        return Failure{kNewtonFailedCode,
                       "DirkIntegrator::step: stage " + std::to_string(i) + " of tableau '" +
                       tableau_.name + "' Newton solve diverged (" +
                       std::string(to_cstring(nr.value().status)) + ") after " +
                       std::to_string(nr.value().iterations) + " iterations, final ||F|| = " +
                       std::to_string(nr.value().final_residual_norm)};
      }'''
target = "fuse_num_dirk_integrator_test"
test = "num.dirk_integrator"

