# Integrators, extended families (docs/dev/integrators-design.md):
# mutation rows for the DIRK, Rosenbrock, SSP and dense-output refusal paths, the
# additional tableaus, the order-condition-checker product-form bug, the Rosenbrock
# jacobian_action() dispatch, and the SSP-coefficient computation. Each proved by
# tools/mutate.py against build-tier0 (MEASURED).

[[mutation]]
id = "integrators-esdirk324l2sa-coefficient-perturbation"
area = "num"
describes = "perturbs esdirk324l2sa_tableau()'s own A[2][1] (the stage-3, column-2 implicit coefficient, -640167445237/6845629431997 = -0.09354) by roughly 2 percent -- the order checker reads A and B only (C is metadata for the non-autonomous rhs evaluation here, not re-derived from row sums), so ExtendedTableaus.EveryNewTableauSatisfiesExactlyItsDeclaredOrder (order_conditions_test.cpp) catches the broken order-3 condition this introduces -- a same-sized perturbation of C alone, tried first, is invisible to this test for exactly that reason, which is why this row targets A instead."
file = "include/fuse/num/butcher_tableau.hpp"
old = "      {2746238789719.0 / 10658868560708.0, -640167445237.0 / 6845629431997.0, gamma, 0.0},"
new = "      {2746238789719.0 / 10658868560708.0, -640167445237.0 / 6845629431997.0 * 1.02, gamma, 0.0},"
target = "fuse_num_order_conditions_test"
test = "num.order_conditions"

[[mutation]]
id = "integrators-ssprk33-coefficient-perturbation"
area = "num"
describes = "perturbs ssprk33_tableau()'s own B[2] from 2/3 to 0.7 -- sum(B) no longer equals 1, breaking the order-1 condition ExtendedTableaus.EveryNewTableauSatisfiesExactlyItsDeclaredOrder checks for every additional tableau including SSPRK33."
file = "include/fuse/num/butcher_tableau.hpp"
old = "  t.B = std::vector<double>{1.0 / 6.0, 1.0 / 6.0, 2.0 / 3.0};"
new = "  t.B = std::vector<double>{1.0 / 6.0, 1.0 / 6.0, 0.7};"
target = "fuse_num_order_conditions_test"
test = "num.order_conditions"

[[mutation]]
id = "integrators-ssprk104-order4-perturbation"
area = "num"
describes = "SSPRK104's own derived Butcher form (ssprk104_tableau()'s own A, hand-expanded from the Shu-Osher recursion by exact Fraction arithmetic per its own doc comment) is exercised by ExtendedTableaus.Ssprk104SatisfiesOrderFourConditions through order 4; this row perturbs ssprk104_tableau()'s OWN local h6 constant (NOT the separate, same-named constant inside ssp_coefficient.hpp's ssprk104_shu_osher(), which does not reach the A actually used by the order checker) from 1/6 to 0.17, breaking every order condition above order 1."
file = "include/fuse/num/butcher_tableau.hpp"
old = "  constexpr double h6 = 1.0 / 6.0;\n  constexpr double h15 = 1.0 / 15.0;  // (2/5)*h6"
new = "  constexpr double h6 = 0.17;\n  constexpr double h15 = 1.0 / 15.0;  // (2/5)*h6"
target = "fuse_num_order_conditions_test"
test = "num.order_conditions"

[[mutation]]
id = "integrators-order-condition-product-form-regression"
area = "num"
describes = "reintroduces an order-condition-checker bug that was found and fixed (see docs/dev/integrators-design.md): replaces the per-child independently-summed PRODUCT recursion `Phi_i(t) = PRODUCT_k (sum_j m[i][j]*Phi_j(child_k))` with a single shared-sum recursion that collapses every multi-child tree to the same value as a single-child one -- OrderConditions.PerChildProductMatchesTheLiteratureConditions (the test added specifically to catch this class of bug) fails."
file = "include/fuse/num/order_conditions.hpp"
old = '''    for (std::size_t i = 0; i < n_stages; ++i) {
      double prod = 1.0;
      for (int cid : t.children) {
        double s = 0.0;
        for (std::size_t j = 0; j < n_stages; ++j) {
          s += m[i][j] * phi[static_cast<std::size_t>(cid)][j];
        }
        prod *= s;
      }
      phi[tid][i] = prod;
    }'''
new = '''    for (std::size_t i = 0; i < n_stages; ++i) {
      double s = 0.0;
      for (int cid : t.children) {
        for (std::size_t j = 0; j < n_stages; ++j) {
          s += m[i][j] * phi[static_cast<std::size_t>(cid)][j];
        }
      }
      phi[tid][i] = s;
    }'''
target = "fuse_num_order_conditions_test"
test = "num.order_conditions"

