# Mutations for provider plugin fields in every element type in host memory (FUSE_ELEMENT_F32, BF16, F16,
# DD, QD) and their gradient_size (plans/2026-10-22-universal-number-types.md, stage U4).

[[mutation]]
id = "abi-provider-binds-double-double-as-binary64"
area = "abi_provider_typed"
describes = "a provider's FUSE_ELEMENT_DD field is registered as doubles"
file = "src/abi/provider_adapter.cpp"
old = "        case FUSE_ELEMENT_DD:   bound = bind_as(std::type_identity<fuse::num::dd>{}); break;"
new = "        case FUSE_ELEMENT_DD:   bound = bind_as(std::type_identity<double>{}); break;"
target = "fuse_abi_typed_provider_test"
test = "abi.typed_provider"

[[mutation]]
id = "abi-provider-sizes-double-double-as-binary64"
area = "abi_provider_typed"
describes = "the storage allocated for a provider's double-double field holds half the bytes it needs"
file = "src/abi/provider_adapter.cpp"
old = "        case FUSE_ELEMENT_DD:   element_size = sizeof(fuse::num::dd); break;"
new = "        case FUSE_ELEMENT_DD:   element_size = sizeof(double); break;"
target = "fuse_abi_typed_provider_test"
test = "abi.typed_provider"

[[mutation]]
id = "abi-provider-rounds-the-storage-down"
area = "abi_provider_typed"
describes = "the storage of a provider field is its byte count divided by eight, rounded down"
file = "src/abi/provider_adapter.cpp"
old = "        storage_[i].assign((bytes + sizeof(double) - 1) / sizeof(double), 0.0);"
new = "        storage_[i].assign(bytes / sizeof(double), 0.0);"
target = "fuse_abi_typed_provider_test"
test = "abi.typed_provider"

[[mutation]]
id = "abi-provider-counts-two-limbs-in-a-quad-double"
area = "abi_provider_typed"
describes = "a quad-double row is taken for a pair of binary64 numbers per value"
file = "src/abi/provider_adapter.cpp"
