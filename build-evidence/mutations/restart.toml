[[mutation]]
id = "restart-period-index-not-resumed"
area = "runtime/restart (restore_restart_point, the Runner's own clock)"
describes = "restore_restart_point() restores every component's and accelerator's own state but never calls Runner::set_current_period_index() -- the Runner's own clock (Impl::period_index, which ctx.t_begin/ctx.t_end are computed from at the TOP of the next run_period(), src/runtime/runner.cpp) is left at wherever it was before the restore (0, for a freshly-initialize()d Runner), so the first post-restart period recomputes times as if the run had never advanced at all, even though every registered field was correctly restored to its mid-run values. This is a real defect the first implementation attempt had, caught by the test below before it reached the owner -- see docs/dev/restart.md Section 9's own 'measured findings' note."
file = "src/runtime/restart.cpp"
old = """  // The Runner's own clock is not a fuse::Component and restore_restart_
  // fields() does not touch it -- see Runner::set_current_period_index()'s
  // own doc comment for why this call belongs here, after fields succeed,
  // rather than folded into restore_restart_fields() itself.
  runner.set_current_period_index(out_period_index);
  return Result<void>::success();"""
new = """  // MUTATION: period-index resumption disabled.
  // runner.set_current_period_index(out_period_index);
  return Result<void>::success();"""
target = "fuse_runtime_restart_test"
test = "runtime.restart"
result = "CONFIRMED: full unfiltered fuse_runtime_restart_test (14 tests) ran 12 PASSED / 2 FAILED. Restart.SameRankRoundTripSeparateLayout and Restart.SameRankRoundTripGrowingLayout both failed, each on multiple EXPECT_EQ mismatches across q[]/u[]/dirichlet_time/neumann_time/last_period_sweeps -- e.g. a.dirichlet_time (the uninterrupted 5-period reference) read 5, b.dirichlet_time (restore after 3, run 2 more) read 2: the restored run's own two post-restart periods computed StepContext times for periods 0-1 instead of 3-4, because Impl::period_index was never set back to 3. This is the IDENTICAL symptom the diagnostic assertion (test/runtime/restart_test.cpp's own EXPECT_EQ(d->time(), 3.0) immediately after restore, before any further period) proved was NOT the cause -- that check still passes under this mutation, confirming the restored FIELD state is correct and the defect is specifically the Runner's own un-resumed clock, isolated to these two tests. The other 12 tests, none of which calls run_period() again after a restore, still passed. Restored; cmp against the pre-mutation file reported no difference."

[[mutation]]
id = "restart-per-block-key-collapsed-to-id-alone"
area = "num (detail::put_field_per_block/get_field_per_block, round 2's EXACT-KEY fix)"
describes = "Both per-block helpers' own qualified dataset name (name_prefix + '/' + block.field_name) are collapsed to name_prefix alone, in one mutation spanning both functions (the only way to make the old-text anchor unique while mutating both occurrences the real test needs) -- the exact shape round 1's hash-combined key had before round 2 replaced it, now with no key distinguishing field at all: every block of one region's accelerator state writes to the SAME dataset name, so two blocks with identical local ids (dirichlet/neumann's own shape) collide. Anchor re-cut 2026-10-15 after the window_capacity demux refactor renamed the ordinary-case local from count to n_elem and inserted the per-sample branch between the two qualified assignments; the mutated behavior is unchanged."
file = "src/num/accel_relaxation.cpp"
old = """    const std::string qualified = name_prefix + "/" + block.field_name;
    if (block.window_capacity == 0) {
      // Ordinary case, UNCHANGED since round 2's own EXACT-KEY fix: one
      // row per id, contiguous in `flat`.
      const Result<void> r = writer.put_field(
          qualified, block.ids,
          flat.subspan(off * static_cast<std::size_t>(components),
                       n_elem * static_cast<std::size_t>(components)),
          components, static_cast<std::int64_t>(n_elem));
      if (!r.ok()) return r;
      off += n_elem;
      continue;
    }
    // Window-scoped case (KNOWN_ISSUES.md D69, formerly D68): this
    // block's own slice of `flat` is `n_elem * window_capacity` rows,
    // element-major sample-minor (index(e, s) = e*window_capacity + s).
    // Demux into `window_capacity` separate, per-sample, per-element-id
    // sub-datasets -- a strided gather per sample, since the per-sample
    // rows are NOT contiguous in `flat` (they are contiguous per ELEMENT,
    // not per sample).
    const std::size_t cap = block.window_capacity;
    std::vector<double> sample_vals(n_elem * static_cast<std::size_t>(components));
    for (std::size_t s = 0; s < cap; ++s) {
      for (std::size_t e = 0; e < n_elem; ++e) {
        const std::size_t src_row = off + e * cap + s;
        for (int c = 0; c < components; ++c) {
          sample_vals[e * static_cast<std::size_t>(components) +
                      static_cast<std::size_t>(c)] =
              flat[src_row * static_cast<std::size_t>(components) +
                   static_cast<std::size_t>(c)];
        }
      }
      const std::string sample_qualified =
          qualified + "/sample" + std::to_string(s);
      const Result<void> r = writer.put_field(
          sample_qualified, block.ids, std::span<const double>(sample_vals),
          components, static_cast<std::int64_t>(n_elem));
      if (!r.ok()) return r;
    }
    off += n_elem * cap;
  }
  return Result<void>::success();
}

