[[mutation]]
id = "restart-accel-not-implemented-gate-disabled"
area = "runtime (Runner::restore_restart_fields, round 2's NO-SILENT-RESET fix)"
describes = "The restart_state_implemented() collective refusal gate in restore_restart_fields() is disabled (replaced with `if (false)`), so an accelerator that does not implement restart state (QuasiNewtonAccel/IQN-ILS/IQN-IMVJ today) is never refused and never resets through this gate -- the call falls through into import_restart_state(), whose base-class default now unconditionally returns Failure (E-RESTART-NOT-IMPLEMENTED) regardless of the run's own allow_accelerator_reset_on_mismatch setting, so even the opt-in path breaks."
file = "src/runtime/runner.cpp"
old = """    if (!region.accel->restart_state_implemented()) {
      if (!allow_accelerator_reset_on_mismatch) {
        return Failure{
            "E-RESTART-ACCEL-NOT-IMPLEMENTED",
            "restore_restart_fields: region '" + region.name +
                "' accelerator '" + region.accel->name() +
                "' does not implement restart state "
                "(Accelerator::restart_state_implemented() == false) and "
                "the run did not opt into resetting it -- pass "
                "allow_accelerator_reset_on_mismatch=true to accept "
                "Accelerator::reset() for this region instead of a "
                "restored history"};
      }
      region.accel->reset();
      any_accelerator_reset = true;
      continue;
    }"""
new = """    // MUTATION: no-silent-reset gate disabled
    if (false) {
      region.accel->reset();
      any_accelerator_reset = true;
      continue;
    }"""
target = "fuse_runtime_restart_test"
test = "runtime.restart"
result = "CONFIRMED 2026-10-15 (round 2): full unfiltered fuse_runtime_restart_test (17 tests) ran 15 PASSED / 2 FAILED. AccelNotImplementedRefusesWithoutOptIn failed: EXPECT_EQ(rr.error().code, \"E-RESTART-ACCEL-NOT-IMPLEMENTED\") got \"E-RESTART-NOT-IMPLEMENTED\" instead (the gate never ran, so the call fell through into the base-class default). AccelNotImplementedWithAllowResetSucceedsAndReports failed: rr.ok() was false, exact message \"E-RESTART-NOT-IMPLEMENTED: Accelerator::import_restart_state(): IQN-ILS does not override export_restart_state()/import_restart_state()/restart_state_implemented(), so this call cannot be trusted to mean \\\"nothing to restore\\\" -- the caller must check restart_state_implemented() before ever reaching this default\" -- opting in no longer causes a successful reset, because the gate that would call reset() never runs. Every other test, none of which uses an AccelKind the base default ever reaches, still passed. Restored; cmp against the pre-mutation file reported no difference; rebuilt afterward and confirmed 17/17 passing again."
