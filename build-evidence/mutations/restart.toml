result = "CONFIRMED (round 2): full unfiltered fuse_runtime_restart_test (17 tests) ran 15 PASSED / 2 FAILED. AccelNotImplementedRefusesWithoutOptIn failed: EXPECT_EQ(rr.error().code, \"E-RESTART-ACCEL-NOT-IMPLEMENTED\") got \"E-RESTART-NOT-IMPLEMENTED\" instead (the gate never ran, so the call fell through into the base-class default). AccelNotImplementedWithAllowResetSucceedsAndReports failed: rr.ok() was false, exact message \"E-RESTART-NOT-IMPLEMENTED: Accelerator::import_restart_state(): IQN-ILS does not override export_restart_state()/import_restart_state()/restart_state_implemented(), so this call cannot be trusted to mean \\\"nothing to restore\\\" -- the caller must check restart_state_implemented() before ever reaching this default\" -- opting in no longer causes a successful reset, because the gate that would call reset() never runs. Every other test, none of which uses an AccelKind the base default ever reaches, still passed. Restored; cmp against the pre-mutation file reported no difference; rebuilt afterward and confirmed 17/17 passing again."

