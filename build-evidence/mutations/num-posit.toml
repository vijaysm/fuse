[[mutation]]
id = "posit-error-sign-of-a-negative-value-is-not-mirrored"
area = "num_posit"
describes = "the error sign is applied to the signed value, not to its magnitude, so the direction of a tie is wrong for negative results"
file = "include/fuse/num/posit_bits.hpp"
