# Mutations for fuse::num::posit (plans/2026-10-22-universal-number-types.md, stage U5): the
# rounding of a binary64 value to a posit, the decoding of a pattern, the rounding of the
# arithmetic, and the comparison of patterns. The test is num.posit (every pattern and
# boundary of the 16-bit format, a sample of the 32-bit format, the arithmetic against exact values).

[[mutation]]
id = "posit-tie-goes-up"
area = "num_posit"
describes = "a tie between two posits goes to the larger pattern instead of the even one"
file = "include/fuse/num/posit_bits.hpp"
old = "      if (guard) up = sticky || toward > 0 || (toward == 0 && (pattern & 1u) != 0);"
new = "      if (guard) up = sticky || toward > 0 || toward == 0;"
target = "fuse_num_posit_test"
test = "num.posit"

[[mutation]]
id = "posit-sticky-bits-are-ignored"
area = "num_posit"
describes = "bits below the guard bit are ignored, so a value just above a boundary is treated as a tie"
file = "include/fuse/num/posit_bits.hpp"
old = "      if (guard) up = sticky || toward > 0 || (toward == 0 && (pattern & 1u) != 0);"
new = "      if (guard) up = toward > 0 || (toward == 0 && (pattern & 1u) != 0);"
target = "fuse_num_posit_test"
test = "num.posit"

[[mutation]]
