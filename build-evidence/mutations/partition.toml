# Mutations for fuse::partition (the RCB partitioner track). Own file per
# the mutation-manifest protocol (tools/mutate.py's own doc comment): do not
# edit build-evidence/mutations.toml directly while another track holds it
# dirty.

[[mutation]]
id = "partition-classify-bucket-bounds-not-split-value"
area = "partition"
describes = "classify() stops using the median's bucket bounds (bucket_lo/bucket_hi) as the tie region and compares strictly against a single split value instead -- exactly the reproducibility defect rcb_moab's own tie-handling comment warns about: structured-grid coordinates shared by many cells are then classified inconsistently depending on which side of the value floating point puts split_value."
file = "include/fuse/partition/rcb.hpp"
old = "        tag(k) = (c < bucket_lo) ? 0 : (c > bucket_hi ? 1 : 2);"
new = "        const double split_value = 0.5 * (bucket_lo + bucket_hi);\n        tag(k) = (c < split_value) ? 0 : 1;  // no tie classification at all"
target = "fuse_partition_rcb_partition_test"
test = "partition.rcb_partition"

[[mutation]]
id = "partition-median-target-truncates-instead-of-rounds"
area = "partition"
describes = "weighted_median's target weight truncates opts.frac_target * total instead of rounding it (std::llround, copied from rcb_moab/ParallelMedian.cpp verbatim) -- the oracle (test/partition/rcb_oracle.hpp) still rounds, so any fixture whose ideal split lands on a half-weight boundary diverges from it."
file = "include/fuse/partition/median.hpp"
old = "      static_cast<Weight>(std::llround(opts.frac_target * static_cast<double>(total)));"
new = "      static_cast<Weight>(opts.frac_target * static_cast<double>(total));  // truncates"
target = "fuse_partition_rcb_partition_test"
test = "partition.rcb_partition"

[[mutation]]
id = "partition-axis-tie-break-prefers-last-not-first"
area = "partition"
describes = "the longest-current-global-extent axis picker changes its tie-break from 'first axis with the strictly largest extent wins' to 'last axis at least as large wins' -- on a cube fixture where all three axes share one extent, the chosen split axis flips from 0 to 2 at the root, cascading a different partition than the oracle's."
file = "include/fuse/partition/rcb.hpp"
old = "    if (e > best_extent) {"
new = "    if (e >= best_extent) {  // last-wins on a tie, not first-wins"
target = "fuse_partition_rcb_partition_test"
test = "partition.rcb_partition"

[[mutation]]
id = "partition-negative-num-parts-refusal-disabled"
area = "partition"
describes = "the E-PART-NUM-PARTS rejection for a negative num_parts is disabled outright -- the deliberate-rejection rule (docs/dev/testing.md) counts as verified only when a test makes it fire, and refusals_test.cpp's NegativeNumPartsIsRefused is that test."
file = "include/fuse/partition/rcb.hpp"
old = "  const bool locally_num_parts_ok = (opts.num_parts >= 0);"
new = "  const bool locally_num_parts_ok = true;  // opts.num_parts >= 0 -- refusal disabled"
target = "fuse_partition_refusals_test"
test = "partition.refusals"

[[mutation]]
