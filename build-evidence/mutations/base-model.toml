# Mutations for the base/model fix pass (REVIEW.md R-04, R-15, R-19).
# Own file per the review-fix protocol: do not edit build-evidence/mutations.toml
# directly while other fixers hold it dirty.

[[mutation]]
id = "descriptor-accepts-any-convergence-measure-kind"
area = "model"
describes = "deserialize() reverts to admitting any byte as a MeasureKind, the exact gap R-04 fixed (yaml_io.cpp's kMeasureNames index would go out of bounds later, disconnected from the cause)"
file = "include/fuse/model/descriptor.hpp"
old = "      if (measure_kind > static_cast<std::uint8_t>(MeasureKind::ResidualRelative)) {"
new = "      if (false) {"
target = "fuse_model_descriptor_test"
test = "model.descriptor"

