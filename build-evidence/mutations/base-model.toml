[[mutation]]
id = "rational-lcm-denominator-overflows"
area = "base"
describes = "lcm_denominator() reverts to the direct int64_t std::lcm call, reintroducing the overflow gcd_rational's sibling fix removed (R-15)"
file = "include/fuse/base/rational.hpp"
old = """    const detail::Int128 ad = a.den_;
    const detail::Int128 bd = b.den_;
    const detail::Int128 dg = std::gcd(ad, bd);
    const detail::Int128 l = (ad / dg) * bd;  // divide first: no needless growth
    detail::check_fits_i64(l, "Rational::lcm_denominator: denominator lcm overflow");
    return Rational{1, static_cast<std::int64_t>(l)};"""
new = "    return Rational{1, std::lcm(a.den_, b.den_)};"
target = "fuse_base_rational_test"
test = "base.rational"

[[mutation]]
id = "descriptor-accepts-non-positive-unit-scale"
area = "model"
describes = "deserialize() stops rejecting a non-positive field unit scale (R-19), letting a corrupted descriptor introduce a zero (annihilator) or negative (sign-flipping) scale"
file = "include/fuse/model/descriptor.hpp"
old = "    if (!(f.units.scale > Rational{0})) {"
new = "    if (false) {"
target = "fuse_model_descriptor_test"
test = "model.descriptor"

[[mutation]]
id = "compatibility-auto-inserts-negative-unit-scale"
area = "model"
describes = "check_units() stops gating a negative pure-scale conversion factor behind an explicit request (R-19), so it is auto-inserted like an ordinary positive rescale and silently flips the sign of every value crossing the channel"
file = "src/model/compatibility.cpp"
old = "    if (*factor < Rational{0} && !explicit_request)"
new = "    if (false && *factor < Rational{0} && !explicit_request)"
target = "fuse_model_compatibility_test"
test = "model.compatibility"

