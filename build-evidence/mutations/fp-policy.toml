# KNOWN_ISSUES.md D30 ("FpPolicy" track): the one mutation this track adds is
# against the PROBE test, base.fp_policy (test/base/fp_policy_test.cpp).
# CORRECTED 2026-10-12: this row originally carried `requires = "release"`
# on the premise that a Debug build (-O0) never contracts a*b+c, so a
# Debug run of the mutation would prove nothing. That premise is false --
# confirmed directly by disassembly (docs/dev/testing.md's "Floating-point
# contraction policy" section) that -ffp-contract defaults to `on` at
# EVERY optimization level, including -O0. base.fp_policy's own
# `contracted_expression` is a single, unvectorized expression (not a
# reduction loop), so its fusion is governed by -ffp-contract alone and is
# equally visible in Debug and Release; the mutation is hand-proved
# KILLED in both below, and the row carries no `requires` key.

[[mutation]]
id = "fp-policy-dropped-contraction-flag-is-invisible-outside-release"
area = "fp_policy"
describes = "FUSE_FP_REPRODUCIBLE's C/CXX half (fuse_apply_fp_contract_policy_c_cxx(), called from the top-level CMakeLists.txt right after fuse_resolve_dependencies() and before add_subdirectory(src)) is never called at all. This leaves -ffp-contract at the compiler's default (fused, single-rounded) for every FUSE target, in EVERY build type (the default is `on` at -O0 just as much as at -O2/-O3), which base.fp_policy's own precondition test (FpPolicy.ProbeTripleActuallyDistinguishesContraction) already proved distinguishes from the separately-rounded evaluation on this compiler -- so FpPolicy.ContractionIsOffWhenReproducible, which asserts contracted_expression(kA, kB, kC) == two_step_rounded(kA, kB, kC) under FUSE_FP_REPRODUCIBLE==1, fails. This id's own name (\"...invisible-outside-release\") is now inaccurate after the correction below and is kept rather than renamed, to avoid invalidating any reference to it; the `describes` field here is the authoritative, corrected account."
file = "CMakeLists.txt"
old = "fuse_apply_fp_contract_policy_c_cxx()\nadd_subdirectory(src)"
new = "# [mutated] fuse_apply_fp_contract_policy_c_cxx() not called\nadd_subdirectory(src)"
target = "fuse_base_fp_policy_test"
test = "base.fp_policy"
result = "Hand-proved KILLED in BOTH build types, 2026-10-12. Release (/tmp/fppolicy/build-release, CMAKE_BUILD_TYPE=Release, FUSE_FP_REPRODUCIBLE=ON): clean tree base.fp_policy PASSED 2/2; under the mutation FAILED 1 (FpPolicy.ContractionIsOffWhenReproducible: contracted_expression == -4.0672332501391795, two_step_rounded == -4.0672332501391804), PASSED 1 (the precondition test, unaffected). Debug (/tmp/fppolicy/build-debug-on, CMAKE_BUILD_TYPE=Debug, FUSE_FP_REPRODUCIBLE=ON): clean tree base.fp_policy PASSED 2/2; under the SAME mutation FAILED 1 (FpPolicy.ContractionIsOffWhenReproducible, the identical two values), PASSED 1. CMakeLists.txt restored byte-identically after each (cmp verified). mutate.py's own automated engine could not be run on this shared checkout at all: its precondition `git status --porcelain include src` is not clean while other tracks' concurrent edits sit in include/fuse/model and src/model -- both hand-proofs above used the same apply/build/run/restore steps the engine would, by hand."
