# The REAL Alltoallv-based summation inside accumulate_remap_halo's
# `#if FUSE_HAVE_MPI` branch needs a real communicator to exercise at all
# (this sandbox cannot initialise MPI, KNOWN_ISSUES.md C1), so it is NOT
