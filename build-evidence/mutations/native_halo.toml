# actually run are. test/parallel/native_halo_mpi_test.cpp's own
# AccumulateRemapHaloRoundTripsExactly row is the host-run proof for the
# summation itself.

[[mutation]]
id = "accumulate-remap-halo-ghost-count-mismatch-not-checked"
area = "backend"
describes = "accumulate_remap_halo's own ghost_n-must-match-the-exchanger's-pattern check (native_halo.hpp's own contract) is removed, so a caller passing a ghost_n that disagrees with the exchanger's own ghost_size() is silently accepted instead of refused E-MESH-ARG."
file = "src/backend/native_halo.cpp"
old = "  if (ghost_n != exchanger.ghost_size()) {"
new = "  if (false) {"
target = "fuse_backend_native_halo_test"
test = "backend.native_halo"

[[mutation]]
id = "accumulate-remap-halo-zero-ghost-noop-skipped"
area = "backend"
describes = "The ghost_n == 0 no-op short-circuit is removed, so a serial (or already-fully-folded) call falls through into the PackedExchanger dynamic_cast below -- make_serial_exchanger()'s object is not a PackedExchanger, so this flips a documented successful no-op into an E-MESH-HALO refusal."
file = "src/backend/native_halo.cpp"
old = "  if (ghost_n == 0) {"
new = "  if (false) {"
target = "fuse_backend_native_halo_test"
test = "backend.native_halo"

[[mutation]]
