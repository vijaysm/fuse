# Mutations for KNOWN_ISSUES D27: fuse::native::accumulate_remap_halo's
# argument-validation and no-op refusals (src/backend/native_halo.cpp). Own
# file per the review-fix protocol: do not edit build-evidence/mutations.toml
# directly while other fixers hold it dirty.
