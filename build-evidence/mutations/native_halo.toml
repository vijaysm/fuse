area = "backend"
describes = "The null-owned/null-ghosts guard is removed, so a caller handing a null buffer with outstanding ghosts is not refused E-MESH-ARG before the function would otherwise dereference it."
file = "src/backend/native_halo.cpp"
old = "  if (owned == nullptr || ghosts == nullptr) {"
new = "  if (false) {"
target = "fuse_backend_native_halo_test"
test = "backend.native_halo"

[[mutation]]
id = "accumulate-remap-halo-missing-packed-exchanger-facet-not-checked"
area = "backend"
describes = "The PackedExchanger dynamic_cast null-check is removed, so a GhostExchanger that reports outstanding ghosts but implements no PackedExchanger facet (a caller/factory mismatch native_halo.hpp's own contract names explicitly) is not refused E-MESH-HALO -- the function proceeds to call through a null pointer instead. Lives inside accumulate_remap_halo's own `#if FUSE_HAVE_MPI` branch (native_halo.cpp), so a tier-0 (no-MPI) build never compiles this line at all -- confirmed empirically: the SAME test (NoPackedExchangerFacetRefusesWithEMeshHalo) passes unchanged with this mutation applied under fuse_backend_native_halo_test's tier-0 configuration, because the mutated line is dead code there, not because the test is weak. requires = \"mpi\" marks it NOT-ASSESSED rather than falsely KILLED, the same courtesy the transport mutations already use (KNOWN_ISSUES D5's own history)."
file = "src/backend/native_halo.cpp"
old = "  if (packed == nullptr) {"
new = "  if (false) {"
target = "fuse_backend_native_halo_test"
test = "backend.native_halo"
