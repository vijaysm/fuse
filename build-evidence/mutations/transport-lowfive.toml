[[mutation]]
id = "binding-table-skips-the-duplicate-field-check"
area = "transport"
describes = "LowFiveFieldBindingTable::add() silently accepts rebinding a field_name that already has an HDF5 path, instead of refusing with E-LOWFIVE-DUPFIELD"
file = "include/fuse/transport/lowfive.hpp"
old = """    if (find_by_field(binding.field_name) != nullptr) {
      return Failure{"E-LOWFIVE-DUPFIELD","""
new = """    if (false && find_by_field(binding.field_name) != nullptr) {
      return Failure{"E-LOWFIVE-DUPFIELD","""
target = "fuse_transport_lowfive_test"
test = "transport.lowfive"

[[mutation]]
