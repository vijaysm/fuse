[[mutation]]
id = "move-allows-the-single-process-roundtrip-in-distributed-mode"
area = "transport"
describes = "LowFiveTransport::move() drops its distributed-mode refusal (E-TRANSPORT-LF-DISTRIBUTED), so a caller that already switched to DistMetadataVOL via set_intercomm() would silently attempt the single-process write-then-read-back round trip instead of being told to drive the exchange through serve_as_producer()/receive_as_consumer()"
file = "src/transport/lowfive_transport.cpp"
old = """#if FUSE_LOWFIVE_HAVE_DIST
  if (p->distributed) {
    return Failure{"E-TRANSPORT-LF-DISTRIBUTED","""
new = """#if FUSE_LOWFIVE_HAVE_DIST
  if (false && p->distributed) {
    return Failure{"E-TRANSPORT-LF-DISTRIBUTED","""
target = "fuse_transport_lowfive_test"
test = "transport.lowfive"
# Needs set_intercomm() to have actually SUCCEEDED (real MPI_Init plus a
# formed intercommunicator) to reach this branch at all -- the test binary
# never has one (fuse_test_main is single-process, and per this track's
# report MPI cannot start in the sandbox this was written in). Same
# honesty as the five pre-existing `requires = "mpi"` rows in
# transport-runtime.toml and native-mesh.toml: recording a pass here would
# be evidence worse than none.
requires = "mpi"

[[mutation]]
id = "lowfive-external-delivery-suspension-removed"
area = "runtime"
describes = "Unit 3 (S6 phase 3, Conformance), item 2(a) of the rewrite: Runner::Impl::deliver_external()'s own IMPORTER suspension (co_await detail::ExternalSuspend, the second of the two suspend points this function now has -- the first, the exporter's own, added this round to fix KNOWN_ISSUES.md D14) is removed, restoring a no-op for that half: resume_period() runs straight through the importer's own half of the delivery instruction without ever stopping there, so the consumer reads the arc before the application's own out-of-band write (the harness's deliver()/memcpy stand-in) has any chance to run."
file = "src/runtime/iteration.cpp"
old = """    if (comp->is_externally_driven()) {
      ExternalAdvanceRequest req;
      req.component = importer_decl.name;
      req.is_delivery_due = true;
      req.delivery_instruction_index = instruction_index;
      req.delivery_field = delivery_field;
      pending_external_request = std::move(req);
      co_await detail::ExternalSuspend{&active_handle};
    }"""
new = """    if (false) {  // MUTATED: importer's own suspension removed.
      ExternalAdvanceRequest req;
      req.component = importer_decl.name;
      req.is_delivery_due = true;
      req.delivery_instruction_index = instruction_index;
      req.delivery_field = delivery_field;
      pending_external_request = std::move(req);
      co_await detail::ExternalSuspend{&active_handle};
    }"""
target = "fuse_verification_brusselator_lowfive_harness_test"
test = "verification.brusselator_lowfive_harness"
result = "PROVED BY HAND (tools/mutate.py --check-anchors refuses against this uncommitted tree, the same constraint recorded for every row in this file). Updated this round from its own prior form, whose old/new text targeted deliver_external()'s single, now-superseded importer-only suspend block (req.component = decl.name) -- this function was rewritten this round to suspend for the exporter too (KNOWN_ISSUES.md D14), so the anchor now targets the importer's own half specifically, by req.component = importer_decl.name. Applied directly to the ordinary bafter build: BrusselatorLowFiveHarness.ExternalDeliveryMatchesInProcessRunnerJacobi failed exactly as predicted -- fuse_begin_step() returned FUSE_ERR_STATE (-3, E-ABI-STEP-ORDER) at step 11 (component U), since with the importer's own suspend removed the Runner's own instruction stream skips straight past the point the harness expects to drive V, so the next call it makes is asked out of turn. Restored from a /tmp backup; cmp reported no difference; rebuild confirmed all three BrusselatorLowFiveHarness cases pass again."

