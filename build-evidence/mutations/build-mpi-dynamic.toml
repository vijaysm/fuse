[[mutation]]
id = "mpi-dynamic-layout-n-of-n-loosened"
area = "build_mpi_dynamic"
describes = "fuse_mpi_dynamic_layout_working() stops requiring passed == total: any record that matched the p/n shape counts as working, so a layout measured 1 of 3 would still enable its row."
file = "cmake/FuseMpiDynamic.cmake"
old = "    string(REGEX MATCH \"^([0-9]+)/([0-9]+)$\" _m \"${record}\")\n    if(_m AND CMAKE_MATCH_1 STREQUAL \"${CMAKE_MATCH_2}\")\n      set(_working TRUE)\n    endif()"
new = "    string(REGEX MATCH \"^([0-9]+)/([0-9]+)$\" _m \"${record}\")\n    if(_m)\n      set(_working TRUE)\n    endif()"
target = "fuse-coupler-base"
test = "build.mpi_dynamic_cache_decisions"
result = "KILLED by hand on a scratch copy of cmake/FuseMpiDynamic.cmake: tools/check-mpi-dynamic-cache.cmake's layout_working and row_enabled rows fail (6 of 6 rows that depend on a sub-N/N record now read TRUE), cmake -P exits 1; the unmutated and restored copies exit 0."

[[mutation]]
id = "mpi-dynamic-layouts-missing-record-is-a-measurement"
area = "build_mpi_dynamic"
describes = "fuse_mpi_dynamic_layouts_missing() stops reporting an empty per-layout record as missing. A verdict cached before this record existed (or one from a build directory that predates it) would then be reused without ever probing the multi-rank layouts -- exactly the D35 defect this entry's own per-layout record exists to not repeat."
file = "cmake/FuseMpiDynamic.cmake"
old = "function(fuse_mpi_dynamic_layouts_missing cached_layouts out)\n  if(\"${cached_layouts}\" STREQUAL \"\")\n    set(${out} TRUE PARENT_SCOPE)\n  else()\n    set(${out} FALSE PARENT_SCOPE)\n  endif()\nendfunction()"
new = "function(fuse_mpi_dynamic_layouts_missing cached_layouts out)\n  set(${out} FALSE PARENT_SCOPE)\nendfunction()"
target = "fuse-coupler-base"
test = "build.mpi_dynamic_cache_decisions"
result = "KILLED by hand on a scratch copy: layouts_missing(|TRUE) now reads FALSE, cmake -P exits 1 naming that row; the unmutated and restored copies exit 0."

[[mutation]]
id = "mpi-dynamic-layouts-value-owner-override-ignored"
area = "build_mpi_dynamic"
describes = "fuse_mpi_dynamic_layouts_value() always follows the fresh probe, never keeping an owner's own hand edit to FUSE_MPI_DYNAMIC_LAYOUTS -- the same class of defect build-mpi-dynamic-option-never-follows-the-probe names for the boolean option, here for the per-layout string record."
file = "cmake/FuseMpiDynamic.cmake"
old = "  if(\"${previous_value}\" STREQUAL \"${previous_auto}\")\n    set(${out} \"${new_value}\" PARENT_SCOPE)\n  else()\n    set(${out} \"${previous_value}\" PARENT_SCOPE)\n  endif()\nendfunction()"
new = "  set(${out} \"${new_value}\" PARENT_SCOPE)\nendfunction()"
target = "fuse-coupler-base"
test = "build.mpi_dynamic_cache_decisions"
result = "KILLED by hand on a scratch copy: layouts_value(1+1:3/3|1+1:0/3|1+1:2/3|1+1:3/3) now reads '1+1:2/3' instead of the expected '1+1:3/3' (the owner's kept edit), cmake -P exits 1; the unmutated and restored copies exit 0."

[[mutation]]
id = "mpi-dynamic-parse-probe-output-unanchored"
area = "build_mpi_dynamic"
describes = "fuse_mpi_dynamic_parse_probe_output()'s own regex drops its ^...$ anchors, so a LAYOUT-shaped token appearing anywhere inside a longer diagnostic or comment line -- not just a real result line -- is read as a measurement."
file = "cmake/FuseMpiDynamic.cmake"
old = "    string(REGEX MATCH \"^LAYOUT ([0-9]+\\\\+[0-9]+) PASSED ([0-9]+) OF ([0-9]+)$\" _m \"${_line}\")"
new = "    string(REGEX MATCH \"LAYOUT ([0-9]+\\\\+[0-9]+) PASSED ([0-9]+) OF ([0-9]+)\" _m \"${_line}\")"
target = "fuse-coupler-base"
test = "build.mpi_dynamic_cache_decisions"
result = "KILLED by hand on a scratch copy: the noisy-stdout test row's own planted comment line ('# example: LAYOUT 9+9 PASSED 9 OF 9 would be a token if this comment line were not anchored') is now parsed as a real token, cmake -P exits 1; the unmutated and restored copies exit 0."
