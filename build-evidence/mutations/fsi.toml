[[mutation]]
id = "fsi-energy-diag-closure-drops-imaginary-eigenvalue-contribution"
area = "test/verification"
describes = "drops Im(lambda)^2 from the redesigned energy-budget closure's own |lambda|^2: the chosen mode's eigenvalue is genuinely complex (arg ~4.39 deg, not real), so |lambda|^2 = Re(lambda)^2 + Im(lambda)^2 is itself part of what the closure check verifies, not an incidental detail -- a mutation that silently drops the imaginary contribution is exactly the kind of defect the rotation-invariant Q(x)+Q(x_im) construction exists to make visible, rather than hiding it the way a real-eigenvalue-only identity would."
file = "test/verification/fsi_energy_diag_test.cpp"
old = "  const double lambda_osc_mag2 = a_osc * a_osc + b_osc * b_osc;"
new = "  const double lambda_osc_mag2 = a_osc * a_osc;"
target = "fuse_verification_fsi_energy_diag_test"
test = "verification.fsi_energy_diag"
# PROVED (Release+FUSE_FP_REPRODUCIBLE=OFF):
#   FsiEnergyDiag.FullBudgetOnTheDominantModeCloses FAILS at the new
#   top-level closure assertion -- E1_total=3.834e-04 vs the (wrong)
#   predicted |lambda|^2*E0_total=3.811e-04 (using the mutated,
#   imaginary-part-free lambda_osc_mag2), mismatch=2.249e-06 against a
#   derived tolerance of 7.209e-12, a ratio of 3.12e5 -- off by more than
#   5 orders of magnitude. Restored and confirmed byte-identical with cmp
#   before moving on.

[[mutation]]
id = "fsi-traction-is-the-force-on-the-fluid"
area = "fsi"
describes = "The root cause of an earlier instability, reproduced exactly: the wall traction delivered to the beam carries the sign of the force on the FLUID (-p + 2 mu dv/dy) instead of on the wall. A negative added mass: the coupled step map's spectral radius was 1.115466 on the diagnostic grid and the energy grew 1.228 per step, while every self-consistency check (power balance, adjointness, energy budgets) passed, because each compared the delivered vector with itself. Killed only by a test that states the physics: a pressurised field transfer pushes its wall outward, and accelerating the wall away from the fluid is opposed."
file = "examples/fsi_channel/stokes_solver.hpp"
old = "        traction[i] = p_wall_mid - 2.0 * p_.mu * dvdy_mid;"
new = "        traction[i] = -p_wall_mid + 2.0 * p_.mu * dvdy_mid;"
target = "fuse_verification_fsi_coupled_test"
test = "verification.fsi_coupled"

[[mutation]]
id = "fsi-energy-diag-interface-balance-sign-flip"
area = "test/verification"
describes = "flips the interface power balance's own comparison back to the pre-fix subtraction (dE_beam_naive - W_wall_current instead of +) -- the exact sign-convention defect the gated assertion exists to catch: W_wall_current is signed as power flowing INTO the fluid (this file's own energy-identity derivation), the NEGATIVE of what the beam receives at a kinematically-matched interface, so the two terms must be added, not subtracted, for the identity to close."
file = "test/verification/fsi_energy_diag_test.cpp"
old = "  const double interface_sum = dE_beam_naive + gen.id.W_wall_current;"
new = "  const double interface_sum = dE_beam_naive - gen.id.W_wall_current;"
target = "fuse_verification_fsi_energy_diag_test"
test = "verification.fsi_energy_diag"
# PROVED (Debug build, both policies;
#   cmake/FuseSlowTests.cmake's own Release-build average for this target
#   is 123.9 s -- a Debug run of the full 6-test target took
#   28.7 s (ON) / 19.6 s (OFF), itself a "slow"-labelled row):
