area = "test/verification"
describes = "reverts dE_beam_naive's dt factor from dt_delivered (rationalize_dt(c.dt).to_double(), the dt the coupling graph's component interval actually quantizes to and the production run actually advanced on) back to the literal c.dt -- the exact defect the delivered dt fixes. The two differ by a relative 4.6e-7 (c.dt-dt_delivered = -1.613339e-09 on this mode's own dt=3.51042838666104032e-03), small enough that a tolerance not specifically derived to be tighter than it would pass regardless of whether the identity were evaluated against the dt the run actually took."
