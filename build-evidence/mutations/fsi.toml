# Mutations for the FSI field transfer (examples/fsi_channel/**,
# test/verification/fsi_*).
#
# Each row below was proved BY HAND (tools/mutate.py was not run except
# --check-anchors): the edit in `old`/`new` was applied directly to the
# named file, the named target was rebuilt, the named test was run and
# observed to fail with the message quoted in its own comment, then the
# file was restored and verified byte-identical to a backup with `cmp`
# before the next row.

[[mutation]]
id = "fsi-beam-fd-stencil-center-coefficient"
area = "examples/fsi_channel"
describes = "changes the clamped-clamped Euler-Bernoulli 5-point w_xxxx stencil's centre coefficient from 6 to 5, breaking the finite-difference approximation of the fourth derivative -- destroys second-order spatial accuracy for the static-deflection solves and the natural-frequency eigenproblem alike, since both are built on the same stiffness assembly."
file = "examples/fsi_channel/beam_solver.hpp"
old = "    const double coeff[5] = {1.0, -4.0, 6.0, -4.0, 1.0};  // offsets -2..2"
new = "    const double coeff[5] = {1.0, -4.0, 5.0, -4.0, 1.0};  // offsets -2..2"
target = "fuse_verification_fsi_beam_test"
test = "verification.fsi_beam"
# PROVED: 3 of 4 tests failed --
#   FsiBeam.StaticDeflectionUnderUniformLoadConvergesAtSecondOrder,
#   FsiBeam.StaticDeflectionUnderLinearLoadConvergesAtSecondOrder,
#   FsiBeam.FirstNaturalFrequencyConvergesAtSecondOrder measured order 0
#   with finest-grid frequency error 25.834444752189079 rad/s against an
#   expected (analytic) natural frequency of 25.834444752189079 rad/s --
#   i.e. relative error exactly 1.0, the measured frequency being off from
#   the true value by a full 100% (completely wrong, not merely degraded).
#   Restored and confirmed byte-identical with `cmp` before moving on.

# Two further candidate mutations (pressure-outlet gauge sign; H^T D's L
# scaling in traction_to_fuse_density) are not proven -- no `old`/`new`
# anchor exists for them, so they are not recorded as rows here (a row
# without a real anchor fails `tools/mutate.py --check-anchors`).

[[mutation]]
id = "fsi-beam-midpoint-load-quarter-dt-coefficient"
area = "examples/fsi_channel"
describes = "changes step_midpoint_load()'s RHS coefficient on the K_*vn term from dt/4.0 to dt/3.0, while leaving the LHS effective-system coefficient (rebuild_effective_midpoint's own dt/4.0) untouched -- breaks the exact algebraic identity M*wddot_avg+K*w_avg=q_mid the method's own derivation relies on, without touching the marginal-stability property a spectral-radius check alone would catch."
file = "examples/fsi_channel/beam_solver.hpp"
old = "    const Eigen::VectorXd rhs =\n        qmid + (mconst / dt) * vn - (dt / 4.0) * (K_ * vn) - (K_ * wn);"
new = "    const Eigen::VectorXd rhs =\n        qmid + (mconst / dt) * vn - (dt / 3.0) * (K_ * vn) - (K_ * wn);"
target = "fuse_verification_fsi_beam_test"
test = "verification.fsi_beam"
# PROVED: FsiBeam.MidpointLoadStepConvergesAtSecondOrderInDt
#   FAILS -- self-convergence order measures 0.9428 (required > 1.8),
#   diffs=[1.588e-07, 8.497e-08, 4.402e-08, 2.239e-08] -- a first-order,
#   not second-order, scheme once the RHS/LHS dt/4 coefficients disagree.
#   The other 4 fsi_beam_test cases still PASS unchanged under this same
#   mutation (static solves and the eigenvalue problem don't exercise
#   step_midpoint_load at all); FsiEnergyDiag.
#   BeamAloneStepMapSpectralRadiusIsAtMostOne ALSO still passes (rho moves
#   from 1.0000006573 to 1.0000006905, still comfortably marginal) --
#   confirming the spectral-radius check alone would NOT have caught this
#   specific defect, which is exactly why the self-convergence test (not
#   just the spectral-radius one) is the sentinel for it. Restored and
#   confirmed byte-identical with `cmp` before moving on.

[[mutation]]
id = "fsi-energy-diag-boundary-bt-term-dropped"
area = "test/verification"
describes = "drops the boundary_bt_term correction from measure_full_energy_identity's own closure_residual computation, reverting to the naive (and WRONG) identity (E1_int-E0_int)/dt = interior_viscous_power + pressure_div_power alone -- misses the continuity operator's own B^T contribution from v_wall/u_outflow (boundary velocities referenced by continuity but with no momentum row of their own), which closes the identity to round-off."
file = "test/verification/fsi_energy_diag_test.cpp"
old = "  r.closure_residual =\n      e_interior_change -\n      dt * (r.interior_viscous_power + r.pressure_div_power - boundary_bt_term);"
new = "  r.closure_residual =\n      e_interior_change -\n      dt * (r.interior_viscous_power + r.pressure_div_power);"
target = "fuse_verification_fsi_energy_diag_test"
test = "verification.fsi_energy_diag"
# PROVED: FsiEnergyDiag.
#   EnergyIdentityResidualRevealsWhichHypothesisHolds FAILS -- closure_
#   residual measures 0.013613711065375848 (required < 1e-9*E1 ~=
#   1.17e-11), off by 9 orders of magnitude, confirming this test's own
#   closure check is load-bearing and boundary_bt_term is not a decorative
#   correction. Restored and confirmed byte-identical with cmp before
#   moving on.

[[mutation]]
id = "fsi-energy-diag-beam-identity-dx-beam-coefficient-dropped"
area = "test/verification"
describes = "drops the (1-dx_beam) coefficient on dPE in the beam-side exact Newmark energy identity, reverting to the NAIVE (and WRONG) identity dE_beam = dt*sum(load_in*wdot_avg) alone -- misses that BeamSolver::kinetic_energy() (dx-weighted) and strain_energy() (unweighted) use INCONSISTENT quadratures relative to the pointwise-collocation mass/stiffness the actual step_midpoint_load recurrence uses; the (1-dx_beam) coefficient closes the identity to solver-tolerance precision."
file = "test/verification/fsi_energy_diag_test.cpp"
old = "  const double dE_beam_predicted = dE_beam_naive + (1.0 - dx_beam) * dPE;"
new = "  const double dE_beam_predicted = dE_beam_naive + dPE;"
target = "fuse_verification_fsi_energy_diag_test"
test = "verification.fsi_energy_diag"
# The test FsiEnergyDiag.FullBudgetOnTheDominantModeCloses evaluates the
# budget on the beam's own real-energy oscillatory mode, so the beam-side
# identity code this row mutates is reachable.
# PROVED (final, with beam_identity_tol the Higham-derived bound below and
#   dE_beam_naive using rationalize_dt(c.dt).to_double() instead of literal
#   c.dt): the UNMUTATED baseline passes in BOTH policies (Release+ON margin
#   2534.7x, Release+OFF margin 29183.6x), so this row is a clean
#   pass-to-fail transition in both. Release+ON:
#   FullBudgetOnTheDominantModeCloses FAILS -- mismatch=3.5957217943822611e-06
