# Mutation for Runner::Impl::resolve_regions()'s former cold-start priming of a
# window member's import arc and straddle-tail history indexed the
# PROVIDER's own exported-field buffer (`provider_v0`) using THIS
# member's own exported-field length (`cfg.length`) as the loop bound --
# a real heap-buffer-overflow READ whenever the provider's field is
# smaller. Found by ASan on a cross-resolution two-member window.
#
# IMPORTANT, read before trusting a green run of this row's own `test`:
# an out-of-bounds READ into an adjacent heap allocation does not
# reliably crash or produce an observably wrong value in an ordinary
# (non-sanitized) build -- verified BY HAND: with this mutation applied,
# `runtime.window_runner_mismatched_length` PASSES cleanly under the
# plain Debug build (no crash, no EXPECT/ASSERT failure; the read
# recovers whatever happened to sit in the heap immediately after A's
# 4-element buffer, and the test does not pin down that exact garbage
# value since it is not deterministic). This row exists for
# --check-anchors coverage and for the day this code path grows an
# actual value-level regression test, but the REAL oracle for this
# specific defect is AddressSanitizer: with the SAME mutation applied in
# a `-fsanitize=address,undefined` build, the test aborts with
# "AddressSanitizer: heap-buffer-overflow ... in
# fuse::Runner::Impl::resolve_regions" pointing at the exact mutated
# line, and with the mutation reverted the ASan build passes cleanly.
# Neither run was executed through tools/mutate.py --build-dir (it
# refuses on an uncommitted tree) -- both were proved by hand: the mutation applied
# directly with edit_file, the target rebuilt (once in the ordinary
# tree, once in a separate ASan-flagged tree), run, observed, then the
# file restored and verified byte-identical to a backup with `cmp`
# before the next step.

# RETIRED: the row below (`resolve-
# regions-window-prime-unbounded-provider-read`) mutated a line --
# `const std::size_t prime_count = std::min(cfg.length, provider_length);`
# -- that no longer exists. The whole manual,
# direct-`registry.get(provider_exported_field)`-based import-priming
# block this bound lived in was removed (that read
# is the provider's own LOCAL FieldRegistry entry, not necessarily
# correct cross-rank) and replaced with a second pass that re-runs
# the channel's own COMPILED delivery chain (Transport/Remap/Epoch/
# Sink) once, through `execute()` -- the same bounds-safe, resolution-
# aware code path `run_region()`'s own sweep loop already uses every
# sweep. There is no longer a raw pointer read of the provider's own
# buffer indexed by the CONSUMER's own (possibly larger) length
# anywhere in this function -- the exact shape Defect 2 found -- so the
# defect CLASS this row proved is caught is now eliminated by
# construction, not merely bounded. `runtime.window_runner_mismatched_
# length` (A: 4 values, B: 9, a REAL cross-mesh remap) still passes,
# unchanged, under the new code (full rebuild + `ctest`, 162/162),
# demonstrating the real Remap now
# resolves the length difference correctly rather than the old code's
# silent partial-prime workaround ("a correct REMAP between the two
# resolutions ... this one-time cold-start shortcut has never
# attempted", the very comment this fix deleted).
#
# The nearest analogue in the NEW code is defensive, not correctness-
# critical: `advance_window.cpp`'s [sic -- iteration.cpp's] new
# straddle-history seed bounds `prime_count` by
# `import_slot.total() / cfg.provider_capacity` (the CONSUMER's own,
# already-correctly-sized `window_import` slot -- the real Sink's own
# output, not the provider's buffer). Removing that bound is NOT a
# meaningful mutation: `import_slot` is allocated to exactly
# `cfg.length * cfg.provider_capacity` by `plan_buffers.cpp` for every
# existing fixture, so the two bounds always agree and the mutated line
# produces an identical `prime_count` -- a true no-op, the same "cannot
# demonstrate a difference" caveat this file's own header already
# flagged for the ASan-only case above. No replacement row is recorded
# for it for that reason; a future fixture that genuinely allocates
# `window_import` smaller than `cfg.length * cfg.provider_capacity`
# (none exists today) would be the first one able to exercise it.
