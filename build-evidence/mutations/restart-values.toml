[[mutation]]
id = "restart-anything-widens-into-a-posit"
area = "restart_values"
describes = "a binary64 field is called an exact widening into a posit"
file = "src/model/element_type.cpp"
old = "    if (!f.is_posit) return false;"
new = "    if (!f.is_posit) return t.is_posit;"
target = "fuse_num_restart_values_test"
