# PROVED (this session): this row does NOT fail cleanly -- it HANGS.
# Every rank still believes it owns global rows [0, (j_hi-j_lo)*nx) (every
# rank's own LOCAL band, relabelled as if it started at row 0), so the
# ranks' own row claims now overlap instead of tiling the global index
# space; .DeriveKrylovSolverTolerance (the first case that reaches
# KrylovDiffusionSolver::factor) never returns -- `timeout 30` on a
# direct re-run (--gtest_filter engaging only the Schur/Krylov cases)
# confirms the two Schur cases ahead of it in registration order still
# pass and print normally, then nothing more is printed before the
# timeout kills the process. This is the collective-stranding failure
# mode this track's own "LESSONS FROM TODAY'S HOST RUNS" warns about, not
# a wrong-answer one: a rank whose row claim disagrees with its peers'
# own view of the global index space can leave one of the matrix's own
# ghost-pattern/allgather calls waiting on a peer that already moved on,
# or on one that never participates at all. Restored and verified
# byte-identical with `cmp`; the killed process left no state to clean up
# (the test binary's own in-process threads, not a separate executable).
# Restored and verified byte-identical with `cmp` before submission.

