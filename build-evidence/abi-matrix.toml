#  The ABI test matrix.
#
#  Every row names the test that pins one claim about the participant ABI,
#  the file it lives in, and WHAT MAKES IT FAIL: a row whose failure
#  condition cannot be stated is not a test. tools/check-abi-matrix.py
#  (not yet written) would turn a row whose test or file is missing into a
#  gate failure, the way tools/check-parallel-matrix.py does for the
#  parallel matrix -- until it exists, this file is read by eye.
#
#  `status` records what each row's own test has actually been measured to
#  do, not merely whether it exists:
#    measured-tier-0  the named test runs, and passes, in the ordinary
#                      (no MPI, no LowFive) sandbox ctest suite -- every row
#                      below with this status was confirmed passing in a
#                      single ctest run.
#    built-only        the named test's own file compiles and links clean in
#                      SOME configured tier, but has not been run anywhere
#                      yet -- neither this sandbox (missing a capability it
#                      needs) nor a host (not yet attempted).
#    host-only          the named test needs a capability this sandbox
#                      cannot provide at all (real MPI, chiefly) -- confirmed
#                      to BUILD clean where that applies, awaiting a host run
#                      to turn "builds" into "passes". `requires` names the
#                      missing capability.
#
#  Rules under test are numbered as in docs/dev/abi-design.md, "How
#  arguments cross the boundary".

[[row]]
id = "ABI-GOLDEN-HEADERS"
rule = 1
claim = "types.h and participant.h are exactly what entries.def generates"
file = "test/abi/entries_golden_test.cpp"
test = "AbiGolden.HeadersMatchTheEntryList"
fails_when = "any hand edit to either header, or a .def change without regeneration (runs tools/gen-abi.py --check as a subprocess and asserts exit 0)"
status = "measured-tier-0"

[[row]]
id = "ABI-GOLDEN-SYMBOLS"
rule = 1
claim = "libfuse-abi exports exactly one symbol, fuse_coupler_abi"
file = "test/abi/exported_symbols.golden"
test = "abi.exported_symbols"
fails_when = "nm -g --defined-only on the built library, filtered to text symbols, differs from the one-line golden; also fails if the library is built without -fvisibility=hidden"
status = "measured-tier-0"

[[row]]
id = "ABI-GOLDEN-SIZES"
rule = 3
claim = "every argument struct's sizeof is the committed value, and sizeof(void*) == 8"
file = "test/abi/struct_sizes.golden"
test = "AbiGolden.StructSizesMatchTheTable"
fails_when = "a member is appended into trailing padding (sizeof unchanged -> the golden still matches, so this row is paired with ABI-GROWTH below), or any member is added without updating the golden"
status = "measured-tier-0"

[[row]]
id = "ABI-GROWTH"
rule = 3
claim = "appending a member to any struct in the .def increases its sizeof"
file = "test/abi/entries_golden_test.cpp"
test = "AbiGolden.NoStructHasTrailingPaddingALaterMemberCouldHide"
fails_when = "for any struct, sizeof(struct) > offsetof(last member) + sizeof(last member) rounded to the struct's alignment -- i.e. there is trailing padding a 4-byte append would vanish into. fuse_version_info was the one case (28 bytes of members in 32) and carries a reserved member; the measured table in test/abi/struct_sizes.golden shows zero trailing padding everywhere"
status = "measured-tier-0"

[[row]]
id = "ABI-SHORT-STRUCT"
rule = 2
claim = "a struct_size shorter than the first frozen layout is FUSE_ERR_VERSION, not a misread"
file = "test/abi/struct_size_test.cpp"
test = "AbiStructSize.ShortStructIsRefused"
fails_when = "any entry accepts struct_size = 4 (just the header) for a struct with more members; also for struct_size = 0 and struct_size > FUSE_ABI_MAX_STRUCT_SIZE"
status = "measured-tier-0"

[[row]]
id = "ABI-LONG-STRUCT"
rule = 2
claim = "a struct_size longer than this library's layout (a newer caller) is accepted and the extra bytes ignored"
file = "test/abi/struct_size_test.cpp"
test = "AbiStructSize.LongerStructFromANewerCallerIsAccepted"
fails_when = "an entry refuses or misreads a caller struct padded with trailing bytes to sizeof + 64"
status = "measured-tier-0"

[[row]]
id = "ABI-TABLE-NEGOTIATION"
rule = 2
claim = "a v1 caller runs against a v2 table, and a v2 caller detects a v1 library"
file = "test/abi/negotiation_test.cpp"
test = "AbiNegotiation.V1CallerAgainstV2Table;AbiNegotiation.V2CallerAgainstV1Table"
fails_when = "the v1 caller (compiled against a copy of participant.h with the v1 table) cannot drive a two-component graph through a hand-built v2 table that appends one entry; or the v2 caller does not see struct_size < sizeof(v2) and use the v1 subset"
status = "measured-tier-0"

[[row]]
id = "ABI-FAULT-INJECTION"
rule = 2
claim = "a test can substitute one table entry without relinking"
file = "test/abi/negotiation_test.cpp"
test = "AbiNegotiation.ASubstitutedEntryIsCalledInsteadOfTheLibrarys"
fails_when = "copying the table, replacing begin_step with a stub that returns FUSE_ERR_RUNTIME, and driving a graph does not surface FUSE_ERR_RUNTIME at the first step"
status = "measured-tier-0"

[[row]]
id = "ABI-C-CONSUMER"
rule = 5
claim = "a pure-C program links only libfuse-abi from an install tree and runs a two-component graph"
file = "test/abi/install_consumer/main.c"
test = "abi.install_consumer_c"
fails_when = "the installed header set does not compile as C11 -Wpedantic; the consumer needs any library other than libfuse-abi (checked by the link line); or its result differs from the in-process C++ run of the same graph beyond 0 (EXPECT_EQ on every value: same code, same order)"
status = "measured-tier-0"

[[row]]
id = "ABI-FORTRAN-SIZES"
rule = 3
claim = "C_SIZEOF of every ffuse derived type equals the C sizeof"
file = "test/abi/fortran/sizes_test.f90"
test = "abi.fortran_sizes"
fails_when = "any type's C_SIZEOF differs from struct_sizes.golden (the Fortran program prints its table; the test diffs it against the golden)"
status = "measured-tier-0"

[[row]]
id = "ABI-FORTRAN-CONSUMER"
rule = 5
claim = "a pure-Fortran program links only libfuse-abi-fortran from an install tree and matches the C consumer"
file = "test/abi/fortran/consumer.f90"
test = "abi.install_consumer_fortran"
fails_when = "any value differs from the C consumer's output (same graph, same inputs, EXPECT_EQ semantics via a byte diff of the two programs' printed hexfloat results)"
status = "measured-tier-0"

[[row]]
id = "ABI-EXACT-TIME"
rule = 6
claim = "step bounds cross the boundary exactly"
file = "test/abi/participant_test.cpp"
test = "AbiParticipant.StepBoundsAreTheSchedulesRationals"
fails_when = "begin_step's fuse_step_report.t_begin/t_end differ from the compiled plan's Rational bounds for a 1/3-step component (a double would)"
status = "measured-tier-0"

[[row]]
id = "ABI-EXCEPTION-CONTAINMENT"
rule = 5
claim = "no C++ exception crosses the boundary"
file = "test/abi/participant_test.cpp"
test = "AbiParticipant.AThrowingComponentBecomesRuntimeErrorWithTheMessage"
fails_when = "a graph whose component throws at advance() terminates the process instead of returning FUSE_ERR_RUNTIME with last_error carrying the what()"
status = "measured-tier-0"

[[row]]
id = "ABI-COLLECTIVE-AGREEMENT"
rule = 7
claim = "a failure on one process of a collective entry is reported on every process"
file = "test/parallel/abi_participant_mpi_test.cpp"
test = "AbiParticipantMpi.IsCouplingOngoingAgreesAcrossRanksAfterOnePeriod (ctest row parallel.abi_participant_mpi.2; corrected from the stale parallel.abi_participant.2 this pass found)"
fails_when = "initialize() or begin_step() returns FUSE_OK on one process and an error on another for the same call (a rank-local refusal inside a collective, the class fixed in bb6f57f)"
status = "host-only"
requires = "mpi"

#  Planned mutation rows (added to build-evidence/mutations/abi.toml in
#  Phase 2, once the anchors exist):
#    abi-reader-trusts-a-short-struct      struct_size check removed -> ABI-SHORT-STRUCT
#    abi-writer-sets-the-wrong-size        table.struct_size = 0 -> ABI-TABLE-NEGOTIATION
#    abi-time-rounded-to-double            t_begin built from a double -> ABI-EXACT-TIME
#    abi-exception-escapes                 try/catch removed from one entry -> ABI-EXCEPTION-CONTAINMENT
#    abi-second-symbol-exported            an extra extern "C" function -> ABI-GOLDEN-SYMBOLS

#  ---- the provider direction (adapter host) ----------
#  The coupler calls a plugin (include/fuse/abi/provider.h); one conformance
#  harness, test/abi/conformance_test.cpp, drives ONE graph four ways
#  (native, a C plugin, a Fortran plugin, the participant direction) with
#  EXPECT_EQ against the native run, plus the negative rows below. Mutation
#  rows: build-evidence/mutations/abi-provider.toml.

[[row]]
id = "ABI-PROVIDER-CONFORMANCE"
rule = 1
claim = "a provider, mounted as a native component, a dlopen'd C plugin, a dlopen'd Fortran plugin, or driven through the participant direction, produces the IDENTICAL exchanged value every time, for the lag-1 fixture and the subcycled-mean fixture"
file = "test/abi/conformance_test.cpp"
test = "abi.conformance (ConformanceTest.LagOneGraphAllFourKindsMatchNative, ConformanceTest.SubcycledMeanGraphAllFourKindsMatchNative)"
fails_when = "any of the three non-native kinds disagrees with the native run's recorded history for any period, or fails to run at all"
status = "measured-tier-0"

[[row]]
id = "ABI-PROVIDER-TABLE-VERSION"
rule = 2
claim = "a provider table whose abi_version does not equal FUSE_ABI_VERSION is refused with E-ABI-VERSION, never mounted"
file = "test/abi/conformance_test.cpp"
test = "abi.conformance (ConformanceTest.PluginTableVersionMismatchIsRefused, ConformanceTest.ProviderTableVersionMismatchIsRefused)"
fails_when = "Registry::mount_table/mount_dynamic accepts a table claiming a different abi_version"
status = "measured-tier-0"

[[row]]
id = "ABI-PROVIDER-TABLE-STRUCT-SIZE"
rule = 2
claim = "a provider table struct_size shorter than sizeof(fuse_provider_abi_v1) is refused with E-ABI-VERSION; one longer (a newer plugin) is accepted"
file = "test/abi/conformance_test.cpp"
test = "abi.conformance (ConformanceTest.ProviderTableStructSizeShortIsRefused, ConformanceTest.ProviderTableStructSizeLongFromANewerCallerIsAccepted)"
fails_when = "Registry::mount_table accepts a short table, or refuses a longer one"
status = "measured-tier-0"

[[row]]
id = "ABI-PROVIDER-DESCRIBE"
rule = 1
claim = "a provider whose describe() disagrees with the graph's own field declaration (components or intent) is refused with E-ABI-DESCRIBE naming the field, at register_fields() time"
file = "test/abi/conformance_test.cpp"
test = "abi.conformance (ConformanceTest.PluginDescribeDisagreeingWithTheGraphIsRefused)"
fails_when = "ProviderAdapter::register_fields() binds a field whose describe() entry disagrees with the graph instead of refusing"
status = "measured-tier-0"

[[row]]
id = "ABI-PROVIDER-ADVANCE-FAILURE"
rule = 5
claim = "a provider whose advance() returns a non-FUSE_OK status surfaces as the component's own Result<void> failure through the Runner's normal path, not a silent success or a crash"
file = "test/abi/conformance_test.cpp"
test = "abi.conformance (ConformanceTest.PluginAdvanceErrorSurfacesAsComponentFailure)"
fails_when = "fuse_run() returns FUSE_OK despite the mounted provider's advance() having returned an error"
status = "measured-tier-0"

[[row]]
id = "ABI-PROVIDER-LOAD-REFUSAL"
rule = 4
claim = "a dlopen() failure (missing file, missing fuse_provider_abi symbol) is refused with E-ABI-LOAD carrying dlerror()'s own text, never silently skipped"
file = "test/abi/conformance_test.cpp"
test = "abi.conformance (ConformanceTest.DlopenFailureIsRefusedWithDlerrorText, ConformanceTest.GraphDeclaredPluginWithNoFileIsRefusedAtInitialize)"
fails_when = "Registry::mount_dynamic succeeds against a nonexistent path, or its error message is empty"
status = "measured-tier-0"

[[row]]
id = "ABI-PROVIDER-REGISTRY-DUPLICATE"
rule = 1
claim = "the registry never substitutes: mounting a second provider under an already-mounted name is refused with E-ABI-REGISTRY-DUPLICATE"
file = "test/abi/conformance_test.cpp"
test = "abi.conformance (ConformanceTest.RegistryRefusesADuplicateName)"
fails_when = "a second mount_table()/mount_dynamic() call under a name already mounted succeeds, silently replacing the first"
status = "measured-tier-0"

[[row]]
id = "ABI-PROVIDER-LAUNCH-KIND"
rule = 1
claim = "a component the graph itself declares LaunchMode::Plugin is mounted automatically at fuse_initialize() (never test-injected) and driven in-process through fuse_run(), exactly like a native component"
file = "test/abi/conformance_test.cpp"
test = "abi.conformance (ConformanceTest.GraphDeclaredPluginIsAutoMountedAndRun)"
fails_when = "a graph-declared plugin component is left as the external-step placeholder instead of being mounted, or fuse_run() refuses the graph because of it"
status = "measured-tier-0"

