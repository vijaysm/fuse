#  The parallel coverage matrix — S5.5.
#
#  The plan's S5.5 asks that every cell of the parallel matrix "has a named
#  test or a named refusal", and records that this was "partly satisfied in
#  practice, absent as a gate": rank counts were enumerated by hand in
#  test/CMakeLists.txt and nothing asserted the matrix was covered.
#
#  This file is that assertion's input, and `tools/check-parallel-matrix.py`
#  checks it. Each cell claims either
#    test    = ["Suite.Name", ...]   a GoogleTest case that must EXIST, in a
#                                    file that must be REGISTERED, and (for an
#                                    mpi cell) at the rank counts it names
#    refusal = ["E-CODE", ...]       an error code that must exist in the
#                                    library AND be asserted by some test, so
#                                    that a deliberate refusal counts as
#                                    coverage only when something makes it fire
#    gap     = "why"                 no coverage. The gate COUNTS these and
#                                    exits non-zero: a gap is a fact about the
#                                    library, not a waiver.
#
#  Rows 1-14 are the CommGraph regression matrix of
#  upstream/soma/docs/specs/2026-09-11-comm-graph-design.md §7, transcribed
#  because that document is in the imported parent tree, which is temporary
#  (the namespace ruling). When `upstream/` goes, the matrix must not go with
#  it -- the tests referred to "test 14 of the matrix" while the matrix itself
#  was reachable only through a parent's spec directory.
#
#  Rows A-* are the axes S5.5 names that are not in that spec.

#  HOW TO ADD A CELL -- and why this warning is here.
#
#  Copy every test name out of the source file. Do not type it from memory,
#  from a spec's prose, or from a grep whose output was truncated.
#
#  The first draft of this file got SEVEN names wrong in three distinct ways,
#  and the gate caught all seven:
#    - rows 8 and 14 were invented from the spec's section comments
#      ("bidirectionality via transpose()", "the union communicator is
#      exercised for real") rather than read from the tests, which are really
#      called TheReverseLegIsARelabellingAndCostsNoCollective and
#      TwoIndependentlySplitCommunicatorsAreEnoughToBuildTheGraph;
#    - two A-SPACES names were completed from a grep piped through
#      `cut -c1-95`, which had cut the tails off: the guesses
#      "...ForEveryLayout" and "...ToRoundoff" are really "...ForEveryOp" and
#      "...ToRounding";
#    - A-RANKS claimed rank 1 while the build still ran 2 3 4 5 -- written six
#      messages after that very gap had been found.
#  A-EMPTY additionally named a CommGraph test in the transport's file, which
#  is what `also_in` now exists for.
#
#  A manifest of claims is worth having only because something checks it. That
#  is the point of tools/check-parallel-matrix.py, and it earned its keep on
#  its first run.
#
# ---------------------------------------------------------------------------
# Rows 1-14: the CommGraph regression matrix
# ---------------------------------------------------------------------------

[[cell]]
id = "1-6"
axis = "rank-overlap shape x matching mode"
pins = "the 6-way cross product of (fully-overlapping, fully-disjoint, partially-overlapping) x (GlobalId, NearestNeighbor); each combination is its own failure mode"
file = "test/parallel/comm_graph_test.cpp"
kind = "mpi"
ranks = [1, 2, 3, 4, 5]
test = [
  "CommGraph.FullyDisjointRanksMatchByGlobalId",
  "CommGraph.FullyOverlappingRanksMatchByGlobalId",
  "CommGraph.PartiallyOverlappingRanksMatchByGlobalId",
  "CommGraph.FullyDisjointRanksMatchByNearestNeighbor",
  "CommGraph.FullyOverlappingRanksMatchByNearestNeighbor",
  "CommGraph.PartiallyOverlappingRanksMatchByNearestNeighbor",
]

[[cell]]
id = "7"
axis = "same-rank shortcut"
pins = "a match with both ends on one rank never reaches MpiTransport -- load bearing, not an optimisation, because MpiTransport refuses the spec such a graph produces (R24)"
file = "test/parallel/comm_graph_test.cpp"
kind = "mpi"
ranks = [1, 2, 3, 4, 5]
test = ["CommGraph.AMatchWithBothEndsOnOneRankNeverReachesMpiTransport"]

[[cell]]
id = "8"
axis = "bidirectionality"
pins = "the reverse leg via transpose() fires no second collective build"
file = "test/parallel/comm_graph_test.cpp"
kind = "mpi"
ranks = [1, 2, 3, 4, 5]
test = ["CommGraph.TheReverseLegIsARelabellingAndCostsNoCollective"]

[[cell]]
id = "9-11"
axis = "dimension independence"
pins = "the identical nearest-neighbour fixture in 1D, 2D and 3D"
file = "test/parallel/comm_graph_test.cpp"
kind = "mpi"
ranks = [1, 2, 3, 4, 5]
test = [
  "CommGraph.NearestNeighborIsDimensionIndependentIn1D",
  "CommGraph.NearestNeighborIsDimensionIndependentIn2D",
  "CommGraph.NearestNeighborIsDimensionIndependentIn3D",
]

[[cell]]
id = "12"
axis = "nearest-neighbour tolerance boundary"
pins = "points exactly at, just inside and just outside nn_tolerance -- the refusal boundary, pinned exactly"
file = "test/parallel/comm_graph_test.cpp"
kind = "mpi"
ranks = [1, 2, 3, 4, 5]
refusal = ["E-COMMGRAPH-NOMATCH"]

[[cell]]
id = "13"
axis = "space-filling-curve load balance"
pins = "a deliberately non-uniform (refined-patch) mesh: the splitter partition balances bucket population"
file = "test/parallel/comm_graph_test.cpp"
kind = "mpi"
ranks = [1, 2, 3, 4, 5]
test = ["CommGraph.TheSfcPartitionBalancesBucketPopulationOnARefinedPatch"]

[[cell]]
id = "14"
axis = "union communicator"
pins = "the non-corresponding contiguous/strided pattern driven through two independently MPI_Comm_split-built communicators, not one shared one"
file = "test/parallel/comm_graph_test.cpp"
kind = "mpi"
ranks = [1, 2, 3, 4, 5]
test = ["CommGraph.TwoIndependentlySplitCommunicatorsAreEnoughToBuildTheGraph"]

# ---------------------------------------------------------------------------
# Rows A-*: the axes S5.5 names beyond the CommGraph spec
# ---------------------------------------------------------------------------

[[cell]]
id = "A-OVERLAP-RUNNER"
axis = "rank-overlap shape, end to end through the Runner"
pins = """rows 1-6 test the three shapes at the CommGraph level. This cell is the same three shapes through Runner::initialize + run_period, which is where CommGraph's output is consumed: `peer_plan_needed = !specs_are_disjoint()`, then send_plan()/recv_plan() for peer traffic and local_pairs() for same-rank copies (src/runtime/runner.cpp)."""
file = "test/parallel/runner_transport_test.cpp"
kind = "mpi"
ranks = [1, 2, 3, 4, 5]
test = [
  "RunnerTransport.TheDeliveredFieldDoesNotDependOnTheRankCount",
  "RunnerTransport.SplittingByRankSetReproducesComponentMembership",
]
note = """DISJOINT and FULLY OVERLAPPING only. The fixtures are `fluid_{0, n/2}` / `solid_{n/2, n-n/2}` (disjoint) and `whole_{0, n}` for both components (full overlap, where every match is a local pair). PARTIAL overlap is cell A-OVERLAP-RUNNER-PARTIAL."""

[[cell]]
id = "A-OVERLAP-RUNNER-PARTIAL"
axis = "partially overlapping rank sets, end to end"
pins = """the shape that needs a peer-to-peer plan and same-rank local copies in \
one exchange, through Runner::initialize + run_period: fluid on 0..W-2, solid \
on 1..W-1, each with ITS OWN decomposition of the shared mesh \
(MeshBackend::placed_view, ruled 2026-09-22), and every destination entity \
checked to hold its own global id. The same helper runs the full and disjoint \
shapes, so the three differ only in placement."""
file = "test/parallel/runner_transport_test.cpp"
kind = "mpi"
ranks = [3, 4, 5]
test = [
  "RunnerTransport.APartiallyOverlappingPlacementDeliversEveryEntity",
  "RunnerTransport.AFullyOverlappingPlacementDeliversEveryEntity",
  "RunnerTransport.ADisjointPlacementDeliversEveryEntityThroughTheSameHarness",
]
note = """Ranks 3-5 only: at 2 ranks {0..W-2}/{1..W-1} is {0}/{1}, which is \
disjoint. Compiled here, verdict from a host run -- MPI cannot initialise in \
this sandbox. MOAB's own per-placement decomposition (one ParallelComm per \
component communicator) is not yet implemented, so this is exercised with the \
test backend, and a Remap on a non-default decomposition refuses \
(E-RT-REMAP-PLACEMENT) until weights are built per placement."""

[[cell]]
id = "A-RANKS"
axis = "rank counts, odd included"
pins = "every MPI leg runs at each registered rank count; 3 and 5 are the odd ones, and 5 over 4 entities is what found the accelerator's empty-block refusal"
file = "test/CMakeLists.txt"
kind = "registration"
ranks = [1, 2, 3, 4, 5]
note = """One deliberate exception, which the gate prints as MATRIX-OVERRIDE: `epoch_reconcile` is registered from 2 up. Its first case asserts `world_size() >= 2` rather than skipping, on the written grounds that there is nothing to reconcile on one rank -- so the honest fix when rank 1 was added was to keep that premise true, not to convert the file into three skips. A host run on 2026-09-21 is what surfaced it, along with two other legs whose rank-1 behaviour is still being resolved."""

[[cell]]
id = "A-LAYOUT"
axis = "command-line PE layout: rank count x placement shape"
pins = """the S4 PE-layout driver (examples/layout_driver/main.cpp) built and \
registered at 2, 3 and 4 ranks over identical, disjoint and \
partially-overlapping --comp1/--comp2 placements (partial needs >= 3 ranks), \
with an arrangement at 3 and 4 ranks that puts comp2 on the LOWER range, plus \
WILL_FAIL refusals for min != 0, max != P-1, a reversed range, and --coupler \
(coupler placement is not implemented and must refuse, not silently ignore, \
per E-LAYOUT-COUPLER). Also --mesh/--migrate at 2, 3 and 4 ranks: comp2's \
mesh is comp1's, migrated onto comp2's placement with RCB over the native \
backend, with --check re-verifying MESH data transfer (cell count and \
measure conserved) -- a separate claim from the field-channel --check the \
other rows make; see docs/dev/native-mesh.md."""
file = "examples/CMakeLists.txt"
kind = "registration"
ranks = [2, 3, 4]
note = """This is a REGISTRATION cell, not an `mpi` cell: the driver is one \
binary run at different CLI arguments through explicit add_test() entries in \
examples/CMakeLists.txt, not a fuse_add_mpi_test() gtest target, so the \
checker's TEST(Suite,Name) source match does not apply -- there is no such \
macro in this file to find. The 18 ctest names are \
layout.{2,3,4}.c1-<lo>-<hi>.c2-<lo>-<hi>* (11 valid layouts), \
layout.migrate.{2,3,4}.c1-<lo>-<hi>.c2-<lo>-<hi>* (3 --mesh/--migrate \
layouts), and layout.refuse.{min-nonzero,max-not-last,reversed-range,coupler} \
(4 WILL_FAIL). Compiled and linked in the sandbox (tier 1); mpiexec cannot \
initialise MPI here (KNOWN_ISSUES C1), so every rank's run and every \
refusal's exit code are a host action, not a sandbox one."""

[[cell]]
id = "A-EMPTY"
axis = "empty partitions"
pins = "a rank owning no entity of a field is ordinary, not an error; and an empty RANK SET is refused, which is a different thing"
file = "test/parallel/mpi_transport_test.cpp"
also_in = ["test/parallel/comm_graph_test.cpp"]
kind = "mpi"
ranks = [1, 2, 3, 4, 5]
test = [
  "MpiTransport.RankOwningZeroElementsIsOrdinary",
  "MpiTransport.BuildPlanRejectsEmptyRankSets",
  "CommGraph.ARankWithZeroLocalEntitiesIsOrdinary",
]
refusal = ["E-TRANSPORT-RANKS"]

[[cell]]
id = "A-SPACES"
axis = "host-parallel space vs Serial"
pins = "every kernel gives the Serial oracle's answer on every execution space the build enabled; the space list is one definition so device coverage is a build option rather than a second file that can drift"
file = "test/num/space_kernels_test.cpp"
kind = "typed"
test = [
  "SpaceKernels.AccumulateMatchesTheSerialOracleForEveryOp",
  "SpaceKernels.RemapApplyMatchesADirectTripletProduct",
  "SpaceKernels.ReductionsAgreeWithTheSerialSumToRounding",
  "SpaceKernels.TheSpaceUnderTestIsNamedInTheRecord",
]

[[cell]]
id = "A-REPLICATED"
axis = "replicated source partition"
pins = "a source every rank holds in full -- as after a halo gather -- gives bit-for-bit the same answer at every rank count, and only because accumulation is ordered by source global id"
file = "test/backend/transfer_map_io_test.cpp"
kind = "serial"
test = [
  "TransferMapIo.EveryRankCountGivesBitIdenticalValues",
  "TransferMapIo.TwoWritersReloadAsFourReadersAndReproduceTheValues",
]

[[cell]]
id = "A-PARTITIONED-SERIAL"
axis = "remap halo, one-rank contract"
pins = """the contract every unconditional caller depends on: a serial or one-rank build_remap_halo is a SUCCESSFUL no-op, idempotent, and short-circuits before the covering-set construction -- so a non-spherical pair is not refused with E-MESH-HALO-GEOMETRY on a serial run. Plus both exchange directions' argument refusals, and that an exchange with no halo touches nothing."""
file = "test/backend/remap_halo_test.cpp"
kind = "tier2"
test = [
  "RemapHalo.ASerialCallIsASuccessfulNoOpAndIsIdempotent",
  "RemapHalo.ANonSphericalPairIsNotRefusedInSerial",
  "RemapHalo.TheBookkeepingAgreesWithWhatWasBuilt",
  "RemapHalo.WeightsBuildInSerialWithoutTheParallelRefusal",
  "RemapHalo.TheExchangeChecksItsArgumentsBeforeAnythingElse",
  "RemapHalo.AnExchangeWithNoHaloLeavesTheBufferAlone",
]
note = """Compiles at tier 2 and is UNRUN in the sandbox -- MOAB here is MPI-linked and calls MPI_Init_thread when the backend is constructed, which cannot succeed where MPI will not initialise (KNOWN_ISSUES C1). Its verdict comes from a host run like every other tier-2 test."""

[[cell]]
id = "A-PARTITIONED"
axis = "independently partitioned source"
gap = """The PARALLEL half: a source partitioned independently of the target, where a remap row needs source values the rank does not own. The one-rank contract is now covered (A-PARTITIONED-SERIAL); what is still untested is the case the halo exists for -- `build_remap_halo` with a communicator of more than one, the `E-REMAP-PARALLEL` boundary that moab_backend.hpp itself calls load bearing ("> 1 refuses; == 1 must NOT"), the forward/reverse exchange round trip, and E-MESH-HALO-GEOMETRY on a non-spherical partitioned pair. It needs mpiexec and a non-matching spherical pair, and a REAL one
exists in MOAB's own MeshFiles/unittest: `wholeATM_T.h5m` and `recMeshOcn.h5m`,
both meshes on the sphere. They must be PROJECTED ONTO THE UNIT SPHERE before
intersection -- Intx needs a common radius and theirs is not 1. That pair is the
intended fixture; GenerateCSMesh / GenerateRLLMesh in /opt/moab-tempest/bin stay
a fallback if a particular resolution is wanted."""
[[cell]]
id = "A-SPACES-TRANSPORT"
axis = "host-parallel space, transport and runtime paths"
gap = """Only `space_kernels_test.cpp` is typed over execution spaces, so the space \
axis covers the numerical kernels and not the transport or runtime paths that \
call them. A build with a host-parallel space therefore exercises those paths on \
one space only, whichever the default is."""

[[cell]]
id = "A-NODAL-OWNERSHIP"
axis = "lowest-rank vertex ownership (Nodal fields track)"
pins = "a vertex shared by two ranks -- SharedVertexLineMesh's one-vertex overlap at every internal boundary -- is owned by the LOWER of the two, on every rank count, and both neighbours agree on where the boundary itself sits"
file = "test/parallel/nodal_field_test.cpp"
kind = "mpi"
ranks = [1, 2, 3, 4, 5]
test = ["SharedVertexOwnership.LowestRankOwnsEachSharedVertexAndBoundariesAgree"]
note = "Compiles under FUSE_ENABLE_MPI=ON; UNRUN in the sandbox (MPI cannot initialise here, docs/dev/testing.md). Its verdict comes from a host run like every other mpi cell in this matrix."

[[cell]]
id = "A-NODAL-TRANSPORT"
axis = "plain nodal Transport delivers the correct value to every local copy"
pins = "a ContinuousGLL order-1 field, moved by a plain (non-conservative) channel through a real Runner + Transport, gives every rank's local buffer -- owned or ghost -- the value its global identity implies, at every rank count"
file = "test/parallel/nodal_field_test.cpp"
kind = "mpi"
ranks = [1, 2, 3, 4, 5]
test = ["NodalTransport.EveryLocalCopyMatchesTheGlobalIdentity"]
note = "Compiles under FUSE_ENABLE_MPI=ON; UNRUN in the sandbox. Exercises attach_comm_graphs's dim-0 fix and comm_graph.cpp's existing owned-source/every-destination gather; does NOT exercise consistent_interp.hpp's H operator itself (same-region transfer, no non-matching interface)."

[[cell]]
id = "A-NODAL-ACCUMULATE"
axis = "cross-rank reduction for a distributed H^T target (accumulate_shared_rows)"
pins = "every rank's own local partial contribution to a shared vertex is summed exactly once, not once per holder, and the resulting total is identical wherever it is read back -- on a deliberately non-uniform per-rank partial pattern, plus a manually-assembled global power balance to round-off"
file = "test/parallel/nodal_field_test.cpp"
kind = "mpi"
ranks = [1, 2, 3, 4, 5]
test = [
  "AccumulateSharedRows.SumsEveryRanksPartialExactlyOnceAndDeliversTheSameTotalToEveryHolder",
  "AccumulateSharedRows.ManuallyAssembledPowerBalances",
]
note = "Compiles under FUSE_ENABLE_MPI=ON; UNRUN in the sandbox. Verifies the STANDALONE primitive (include/fuse/transport/comm_graph.hpp's accumulate_shared_rows), called directly -- see the A-NODAL-HT-PARALLEL gap below for why it is not yet called from Runner."

[[cell]]
id = "A-NODAL-HT-PARALLEL"
axis = "H^T on a genuinely distributed nodal target, through Runner"
gap = """PARTIALLY CLOSED (round 3, 2026-09-25): the Runner-level MPI test this cell's own \
round-2 note said was missing NOW EXISTS -- compiled, its own oracle cross-checked without \
MPI, but not yet EXECUTED at more than one real rank. That execution remains this cell's \
one open item.

What closed in round 2 (unchanged, still true): src/runtime/runner.cpp's resolve_remap calls \
Runner::Impl::build_nodal_dist_remap (setup) / apply_nodal_dist_remap (per period) for a \
nodal Remap target on more than one declared rank via method "consistent"/ \
"consistent-transpose"; a null-communicator (fuse::search::kNullComm) code path makes this \
testable at Tier 0 without MPI; InterfaceTransfer.ARemapIntoANodalFieldOnTwoDeclaredRanksIsAcceptedAndMatchesOneRank \
proves a declared two-rank placement with no real second process reproduces the one-rank \
baseline exactly.

What closed in round 3: test/support/partitioned_test_backend.hpp gained \
MultiMeshGeometricBackend -- one (n_cells, RankSet, x_lo, x_hi) Spec PER MESH NAME, reusing \
GeometricLineMesh unchanged for each, closing the "Runner needs ONE MeshBackend but every \
existing two-mesh test backend bakes in a single mesh's shape" gap round 2 left open. \
test/parallel/nodal_remap_runner_test.cpp (NodalRemapRunnerMpi.{DisjointRankSets, \
IdenticalRankSets, PartiallyOverlappingRankSets}) drives a real beam/fluid \
consistent+consistent-transpose channel pair through lower->schedule->initialize->run_period \
at 1-5 ranks, checking H's pointwise exactness, global force conservation and power balance \
to 1e-13, and each rank's beam_load against a ONE-RANK REFERENCE computed IN THE SAME TEST \
(build_consistent_interp_weights on an unpartitioned GeometricLineMesh -- no second job \
launch needed for that part). That reference was cross-checked in this sandbox, without real \
MPI, against apply_distributed_HT itself at comm_handle == kNullComm: agreement to 1.4e-17 \
(round-off) at all 8 beam vertices for n_beam=7, n_fluid=11 -- strong evidence the new test's \
oracle is right and consistent with the exact code path it exercises. Separately, \
InterfaceTransfer.ApplyNodalDistRemapHasAConstantMeasuredPerPeriodAllocationCount measured \
apply_nodal_dist_remap's own per-period cost precisely: 31 allocations/period, constant \
across 8 periods (not zero -- apply_distributed_H/HT build fresh Allgatherv buffers by \
design, a cost already disclosed in round 2, now quantified). Full tier-0 suite still \
passing; full tier-1 (MPI-enabled) build still compiles cleanly with the new test included.

What is STILL open: the new Runner-level MPI test has never actually EXECUTED at more than \
one real rank -- MPI cannot initialise in this sandbox. This cell fully closes once that \
host run exists and reports the same force-conserved/H-exact/power-balanced/matches-the- \
one-rank-reference verdict at 1-5 ranks. Two secondary, honestly-scoped gaps remain open \
alongside it (see KNOWN_ISSUES.md D8's own "What is still open" for the full statement): \
the two NOT-ASSESSED distributed-builder mutations were reconsidered rather than \
mechanically retargeted at the new test (neither this test's nor the primitive test's \
evaluation side ever has a genuinely shared entity, so "row built on every holder" still has \
no real target in EITHER test; "transpose sums in rank order" needs a two-launch comparison \
no single test, Runner-level or not, can perform alone); and the measured 31 \
allocations/period is a number to reduce in a future point-to-point redesign, not yet a fix."""

[[cell]]
id = "A-SEARCH-DISTRIBUTED"
axis = "fuse::search's distributed point-containment query (ArborX::DistributedTree)"
pins = "a fixed global box set split into disjoint contiguous per-rank slices, queried with the same global point set on every rank: the gathered (rank, local index) hits, translated back to global box ids, equal BoxIndex's own serial answer over the whole gathered set -- the escape hatch A-RANKS's own note and test/partition/rcb_mpi_test.cpp use for the same reason (comparing against a single-rank reference the sandbox actually CAN run, rather than against another rank's answer this sandbox cannot obtain either); a second cell checks hits within one query are sorted by (rank, index) directly, independent of what the hits are"
file = "test/search/distributed_mpi_test.cpp"
kind = "mpi"
ranks = [1, 2, 3, 4, 5]
test = [
  "SearchDistributedMpi.MatchesSerialOnTheGatheredInput",
  "SearchDistributedMpi.HitsWithinOneQuerySortedByRankThenIndex",
]
note = "Compiles under FUSE_ENABLE_MPI=ON; UNRUN in the sandbox (MPI cannot initialise here, docs/dev/testing.md) -- the same posture every other mpi cell in this matrix documents for itself. Its verdict comes from a host run."
