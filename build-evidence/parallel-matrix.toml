  "RemapHalo.WeightsBuildInSerialWithoutTheParallelRefusal",
  "RemapHalo.TheExchangeChecksItsArgumentsBeforeAnythingElse",
  "RemapHalo.AnExchangeWithNoHaloLeavesTheBufferAlone",
]
