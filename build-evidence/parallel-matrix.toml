ranks = [1, 2, 3, 4, 5]
note = """One deliberate exception, which the gate prints as MATRIX-OVERRIDE: `epoch_reconcile` is registered from 2 up. Its first case asserts `world_size() >= 2` rather than skipping, on the written grounds that there is nothing to reconcile on one rank -- so the honest fix when rank 1 was added was to keep that premise true, not to convert the file into three skips. A host run is what surfaced it, along with two other legs whose rank-1 behaviour is still being resolved."""

[[cell]]
id = "A-LAYOUT"
axis = "command-line PE layout: rank count x placement shape"
pins = """the PE-layout driver (examples/layout_driver/main.cpp) built and \
registered at 2, 3 and 4 ranks over identical, disjoint and \
partially-overlapping --comp1/--comp2 placements (partial needs >= 3 ranks), \
with an arrangement at 3 and 4 ranks that puts comp2 on the LOWER range, plus \
the --coupler rows (docs/dev/coupler-placement.md): a coupler \
disjoint from both comp1 and comp2 (3 ranks), a coupler identical to \
comp2's own range (3 ranks -- the coupler->target hop elides), and a \
coupler overlapping comp1 without being identical to it (4 ranks). Plus \
WILL_FAIL refusals for min != 0, max != P-1, a reversed range, and --coupler \
together with --mesh (E-LAYOUT-COUPLER; --mesh mode builds no \
field-transfer graph a coupler could attach to -- plain --coupler is not a \
refusal). Also --mesh/--migrate at 2, 3 and 4 ranks: comp2's \
mesh is comp1's, migrated onto comp2's placement with RCB over the native \
backend, with --check re-verifying MESH data transfer (cell count and \
measure conserved) -- a separate claim from the field-channel --check the \
other rows make; see docs/dev/native-mesh.md."""
file = "examples/CMakeLists.txt"
kind = "registration"
ranks = [2, 3, 4]
note = """This is a REGISTRATION cell, not an `mpi` cell: the driver is one \
binary run at different CLI arguments through explicit add_test() entries in \
examples/CMakeLists.txt, not a fuse_add_mpi_test() gtest target, so the \
checker's TEST(Suite,Name) source match does not apply -- there is no such \
macro in this file to find. The 21 ctest names are \
layout.{2,3,4}.c1-<lo>-<hi>.c2-<lo>-<hi>* (11 valid comp1/comp2 layouts), \
layout.coupler.{3.disjoint,3.equals-target,4.overlaps-comp1} (3 --coupler \
layouts), layout.migrate.{2,3,4}.c1-<lo>-<hi>.c2-<lo>-<hi>* (3 --mesh/--migrate \
layouts), and layout.refuse.{min-nonzero,max-not-last,reversed-range,coupler-with-mesh} \
(4 WILL_FAIL). Compiled and linked in the sandbox (tier 1, -DFUSE_ENABLE_MPI=ON, \
including the coupler-placement code); mpiexec cannot \
initialise MPI here, so every rank's run and every \
refusal's exit code are a host action, not a sandbox one. The coupler rows' \
byte-exact and delivery-identical claims are pinned at Tier 0 instead \
(CouplerLowering.CouplerEqualToTargetReproducesTodaysIRExactly, \
Runner.ACouplerNeedsNoComponentAndDeliversTheIdenticalValue) -- these three \
rows verify the same claims survive a real multi-rank launch, not the claims \
themselves."""

