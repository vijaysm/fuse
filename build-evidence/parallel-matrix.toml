[[cell]]
id = "A-NODAL-HT-PARALLEL"
axis = "H^T on a genuinely distributed nodal target, through Runner"
file = "test/parallel/nodal_remap_runner_test.cpp"
kind = "mpi"
ranks = [2, 3, 4, 5]
test = [
  "NodalRemapRunnerMpi.DisjointRankSets",
]
note = """DisjointRankSets is written, with its one-rank reference cross-checked \
without MPI; this row is the matrix claim for it. DisjointRankSets drives the real beam/fluid \
"consistent" (H) / "consistent-transpose" (H^T D) channel pair through a real \
Runner at beam_ranks and fluid_ranks DISJOINT (FUSE_REQUIRE_AT_LEAST_RANKS(2)), \
asserting H exact pointwise for an affine field (1e-12) and H^T D equal to a \
one-rank reference built in the same test (1e-12 relative + 1e-13 absolute, \
nodal_remap_runner_test.cpp's own EXPECT_NEAR) at every local beam vertex, plus \
global force conservation and interface power balance (1e-13 relative) reduced \
across the whole communicator -- exactly the axis this cell names: a Runner-level \
nodal remap exercising the transpose direction on >= 2 ranks on disjoint \
placements. ranks = [2, 3, 4, 5], not 1: FUSE_REQUIRE_AT_LEAST_RANKS(2) skips this \
test at world size 1 (a disjoint split needs two non-empty halves), so claiming \
rank 1 here would not be what check-parallel-matrix.py's own `ranks` check \
promises (every claimed count is registered for the file, which 1 also is -- but \
the DISJOINT axis itself is not exercised there). \
What is STILL open: no \
REAL multi-process (2+ actual ranks) MPI host run has verified this Runner wiring; \
two not-assessed distributed-builder mutations and the \
"domain verdict is not agreed across ranks" one all need a genuine multi-rank \
launch; the 50-allocations-per-coupling-cycle measurement is a number to reduce, \
not yet a fix; and InterfaceDomainPolicy::ClampToBoundary remains unimplemented \
in the distributed builder. None of those bear on THIS cell's own claim (a named, \
registered test exists and asserts the axis), which is what the gate checks. \
The host command is: \
`ctest --test-dir <mpi-build-dir> -R 'parallel\\.nodal_remap_runner' -V`."""

