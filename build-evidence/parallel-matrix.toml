[[cell]]
id = "A-PARTITIONED"
axis = "independently partitioned source"
pins = """the PARALLEL half of A-PARTITIONED-SERIAL's one-rank contract, under a REAL communicator of more than one rank: the `E-REMAP-PARALLEL` boundary moab_backend.hpp itself calls load bearing ("> 1 refuses; == 1 must NOT"), checked on BOTH sides with a generated box pair (needs no mesh file); `E-MESH-HALO-GEOMETRY` firing on that same non-spherical box pair and NOT firing on the real non-matching spherical pair (MOAB's own `wholeATM_T.h5m` / `recMeshOcn.h5m`, projected onto a common unit sphere by `MoabMeshBackend::project_onto_unit_sphere` -- their raw files sit at radius 1 and at Earth radius respectively, so Intx's radius-agreement check would otherwise refuse the pair outright); the forward exchange (`exchange_remap_halo`) delivering every halo slot's owner's value exactly, by global id; and the reverse exchange's (`accumulate_remap_halo`) round trip to an EXACT total, cross-checked against the mesh's own known cell count, which is also this cell's evidence that the halo's send/receive bookkeeping agrees on every rank (a lost or duplicated message breaks the identity outright)."""
file = "test/parallel/remap_halo_mpi_test.cpp"
kind = "mpi"
ranks = [1, 2, 3, 4, 5]
test = [
  "RemapHaloMpi.ERemapParallelRefusesAboveOneRankAndNotAtOne",
  "RemapHaloMpi.EMeshHaloGeometryRefusesTheBoxPairAboveOneRankAndNotAtOne",
  "RemapHaloMpiSphere.TheNonMatchingPairLoadsProjectsAndIsSphericalAtEveryRankCount",
  "RemapHaloMpiSphere.BuildRemapHaloDeliversExactHaloValuesAndRoundTripsExactly",
]
note = """Compiles at tier 2 under FUSE_ENABLE_MOAB AND FUSE_ENABLE_MPI; UNRUN in the sandbox -- MOAB here is MPI-linked and calls MPI_Init_thread when the backend is constructed, which cannot succeed where MPI will not initialise even at one rank. The two RemapHaloMpiSphere cases additionally need `wholeATM_T.h5m` / `recMeshOcn.h5m` discovered via -DFUSE_MOAB_MESHFILES (A-PARTITIONED-SERIAL's own note); absent, they are not compiled at all, never silently skipped. Its verdict comes from a host run like every other tier-2 mpi cell in this matrix."""
[[cell]]
id = "A-SPACES-TRANSPORT"
axis = "host-parallel space, transport and runtime paths"
pins = """the coupling hot loop \
(src/runtime/runner.cpp's execute(), src/runtime/iteration.cpp's run_region()) \
now calls the same typed, space-portable kernels A-SPACES verifies on every \
enabled execution space -- Runner::Impl::HostExecSpace is Kokkos:: \
DefaultHostExecutionSpace, OpenMP here, Serial on a Serial-only build. \
Elementwise ops (Scale, Merge, Residual, Relax, Interpolate/Sample copies, \
Accumulate's finalize, the CSR-converted remap apply) are thread-count- \
independent by construction -- each output element's write touches no other. \
The two per-sweep REDUCTIONS (block value/residual norms) are not: a plain \
Kokkos::parallel_reduce associates by the threads' own schedule, which this \
runtime's bit-for-bit-across-thread-counts requirement cannot use, so they run \
through a NEW fixed-chunk scheme instead (space_kernels.hpp's \
deterministic_dot/deterministic_norm_squared/deterministic_norm_squared_diff). \
Verified at the kernel level (typed, every enabled space, adversarial-magnitude \
data) and at the Runner level (a real 2048-element iteration region -- large \
enough to span several fixed chunks -- registered at every OMP_NUM_THREADS from \
1 to the host's core count). What remains: a device execution space, \
which needs the host-only finalising sum these reductions still do (deep_copy \
first) and the component-boundary host/device mirrors a device build would add."""
file = "test/num/space_kernels_test.cpp"
also_in = ["test/runtime/runner_determinism_test.cpp"]
kind = "typed"
test = [
  "SpaceKernels.CopyScaleAndResidualMatchThePlainArithmetic",
  "SpaceKernels.RemapApplyMultiComponentMatchesApplyWeightsOrder",
  # The test also checks a derived forward-error bound when FUSE_FP_REPRODUCIBLE=OFF, so
  # "...Exactly" alone overstated it in that configuration.
  "SpaceKernels.DeterministicReductionsMatchTheChunkedReferenceExactlyOrWithinTheFpContractionBound",
  "RunnerDeterminism.LargeIterationRegionIsBitIdenticalAcrossThreadCounts",
]

