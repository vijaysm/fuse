[[mutation]]
id = "unlowerable-step-silently-dropped"
area = "compiler"
describes = "an authorized operation the compiler cannot emit is skipped instead of refused"
file = "src/ir/rules_channel.cpp"
old = "      if (!ir_can_emit(step.kind)) {"
new = "      if (false) {"
target = "fuse_ir_scale_test"
test = "ir.scale"
equivalent = """No graph the model can currently express makes the connection check \
authorize a step outside {UnitScale, SpatialTransfer, TemporalTransfer}: the graph has no way \
to declare a transform, and a component-count mismatch is caught earlier by the IR type check \
(E-IR-TYPE). The branch is therefore defensive, and its classification is covered exhaustively \
by Scale.EveryAuthorizableOperationIsEitherEmittedOrRefused. When declared transforms reach the \
graph -- the checker already supports them -- this becomes reachable and must be killed."""

