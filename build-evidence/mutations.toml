[[mutation]]
id = "semantics-hash-ignores-order"
area = "model"
describes = "the semantic hash sums bytes commutatively, so a reordered record hashes alike"
file = "src/model/semantics.cpp"
old = "    return bytes::fnv1a(bytes);"
new = "    std::uint64_t sum = 0; for (auto b : bytes) sum += static_cast<std::uint8_t>(b); return sum;"
target = "fuse_model_semantics_test"
test = "model.semantics"
