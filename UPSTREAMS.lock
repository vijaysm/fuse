verified  = """Standalone configure + build proven against Kokkos 5.1.0 / AppleClang 21 /
CMake 4.3.2 before any fuse:: code was written (the task's own requirement): a
BoundingVolumeHierarchy built over 100 boxes, an intersects (point-in-box) CRS
query, and a k-nearest CRS query, all via ArborX::Experimental::attach_indices
plus a custom index-extracting callback -- ArborX 2.1's own DefaultCallback
does not extract PairValueIndex::index into a plain integer output view (a
real API-shape finding recorded in docs/dev/search.md and box_index.cpp's own
header comment, not an ArborX defect). All three gave the expected indices.
DistributedTree was not run (this sandbox cannot initialize MPI); its headers
were proven only to COMPILE under -DFUSE_ENABLE_MPI=ON, in src/search/distributed.cpp."""

