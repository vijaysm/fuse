name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    name: static gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/check-layering.py
      - run: python3 tools/check-invariants.py

  docs:
    name: docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r docs/requirements.txt
      # A warning in the docs is a defect in the docs.
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html

  # Build and test legs arrive with the first source at S1: tier 0 across both
  # linear-algebra backends and both host execution spaces, then tier 1 at
  # 2/3/4/5 ranks, Release, ASan+UBSan, and the no-exceptions leg. They are not
  # listed here yet because there is no CMakeLists.txt to run -- a leg that
  # cannot run is not a leg.
