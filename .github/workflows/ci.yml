name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    name: static gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/check-layering.py
      - run: python3 tools/check-invariants.py
      # Owner's 2026-10-15 ASCII-only ruling: every tracked source file
      # decodes as pure ASCII except *.md (reviewed by eye) and upstream/
      # (vendored, not edited). Static, sub-second, no build.
      - run: python3 tools/check-ascii.py
      # Byte-identity of upstream/ against the manifest (invariant I8). The
      # stronger --parents form needs the parent repositories and runs locally.
      - run: python3 tools/verify-import.py
      # I9's mutation-evidence record: static, sub-second, no build and no
      # git-clean requirement (--check-anchors only reads build-evidence/*.toml
      # against the source tree). Does not run the mutations themselves --
      # that needs a configured build and runs on the owner's machine (see
      # docs/dev/testing.md) -- but an anchor that drifted out from under its
      # KILLED evidence is now caught here instead of nowhere.
      - run: python3 tools/mutate.py --check-anchors

  docs:
    name: docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r docs/requirements.txt
      # A warning in the docs is a defect in the docs.
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html

  # The upstream-soma leg (imported coupler suite, standalone build) was
  # removed 2026-10-12 (soma-import track): FUSE_BUILD_UPSTREAM_SOMA no longer
  # exists (see CMakeLists.txt), so there is nothing for this leg to configure
  # against. UPSTREAMS.lock's [soma].retired field and docs/dev/soma-import.md
  # record the detachment and what fuse:: still needs from the subtree.

  # Remaining legs arrive with the first fuse:: source at S1: tier 0 across both
  # linear-algebra backends and both host execution spaces, tier 1 at 2/3/4/5
  # ranks, tier 2, tier 3, Release, ASan+UBSan, no-exceptions, and the
  # mutation-evidence gate. The imported spine tree needs MOAB and PETSc and is
  # built on a host, not here -- see UPSTREAMS.lock.

  tier0:
    name: tier 0 (${{ matrix.build }}, ${{ matrix.linalg }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, Release]
        # `kokkoskernels` is not one of FUSE_LINALG_BACKEND's implemented values
        # (cmake/FuseDependencies.cmake's STRINGS property is builtin|eigen) and
        # this leg's configure step would FATAL_ERROR on every run (REVIEW.md
        # R-05). `builtin` is the coupler's own backend and the second leg
        # `docs/dev/testing.md` names as "tier 0 across both linear-algebra
        # backends". review-2026-10-11 BC-1: until this fix, `*+builtin` could
        # not configure at all -- 23 call sites (17 in test/CMakeLists.txt,
        # 6 in examples/CMakeLists.txt; 28 targets once the foreach loops
        # several of those sites share are expanded) linked Eigen3::Eigen
        # unconditionally while cmake/FuseDependencies.cmake creates that
        # target only for the eigen backend (D26 recorded the configure
        # failure; the matrix above predates that record by two days and
        # never recorded the CI consequence). Every Eigen-linked target is
        # now gated behind FUSE_LINALG_BACKEND_IS_EIGEN
        # (test/CMakeLists.txt, examples/CMakeLists.txt), so `*+builtin`
        # configures and runs the rest of the suite; the gated rows'
        # coverage under eigen is unchanged.
        linalg: [eigen, builtin]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libomp-dev
      # fmt, googletest and the linalg backend come through FetchContent at the pinned
      # tags (cmake/FuseDependencies.cmake); the system is not consulted for them (the
      # CMAKE_DISABLE_FIND_PACKAGE_* flags below) and FUSE_ALLOW_FETCH=ON lets
      # fuse_require() build the pinned copy instead of hard-failing, so the leg
      # reproduces the same way on every runner. Kokkos is deliberately NOT disabled:
      # the runner has no system Kokkos to consult anyway, and ArborX's own
      # find_package(Kokkos REQUIRED CONFIG) call (fuse_resolve_arborx(), meant to
      # transparently reuse the Kokkos this configure already fetched) is a hard
      # configure error when CMAKE_DISABLE_FIND_PACKAGE_Kokkos is set on a REQUIRED
      # call -- CMake refuses to disable a REQUIRED find_package.
      - run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build }}
          -DFUSE_LINALG_BACKEND=${{ matrix.linalg }}
          -DFUSE_ALLOW_FETCH=ON
          -DFUSE_BUILD_UPSTREAM_KARMA=OFF
          -DKokkos_ENABLE_SERIAL=ON -DKokkos_ENABLE_OPENMP=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_fmt=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON -DCMAKE_DISABLE_FIND_PACKAGE_Eigen3=ON
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure -LE bench
      - run: cat build/fuse-resolved-dependencies.txt

  tier0-no-exceptions:
    name: tier 0 (no exceptions)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libomp-dev
      # Kokkos is deliberately not disabled for find_package -- see the tier0 leg's
      # comment above; disabling it breaks ArborX's own REQUIRED find_package(Kokkos).
      - run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DFUSE_ENABLE_EXCEPTIONS=OFF -DFUSE_ALLOW_FETCH=ON
          -DFUSE_BUILD_UPSTREAM_KARMA=OFF
          -DKokkos_ENABLE_SERIAL=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_fmt=ON -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_Eigen3=ON
      - run: cmake --build build -j
      # Tests that assert a throw cannot run here by design; the leg proves the
      # library and the non-throwing tests build and pass with the option off.
      - run: ctest --test-dir build --output-on-failure -LE 'throws|bench'
