name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    name: static gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/check-layering.py
      - run: python3 tools/check-invariants.py
      # Byte-identity of upstream/ against the manifest (invariant I8). The
      # stronger --parents form needs the parent repositories and runs locally.
      - run: python3 tools/verify-import.py

  docs:
    name: docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r docs/requirements.txt
      # A warning in the docs is a defect in the docs.
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html

  # Serial / threaded build matrix. Replaces the old "tier 0 / tier 1 / ..."
  # legs with a single matrix that varies the three axes that actually change
  # what compiles: the C/C++ compiler (gcc and clang, the two toolchains the
  # project supports), the CMAKE_BUILD_TYPE (Debug and Release -- FUSE_ASSERT
  # is checked live under NDEBUG on Release), and the linalg facade backend
  # (builtin, the coupler's own QR, and eigen, the second opinion). Every
  # combination resolves Kokkos + ArborX + fmt + Eigen through FetchContent at
  # the pinned tags, so each leg reproduces identically on every runner.
  build:
    name: build (${{ matrix.cc }}, ${{ matrix.build }}, ${{ matrix.linalg }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        build: [Debug, Release]
        linalg: [builtin, eigen]
        include:
          - cc: gcc
            cxx: g++
          - cc: clang
            cxx: clang++
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libomp-dev
      # fmt, googletest, Kokkos, ArborX and Eigen come through FetchContent at
      # the pinned tags (cmake/FuseDependencies.cmake); the system is not
      # consulted for fmt/GTest (the CMAKE_DISABLE_FIND_PACKAGE_* flags below)
      # and FUSE_ALLOW_FETCH=ON lets the pinned copy build instead of hard-
      # failing. Kokkos is deliberately NOT disabled for find_package: ArborX's
      # own find_package(Kokkos REQUIRED CONFIG) is a hard configure error when
      # CMAKE_DISABLE_FIND_PACKAGE_Kokkos is set on a REQUIRED call. Eigen is
      # likewise NOT disabled: it is resolved unconditionally now (several tests
      # and examples link Eigen3::Eigen directly regardless of the facade
      # backend), so find_package is allowed to reuse an installed copy.
      - run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=${{ matrix.build }}
          -DFUSE_LINALG_BACKEND=${{ matrix.linalg }}
          -DFUSE_ALLOW_FETCH=ON
          -DFUSE_BUILD_UPSTREAM_KARMA=OFF
          -DKokkos_ENABLE_SERIAL=ON -DKokkos_ENABLE_OPENMP=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_fmt=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
      - run: cat build/fuse-resolved-dependencies.txt

  # Exceptions-off leg: every FUSE_THROW/ASSERT/REFUSE aborts after its on-error
  # policy instead of unwinding. Kept as its own leg (not a matrix axis) because
  # tests that assert a throw cannot run here by design and are excluded with
  # -LE throws.
  no-exceptions:
    name: build (no exceptions)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libomp-dev
      - run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DFUSE_ENABLE_EXCEPTIONS=OFF -DFUSE_ALLOW_FETCH=ON
          -DFUSE_BUILD_UPSTREAM_KARMA=OFF
          -DKokkos_ENABLE_SERIAL=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_fmt=ON -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure -LE throws

  # Sanitizer leg: AddressSanitizer + UndefinedBehaviorSanitizer on a Debug
  # build with the eigen backend (the backend that pulls in the most third-party
  # code to sanitize). gcc is used because its ASan/UBSan runtime ships with the
  # Ubuntu toolchain and needs no extra package.
  sanitizers:
    name: build (asan+ubsan)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libomp-dev
      - run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DFUSE_LINALG_BACKEND=eigen
          -DFUSE_ALLOW_FETCH=ON
          -DFUSE_BUILD_UPSTREAM_KARMA=OFF
          -DKokkos_ENABLE_SERIAL=ON
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_DISABLE_FIND_PACKAGE_fmt=ON -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

  # MPI leg (tier 1): the transport, CommGraph and epoch machinery across
  # ranks. MPICH is installed from apt so find_package(MPI) resolves; the suite
  # is run at several rank counts the same way a host build would.
  mpi:
    name: build (mpi)
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        build: [Debug, Release]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libomp-dev mpich libmpich-dev
      - run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build }}
          -DFUSE_ENABLE_MPI=ON
          -DFUSE_LINALG_BACKEND=eigen
          -DFUSE_ALLOW_FETCH=ON
          -DFUSE_BUILD_UPSTREAM_KARMA=OFF
          -DKokkos_ENABLE_SERIAL=ON -DKokkos_ENABLE_OPENMP=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_fmt=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure
      - run: cat build/fuse-resolved-dependencies.txt
