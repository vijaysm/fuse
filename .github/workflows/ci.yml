name: ci

on:
  push:
  pull_request:

jobs:
  gates:
    name: static gates
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python3 tools/check-layering.py
      # physics-kit's own naming check (docs/dev/physics-kit.md): KARMA*
      # type prefix, karma_ file prefix, .C extension, scoped to
      # physics-kit/ -- the four directories check-layering.py's own
      # check_legacy() covers do not include it (on purpose: see that
      # function's docstring).
      - run: python3 tools/check-physics-kit-naming.py
      - run: python3 tools/check-invariants.py
      # ASCII-only rule: every tracked source file decodes as pure ASCII
      # except *.md (reviewed by eye) and upstream/ (vendored, not edited). Static, sub-second, no build.
      - run: python3 tools/check-ascii.py
      - run: python3 tools/check-throws-labels.py
      # Byte-identity of upstream/ against the manifest (invariant I8). The
      # stronger --parents form needs the parent repositories and runs locally.
      - run: python3 tools/verify-import.py
      # I9's mutation-evidence record: static, sub-second, no build and no
      # git-clean requirement (--check-anchors only reads build-evidence/*.toml
      # against the source tree). Does not run the mutations themselves --
      # that needs a configured build and runs on a developer machine (see
      # docs/dev/testing.md) -- but an anchor that drifted out from under its
      # KILLED evidence is now caught here instead of nowhere.
      - run: python3 tools/mutate.py --check-anchors

  docs:
    name: docs
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r docs/requirements.txt
      # A warning in the docs is a defect in the docs.
      - run: sphinx-build -W --keep-going -b html docs docs/_build/html
      # The wiki pages are generated from docs/; make sure they still convert.
      - run: python3 tools/docs-to-wiki.py "$RUNNER_TEMP/wiki-out"

  # There is no upstream-soma leg (imported coupler suite, standalone build):
  # FUSE_BUILD_UPSTREAM_SOMA no longer exists (see CMakeLists.txt), so there is nothing for this leg to configure
  # against. UPSTREAMS.lock's [soma].retired field and docs/dev/soma-import.md
  # record the detachment and what fuse:: still needs from the subtree.

  # One matrix, one leg per row, each named for what it builds:
  # <parallelism>+<compiler> (<linalg backend>, <build type>). Every leg
  # resolves Kokkos (Serial, plus OpenMP where noted), ArborX, fmt, googletest
  # and, for eigen, Eigen through FetchContent at the pinned tags
  # (cmake/FuseDependencies.cmake), so each reproduces the same way on every
  # runner. The imported spine tree needs MOAB and PETSc (tiers 2 and 3) and is
  # built on a host, not here -- see UPSTREAMS.lock.
  #
  # Linear-algebra backends: FUSE_LINALG_BACKEND is builtin|eigen. There is no
  # Kokkos(Kernels) backend to build; Kokkos itself, the
  # execution layer, is in every leg.
  #
  # MPI is Open MPI, not MPICH: Ubuntu 24.04's MPICH 4.2.0 starts every rank
  # under mpiexec as a singleton ("rank 0 of 1" twice for -n 2, measured), so no
  # multi-rank row could pass, and its wrappers leak the package's own
  # -flto=auto into every MPI target through FindMPI. An mpi leg spends ~12
  # minutes in configure: the accept/connect probe times
  # out each of its runs on this MPI and then disables that launch mode's rows.
  build:
    name: ${{ matrix.family }}+gnu (${{ matrix.linalg }}, ${{ matrix.build }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      # A push runs the Release legs only, for a fast signal; a pull request
      # runs Debug and Release. Built from axes plus `exclude` alone, with no
      # `include`: an include entry that matches no remaining row becomes a
      # job of its own, which would bring the Debug legs back on a push. Each
      # family's own settings are derived from `matrix.family` below.
      #   serial       -- builtin and eigen, Debug (PR only) and Release
      #   mpi          -- Open MPI, builtin and eigen, Release
      #   ubsan        -- UndefinedBehaviorSanitizer over the whole build,
      #                   fetched dependencies included, builtin, Debug (PR only);
      #                   -fno-sanitize-recover turns any report into a failure
      #   noexceptions -- FUSE_ENABLE_EXCEPTIONS=OFF: every FUSE_THROW/ASSERT/
      #                   REFUSE aborts after its on-error policy instead of
      #                   unwinding, so the throw-asserting tests cannot run
      #                   (-LE throws); eigen, Release
      matrix:
        family: [serial, mpi, ubsan, noexceptions]
        linalg: [builtin, eigen]
        build: ${{ fromJSON(github.event_name == 'pull_request' && '["Debug", "Release"]' || '["Release"]') }}
        exclude:
          - { family: mpi, build: Debug }
          - { family: ubsan, linalg: eigen }
          - { family: ubsan, build: Release }
          - { family: noexceptions, linalg: builtin }
          - { family: noexceptions, build: Debug }
    env:
      # 5-rank rows on a 4-core runner; most mpi rows already set this themselves.
      OMPI_MCA_rmaps_base_oversubscribe: "1"
      UBSAN_OPTIONS: print_stacktrace=1
      # The ubsan leg's flags go in through the environment, not
      # -DCMAKE_<LANG>_FLAGS: CMake seeds each language's flags from these on
      # the first configure, and the install-consumer rows configure a SECOND,
      # standalone project from inside ctest, which only the environment
      # reaches -- without them it links the sanitized libraries without
      # libubsan ("DSO missing from command line"). Empty on every other leg.
      CFLAGS: ${{ matrix.family == 'ubsan' && '-fsanitize=undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer' || '' }}
      CXXFLAGS: ${{ matrix.family == 'ubsan' && '-fsanitize=undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer' || '' }}
      FFLAGS: ${{ matrix.family == 'ubsan' && '-fsanitize=undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer' || '' }}
      FUSE_CI_MPI: ${{ matrix.family == 'mpi' && 'ON' || 'OFF' }}
      FUSE_CI_EXCEPTIONS: ${{ matrix.family == 'noexceptions' && 'OFF' || 'ON' }}
      FUSE_CI_OPENMP: ${{ matrix.family == 'noexceptions' && 'OFF' || 'ON' }}
      FUSE_CI_CTEST_EXCLUDE: ${{ matrix.family == 'noexceptions' && 'throws|bench' || 'bench' }}
    steps:
      - uses: actions/checkout@v4
      # gfortran: with no Fortran compiler the ffuse binding is not built and
      # abi.conformance's FortranPlugin rows refuse with E-ABI-LOAD by design
      # (test/CMakeLists.txt, "No Fortran compiler in this configure"), so the
      # leg would be red for a missing package rather than for a defect.
      - run: >
          sudo apt-get update && sudo apt-get install -y ninja-build libomp-dev gfortran
          ${{ matrix.family == 'mpi' && 'openmpi-bin libopenmpi-dev' || '' }}
      # fmt and googletest are never taken from the system (the
      # CMAKE_DISABLE_FIND_PACKAGE_* flags), and FUSE_ALLOW_FETCH=ON builds the
      # pinned copy of whatever is missing instead of hard-failing. Kokkos is
      # deliberately NOT disabled: ArborX's own find_package(Kokkos REQUIRED
      # CONFIG) is satisfied by the fetched Kokkos through the redirect
      # fuse_resolve_dependencies() writes, and CMake refuses to disable a
      # REQUIRED find_package.
      # -DFUSE_ENABLE_PHYSICS_KIT=ON is the cache default (cmake/
      # FuseDependencies.cmake) already, on every leg in this matrix: none
      # resolves MOAB or PETSc (tiers 2/3), and physics-kit needs nothing
      # beyond what fuse::runtime/backend/num/linalg already need here.
      # Named explicitly so these ARE the tier-0 legs physics-kit's gtest
      # (physics.skeleton) runs on, rather than relying on a default a
      # later change to that option could flip without this job noticing.
      - run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build }}
          -DFUSE_LINALG_BACKEND=${{ matrix.linalg }}
          -DFUSE_ENABLE_MPI=$FUSE_CI_MPI
          -DFUSE_ENABLE_EXCEPTIONS=$FUSE_CI_EXCEPTIONS
          -DFUSE_ALLOW_FETCH=ON
          -DFUSE_BUILD_UPSTREAM_KARMA=OFF
          -DFUSE_ENABLE_PHYSICS_KIT=ON
          -DKokkos_ENABLE_SERIAL=ON -DKokkos_ENABLE_OPENMP=$FUSE_CI_OPENMP
          -DCMAKE_DISABLE_FIND_PACKAGE_fmt=ON
          -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON -DCMAKE_DISABLE_FIND_PACKAGE_Eigen3=ON
      - run: cmake --build build -j
      - run: ctest --test-dir build --output-on-failure -LE "$FUSE_CI_CTEST_EXCLUDE"
      - run: cat build/fuse-resolved-dependencies.txt
